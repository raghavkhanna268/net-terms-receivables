# Web component configuration for Shopify CLI
# Serves both frontend (app UI) and backend (webhooks, auth, API)

roles = ["frontend", "backend"]

[commands]
# Note: vite.config.ts reads PORT from env, so no --port flag needed.
# Shopify CLI runs this without a shell, so $PORT would be literal.
dev = "npm run dev:cf"
build = "npm run build"
