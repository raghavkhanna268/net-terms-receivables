name: Shopify App Release (dev store)

# Sanctioned path to release the Shopify app config + Functions (S12/S13) with
# `shopify app deploy`. Manual only (workflow_dispatch), main only, and gated by
# the `shopify-release` GitHub environment (required reviewer, main-only branch
# policy). The CLI token is an ENVIRONMENT secret of `shopify-release` only.
#
# Guards run before any token is exposed:
#   - scope guard: shopify.app.toml scopes == wrangler.jsonc SCOPES == approved 11
#   - config guard: client_id pinned; no other shopify.app.*.toml (dev store config only)
#   - PII guard: no extension input query requests customer email/phone/name/address
#   - extension guard: repo extensions == scripts/ci/expected-extensions.txt (deploy would
#     DELETE a deployed extension missing from the repo); --allow-deletes is never passed,
#     so the CLI also refuses any deletion non-interactively
#   - deploy-flags guard: this file must never contain the delete/force flags
#   - exclusive-flags guard: preview and allow-updates flags never share the base args
#     (mutually exclusive in CLI 4.9.4; passing both exits 2 before any API call)
# Default is a PREVIEW: `--no-release` creates an app version without releasing it.
# Output: version/status lines plus the CLI error box, redacted (URLs, emails, shop
# domains, token-like strings) and capped; a one-line error class goes to the job
# summary. The token is never echoed and is explicitly masked.
# Does NOT touch PLAN_GATING_ENFORCED, Worker vars, DB, or the cron.
on:
  workflow_dispatch:
    inputs:
      version_message:
        description: "Optional version message (letters, digits, space . , _ : # / ( ) -; max 120)"
        required: false
        default: ""
        type: string
      release:
        description: "Release the new version to users (default false = --no-release preview version only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shopify-app-release
  cancel-in-progress: false

jobs:
  release:
    name: Release app config + functions (dev store)
    # Manual dispatch on main of this repo only (never forks / PRs).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'raghavkhanna268/net-terms-receivables'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shopify-release
    # bash -eo pipefail for every run step, so `cmd | tee` cannot mask a failure.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Release guards (scopes, config, input-query PII, extensions, flags)
        run: |
          python3 scripts/ci/test_shopify_release_guards.py > /dev/null
          python3 scripts/ci/shopify_release_guards.py .

      - name: Validate version message
        id: msg
        env:
          VERSION_MESSAGE: ${{ inputs.version_message }}
        run: |
          if [ "${#VERSION_MESSAGE}" -gt 120 ]; then
            echo "version_message too long (max 120)"; exit 1
          fi
          if [ -n "$VERSION_MESSAGE" ] && ! printf '%s' "$VERSION_MESSAGE" | grep -Eq '^[A-Za-z0-9 .,_:#/()-]+$'; then
            echo "version_message has disallowed characters"; exit 1
          fi
          echo "has_message=$([ -n "$VERSION_MESSAGE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (registry, git deps, target)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            extensions/credit-check-validation -> target
            extensions/hide-terms-payment -> target
          save-if: false

      - name: Run Rust tests (credit-check-validation)
        working-directory: extensions/credit-check-validation
        run: |
          set -o pipefail
          cargo test --verbose 2>&1 | tee test-output.txt
          echo ""
          echo "=== Test Summary ==="
          grep -E "^test result:|^running [0-9]+ test" test-output.txt || true

      - name: Run Rust tests (hide-terms-payment)
        working-directory: extensions/hide-terms-payment
        run: |
          set -o pipefail
          cargo test --verbose 2>&1 | tee test-output.txt
          echo ""
          echo "=== Test Summary ==="
          grep -E "^test result:|^running [0-9]+ test" test-output.txt || true

      - name: Build WASM (credit-check-validation)
        working-directory: extensions/credit-check-validation
        run: |
          cargo build --release --target wasm32-unknown-unknown
          
          # Report WASM size and enforce limits
          # Shopify Functions have a 256KB limit
          # @see https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions
          WASM_FILE="target/wasm32-unknown-unknown/release/credit_check_validation.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(stat -c%s "$WASM_FILE")
            SIZE_KB=$((SIZE / 1024))
            echo "WASM size: ${SIZE_KB} KB ($SIZE bytes)"
            
            # Fail if over 256KB (Shopify Functions hard limit)
            if [ $SIZE_KB -gt 256 ]; then
              echo "✗ WASM size exceeds 256 KB limit (${SIZE_KB} KB)"
              echo "See: https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions#binary-size-tips"
              exit 1
            fi
            
            # Warn if over 200KB
            if [ $SIZE_KB -gt 200 ]; then
              echo "⚠ Warning: WASM size is ${SIZE_KB} KB, approaching 256 KB limit"
            else
              echo "✓ WASM size is within limits"
            fi
          else
            echo "✗ WASM file not found"
            exit 1
          fi

      - name: Build WASM (hide-terms-payment)
        working-directory: extensions/hide-terms-payment
        run: |
          cargo build --release --target wasm32-unknown-unknown
          
          # Report WASM size and enforce limits
          WASM_FILE="target/wasm32-unknown-unknown/release/hide_terms_payment.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(stat -c%s "$WASM_FILE")
            SIZE_KB=$((SIZE / 1024))
            echo "WASM size: ${SIZE_KB} KB ($SIZE bytes)"
            
            if [ $SIZE_KB -gt 256 ]; then
              echo "✗ WASM size exceeds 256 KB limit (${SIZE_KB} KB)"
              echo "See: https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions#binary-size-tips"
              exit 1
            fi
            
            if [ $SIZE_KB -gt 200 ]; then
              echo "⚠ Warning: WASM size is ${SIZE_KB} KB, approaching 256 KB limit"
            else
              echo "✓ WASM size is within limits"
            fi
          else
            echo "✗ WASM file not found"
            exit 1
          fi

      - name: Deploy app version (shopify app deploy)
        env:
          # App Automation Token (Dev Dashboard), ENVIRONMENT secret of `shopify-release`.
          # CLI 4.9.4 reads SHOPIFY_APP_AUTOMATION_TOKEN first (legacy fallback:
          # SHOPIFY_CLI_PARTNERS_TOKEN); client_id comes from shopify.app.toml.
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          RELEASE: ${{ inputs.release }}
          VERSION_MESSAGE: ${{ inputs.version_message }}
          HAS_MESSAGE: ${{ steps.msg.outputs.has_message }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHOPIFY_CLI_NO_ANALYTICS: "1"
          CI: "1"
        run: |
          set -o pipefail
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then
            echo "token_present=false (set environment secret SHOPIFY_APP_AUTOMATION_TOKEN on shopify-release)"
            exit 1
          fi
          # Belt and braces: secrets are masked already, mask the value explicitly too.
          echo "::add-mask::$SHOPIFY_APP_AUTOMATION_TOKEN"
          echo "token_present=true"
          args=(app deploy --config shopify.app.toml --no-color
                --source-control-url "$SOURCE_URL")
          if [ "$HAS_MESSAGE" = "true" ]; then args+=(--message "$VERSION_MESSAGE"); fi
          # In CLI 4.9.4 the preview flag and the allow-updates flag are mutually
          # exclusive (oclif FailedFlagValidationError, exit 2). The preview path needs
          # no confirmation; the release path uses allow-updates only (never deletes).
          if [ "$RELEASE" = "true" ]; then
            args+=(--allow-updates)
          else
            args+=(--no-release)
          fi
          echo "release=$([ "$RELEASE" = "true" ] && echo true || echo false)"
          LOG="$RUNNER_TEMP/deploy.log"
          rc=0
          ./node_modules/.bin/shopify "${args[@]}" > "$LOG" 2>&1 || rc=$?
          # Redact URLs, emails, shop domains and token-like strings, strip ANSI codes.
          redact() {
            sed -E -e 's/\x1b\[[0-9;]*[A-Za-z]//g' \
                   -e 's#https?://[^ )]+#<url>#g' \
                   -e 's#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#<email>#g' \
                   -e 's#[A-Za-z0-9-]+\.myshopify\.com#<shop>#g' \
                   -e 's#(atkn|shp[a-z]{1,4})_[A-Za-z0-9_-]+#<token>#g' \
                   -e 's#[A-Za-z0-9_-]{32,}#<token>#g' "$LOG"
          }
          # Print version/status lines plus the full CLI error/warning box (capped).
          redact | awk '
            /^[[:space:]]*╭/ { inbox = 1 }
            inbox || tolower($0) ~ /version|released|error|fail/ { print }
            /^[[:space:]]*╰/ { inbox = 0 }
          ' | head -n 60 || true
          # One-line error class (no raw text) for the job summary.
          body="$(redact | tr '[:upper:]' '[:lower:]')"
          if [ "$rc" = "0" ]; then cls="none"
          elif printf '%s' "$body" | grep -Eq 'cannot also be provided|nonexistent flag|unexpected argument|missing required flag|expected .* to be one of|following errors? occurred'; then cls="cli_flag_validation"
          elif printf '%s' "$body" | grep -Eq 'token|unauthori[sz]ed|forbidden|401|403|log in|login|authenticat|permission'; then cls="auth"
          elif printf '%s' "$body" | grep -Eq 'configuration|toml|client_id|schema|invalid'; then cls="app_config"
          elif printf '%s' "$body" | grep -Eq 'econn|etimedout|enotfound|fetch failed|network|socket|5[0-9][0-9]'; then cls="network_or_server"
          else cls="unclassified"
          fi
          echo "deploy_error_class=$cls"
          echo "- deploy_error_class: \`$cls\` (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
          # Backstop: any extension removal/deletion mentioned by the CLI is a hard fail.
          if grep -Eiq '(extension|module).*(remov|delet)|(remov|delet).*(extension|module)' "$LOG"; then
            echo "extension_removal_detected=true"
            [ "$rc" = "0" ] && rc=3
          else
            echo "extension_removal_detected=false"
          fi
          echo "deploy_exit_code=$rc"
          rm -f "$LOG"
          exit "$rc"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Shopify app release"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- config: shopify.app.toml (client_id pinned by guard)"
            echo "- release: ${{ inputs.release }} (false = --no-release preview)"
          } >> "$GITHUB_STEP_SUMMARY"
