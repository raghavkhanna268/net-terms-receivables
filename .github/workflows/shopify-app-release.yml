name: Shopify App Release (dev store)

# Sanctioned path to release the Shopify app config + Functions (S12/S13) with
# `shopify app deploy`. Manual only (workflow_dispatch), main only, and gated by
# the `shopify-release` GitHub environment (required reviewer, main-only branch
# policy). The CLI token is an ENVIRONMENT secret of `shopify-release` only.
#
# Guards run before any token is exposed:
#   - scope guard: shopify.app.toml scopes == wrangler.jsonc SCOPES == approved 11
#   - config guard: client_id pinned; no other shopify.app.*.toml (dev store config only)
#   - PII guard: no extension input query requests customer email/phone/name/address
#   - extension guard: repo extensions == scripts/ci/expected-extensions.txt (deploy would
#     DELETE a deployed extension missing from the repo); --allow-deletes is never passed,
#     so the CLI also refuses any deletion non-interactively
#   - deploy-flags guard: this file must never contain the delete/force flags
#   - exclusive-flags guard: preview and allow-updates flags never share the base args
#     (mutually exclusive in CLI 4.9.4; passing both exits 2 before any API call)
# Default is a PREVIEW: `--no-release` creates an app version without releasing it.
# Output: NO CLI text (public-logs ruling). Only token_present, release, a fixed-enum
# deploy_error_class, the exit code and, on success, our own version label
# (ci-<run_id>-<attempt>), to the log and the job summary. Token explicitly masked.
# Does NOT touch PLAN_GATING_ENFORCED, Worker vars, DB, or the cron.
on:
  workflow_dispatch:
    inputs:
      version_message:
        description: "Optional version message (letters, digits, space . , _ : # / ( ) -; max 120)"
        required: false
        default: ""
        type: string
      release:
        description: "Release the new version to users (default false = --no-release preview version only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shopify-app-release
  cancel-in-progress: false

jobs:
  release:
    name: Release app config + functions (dev store)
    # Manual dispatch on main of this repo only (never forks / PRs).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'raghavkhanna268/net-terms-receivables'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shopify-release
    # bash -eo pipefail for every run step, so `cmd | tee` cannot mask a failure.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Release guards (scopes, config, input-query PII, extensions, flags)
        run: |
          python3 scripts/ci/test_shopify_release_guards.py > /dev/null
          python3 scripts/ci/shopify_release_guards.py .

      - name: Validate version message
        id: msg
        env:
          VERSION_MESSAGE: ${{ inputs.version_message }}
        run: |
          if [ "${#VERSION_MESSAGE}" -gt 120 ]; then
            echo "version_message too long (max 120)"; exit 1
          fi
          if [ -n "$VERSION_MESSAGE" ] && ! printf '%s' "$VERSION_MESSAGE" | grep -Eq '^[A-Za-z0-9 .,_:#/()-]+$'; then
            echo "version_message has disallowed characters"; exit 1
          fi
          echo "has_message=$([ -n "$VERSION_MESSAGE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (registry, git deps, target)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            extensions/credit-check-validation -> target
            extensions/hide-terms-payment -> target
          save-if: false

      - name: Run Rust tests (credit-check-validation)
        working-directory: extensions/credit-check-validation
        run: |
          set -o pipefail
          cargo test --verbose 2>&1 | tee test-output.txt
          echo ""
          echo "=== Test Summary ==="
          grep -E "^test result:|^running [0-9]+ test" test-output.txt || true

      - name: Run Rust tests (hide-terms-payment)
        working-directory: extensions/hide-terms-payment
        run: |
          set -o pipefail
          cargo test --verbose 2>&1 | tee test-output.txt
          echo ""
          echo "=== Test Summary ==="
          grep -E "^test result:|^running [0-9]+ test" test-output.txt || true

      - name: Build WASM (credit-check-validation)
        working-directory: extensions/credit-check-validation
        run: |
          cargo build --release --target wasm32-unknown-unknown
          
          # Report WASM size and enforce limits
          # Shopify Functions have a 256KB limit
          # @see https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions
          WASM_FILE="target/wasm32-unknown-unknown/release/credit_check_validation.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(stat -c%s "$WASM_FILE")
            SIZE_KB=$((SIZE / 1024))
            echo "WASM size: ${SIZE_KB} KB ($SIZE bytes)"
            
            # Fail if over 256KB (Shopify Functions hard limit)
            if [ $SIZE_KB -gt 256 ]; then
              echo "✗ WASM size exceeds 256 KB limit (${SIZE_KB} KB)"
              echo "See: https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions#binary-size-tips"
              exit 1
            fi
            
            # Warn if over 200KB
            if [ $SIZE_KB -gt 200 ]; then
              echo "⚠ Warning: WASM size is ${SIZE_KB} KB, approaching 256 KB limit"
            else
              echo "✓ WASM size is within limits"
            fi
          else
            echo "✗ WASM file not found"
            exit 1
          fi

      - name: Build WASM (hide-terms-payment)
        working-directory: extensions/hide-terms-payment
        run: |
          cargo build --release --target wasm32-unknown-unknown
          
          # Report WASM size and enforce limits
          WASM_FILE="target/wasm32-unknown-unknown/release/hide_terms_payment.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(stat -c%s "$WASM_FILE")
            SIZE_KB=$((SIZE / 1024))
            echo "WASM size: ${SIZE_KB} KB ($SIZE bytes)"
            
            if [ $SIZE_KB -gt 256 ]; then
              echo "✗ WASM size exceeds 256 KB limit (${SIZE_KB} KB)"
              echo "See: https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions#binary-size-tips"
              exit 1
            fi
            
            if [ $SIZE_KB -gt 200 ]; then
              echo "⚠ Warning: WASM size is ${SIZE_KB} KB, approaching 256 KB limit"
            else
              echo "✓ WASM size is within limits"
            fi
          else
            echo "✗ WASM file not found"
            exit 1
          fi

      - name: Deploy app version (shopify app deploy)
        id: deploy
        env:
          # App Automation Token (Dev Dashboard), ENVIRONMENT secret of `shopify-release`.
          # CLI 4.9.4 reads SHOPIFY_APP_AUTOMATION_TOKEN first (legacy fallback:
          # SHOPIFY_CLI_PARTNERS_TOKEN); client_id comes from shopify.app.toml.
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          RELEASE: ${{ inputs.release }}
          VERSION_MESSAGE: ${{ inputs.version_message }}
          HAS_MESSAGE: ${{ steps.msg.outputs.has_message }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          # Our own version label (ids only), so the log never needs CLI text to name it.
          VERSION_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
          SHOPIFY_CLI_NO_ANALYTICS: "1"
          CI: "1"
        run: |
          set -o pipefail
          # Public-logs ruling: NO CLI text is printed (its boxes carry org/app names and
          # free-text errors). Only token_present, release, deploy_error_class (fixed enum),
          # deploy_exit_code and, on success, the allowlisted version label.
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then
            echo "token_present=false (set environment secret SHOPIFY_APP_AUTOMATION_TOKEN on shopify-release)"
            echo "- token_present: false" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Belt and braces: secrets are masked already, mask the value explicitly too.
          echo "::add-mask::$SHOPIFY_APP_AUTOMATION_TOKEN"
          echo "token_present=true"
          if ! printf '%s' "$VERSION_TAG" | grep -Eq '^ci-[0-9]{1,20}-[0-9]{1,4}$'; then
            echo "version_tag_valid=false"; exit 1
          fi
          args=(app deploy --config shopify.app.toml --no-color
                --source-control-url "$SOURCE_URL" --version "$VERSION_TAG")
          if [ "$HAS_MESSAGE" = "true" ]; then args+=(--message "$VERSION_MESSAGE"); fi
          # In CLI 4.9.4 the preview flag and the allow-updates flag are mutually
          # exclusive (oclif FailedFlagValidationError, exit 2). The preview path needs
          # no confirmation; the release path uses allow-updates only (never deletes).
          if [ "$RELEASE" = "true" ]; then
            args+=(--allow-updates)
          else
            args+=(--no-release)
          fi
          rel="$([ "$RELEASE" = "true" ] && echo true || echo false)"
          echo "release=$rel"
          LOG="$RUNNER_TEMP/deploy.log"
          rc=0
          ./node_modules/.bin/shopify "${args[@]}" > "$LOG" 2>&1 || rc=$?
          # Classify from the RAW log (never printed). Fixed enum; matched text is never echoed.
          has() { grep -Eiq -e "$1" "$LOG"; }
          if [ "$rc" = "0" ]; then cls="none"
          elif has 'cannot also be provided when using --|nonexistent flags?:|unexpected arguments?:|missing required flags?|expected --[a-z-]+=.* to be one of|the following errors? occurred:'; then cls="flag_or_args"
          elif has '(status( code)?|http)[^0-9a-z]{0,3}40[13]([^0-9]|$)|unauthori[sz]ed|invalid (app automation |access |automation )?token|token (is |has )?(expired|revoked|invalid)|not logged in|authentication (failed|required|error)|access denied|permission denied'; then cls="auth"
          elif has '(status( code)?|http)[^0-9a-z]{0,3}5[0-9]{2}([^0-9]|$)|internal server error|bad gateway|service unavailable|gateway time-?out'; then cls="api_5xx"
          elif has '(^|[^a-z])(econnreset|econnrefused|etimedout|enotfound|eai_again)([^a-z]|$)|fetch failed|socket hang up|network error'; then cls="network"
          elif has 'could not find a shopify app configuration file|validation errors? in|invalid (toml|app configuration)|is not a valid app configuration'; then cls="config"
          else cls="unknown"
          fi
          echo "deploy_error_class=$cls"
          # Backstop: any extension removal/deletion mentioned by the CLI is a hard fail.
          if grep -Eiq '(extension|module).*(remov|delet)|(remov|delet).*(extension|module)' "$LOG"; then
            removal=true
            [ "$rc" = "0" ] && rc=3
          else
            removal=false
          fi
          echo "extension_removal_detected=$removal"
          echo "deploy_exit_code=$rc"
          {
            echo "- token_present: true"
            echo "- release: $rel"
            echo "- deploy_error_class: \`$cls\`"
            echo "- deploy_exit_code: $rc"
            echo "- extension_removal_detected: $removal"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "0" ]; then
            echo "version_label=$VERSION_TAG"
            echo "- version_label: \`$VERSION_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$LOG"
          exit "$rc"

      - name: Print extension uids (handle + uid only)
        # Runs only after a successful deploy step, on preview (release=false) AND release
        # runs. CLI 4.9.4 writes `uid = "<id>"` right after the `handle = "..."` line of each
        # UUID-strategy extension in extensions/*/shopify.extension.toml while it loads the
        # linked app context (addUidToTomlsIfNecessary in app-context.ts), which `app deploy`
        # does before the --no-release / --allow-updates branch. So the uid is already on
        # disk for a preview run; it is deterministic (name-based from the handle), so the
        # value is the same on preview and release. The CLI also sends this uid with the
        # module on upload, so it is the id Shopify records for the extension.
        # Public-logs rule: prints ONLY handle, uid (ids) and booleans; nothing else from
        # the toml. Values that fail the strict id patterns print as `invalid`.
        # Nothing is committed back from CI; a follow-up PR commits the uid.
        if: success() && steps.deploy.outcome == 'success'
        run: |
          set -o pipefail
          n=0
          for f in extensions/*/shopify.extension.toml; do
            [ -f "$f" ] || continue
            n=$((n + 1))
            # First handle/uid assignment in the file (one extension per toml in this repo).
            h_line=$(grep -m1 -E '^[[:space:]]*handle[[:space:]]*=' "$f" || true)
            u_line=$(grep -m1 -E '^[[:space:]]*uid[[:space:]]*=' "$f" || true)
            handle=$(printf '%s\n' "$h_line" | sed -nE 's/^[[:space:]]*handle[[:space:]]*=[[:space:]]*"([a-z0-9][a-z0-9_-]{0,63})"[[:space:]]*$/\1/p')
            uid=$(printf '%s\n' "$u_line" | sed -nE 's/^[[:space:]]*uid[[:space:]]*=[[:space:]]*"([0-9a-f][0-9a-f-]{7,63})"[[:space:]]*$/\1/p')
            [ -n "$handle" ] || handle="invalid"
            if [ -z "$u_line" ]; then uid="none"; elif [ -z "$uid" ]; then uid="invalid"; fi
            # Was a uid already in the checked-out commit (vs. written by the CLI this run)?
            # Captured first (no `git show | grep -q`, which can SIGPIPE under pipefail).
            head_toml=$(git show "HEAD:$f" 2>/dev/null || true)
            if grep -qE '^[[:space:]]*uid[[:space:]]*=' <<< "$head_toml"; then
              committed=true
            else
              committed=false
            fi
            echo "extension handle=$handle uid=$uid uid_committed=$committed"
            echo "- extension \`$handle\`: uid \`$uid\` (uid_committed: $committed)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "extension_count=$n"
          echo "- extension_count: $n" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Shopify app release"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- config: shopify.app.toml (client_id pinned by guard)"
            echo "- release: ${{ inputs.release }} (false = --no-release preview)"
          } >> "$GITHUB_STEP_SUMMARY"
