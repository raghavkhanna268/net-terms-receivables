# One-off ops (#200): delete the 3 orphaned seed BuyerAccount rows on the dev store
#
# Approved by Raghav 2026-10-25 09:25 IST ("Yes, delete the 3 orphaned test
# accounts (dry run first)") for these 3 rows ONLY:
#   gid://shopify/CompanyLocation/24539463845
#   gid://shopify/CompanyLocation/24539529381
#   gid://shopify/CompanyLocation/24539594917
# The allowlist is hard-coded in scripts/ops/200-delete-seed-orphans.sql and
# this file; there is no input that can widen it.
#
# SAFETY:
#   - Manual trigger only (workflow_dispatch), main branch only
#   - mode defaults to dry-run. dry-run runs the SQL with
#     default_transaction_read_only=on and always ends with ROLLBACK
#   - apply additionally needs confirm=DELETE-3-SEED-ORPHANS
#   - Shop is the ALLOWED_DEV_STORE secret (masked, never printed or committed)
#   - Admin API nodes(ids:) must return null for all 3 gids (the #200
#     "node null" definition); otherwise the SQL guard refuses
#   - SQL guard (one transaction): exactly 3 rows on the dev shop, all seed ids,
#     0 dependents (Invoice/Match/rejected_matches/ReminderLog/PayerAlias/
#     s8_draft_orders/AuditEvent data->>'buyerAccountId'/live s6_sync queue) and
#     0 rows in every FK to BuyerAccount found at runtime in pg_constraint.
#     Any failure: RAISE refuse_200:<code>, non-zero exit, rollback, no writes
#   - Output: counts, ids, gids, enums, booleans, exit code. psql stderr goes
#     through scripts/ci/psql-redacted.sh. Token masked and kept off argv
#   - No GitHub Environment: the repo has none for prod DB writes (only
#     shopify-release, which this must never use)
#
# Dispatch:
#   gh workflow run ops-200-delete-seed-orphans.yml --ref main -f mode=dry-run
#   gh workflow run ops-200-delete-seed-orphans.yml --ref main -f mode=apply -f confirm=DELETE-3-SEED-ORPHANS

name: Ops 200 Delete Seed Orphans

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default, read-only, ROLLBACK) or apply (deletes the 3 allowlisted rows)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: "Required for apply: type DELETE-3-SEED-ORPHANS"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ops-200-delete-seed-orphans
  cancel-in-progress: false

jobs:
  run:
    name: Delete seed orphans (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$INPUT_MODE" in
            dry-run) ;;
            apply)
              if [ "$INPUT_CONFIRM" != "DELETE-3-SEED-ORPHANS" ]; then
                echo "::error::apply requires confirm=DELETE-3-SEED-ORPHANS"
                exit 1
              fi
              ;;
            *)
              echo "::error::mode must be dry-run or apply"
              exit 1
              ;;
          esac
          echo "mode=$INPUT_MODE"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve and mask dev-store domain
        env:
          # Secret, so the env header prints *** (#190 F1: never committed).
          ALLOWED_DEV_STORE: ${{ secrets.ALLOWED_DEV_STORE }}
        run: |
          set -euo pipefail
          if [ -z "${ALLOWED_DEV_STORE:-}" ]; then
            echo "::error::ALLOWED_DEV_STORE secret is not set"
            exit 1
          fi
          echo "::add-mask::$ALLOWED_DEV_STORE"
          if [[ ! "$ALLOWED_DEV_STORE" =~ ^[a-z0-9-]+\.myshopify\.com$ ]]; then
            echo "::error::ALLOWED_DEV_STORE secret is not a valid *.myshopify.com domain"
            exit 1
          fi
          echo "SHOP=$ALLOWED_DEV_STORE" >> "$GITHUB_ENV"

      - name: Install psql
        run: |
          set -euo pipefail
          if ! command -v psql &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Reads the dev store's offline token (refreshing it if expired, as
      # seed-dev-store.yml does), then asks Admin nodes(ids:) for the 3 gids.
      # Prints only gid + node_null booleans and the count.
      - name: Admin API node check
        id: nodes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          DATABASE_URL_SESSION: ${{ secrets.DATABASE_URL_SESSION }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          if [ -n "$SHOPIFY_API_KEY" ]; then echo "::add-mask::$SHOPIFY_API_KEY"; fi
          if [ -n "$SHOPIFY_API_SECRET" ]; then echo "::add-mask::$SHOPIFY_API_SECRET"; fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret is not set"
            exit 1
          fi

          CURL_CONFIG=""
          HTTP_RESPONSE=""
          cleanup() { rm -f "$CURL_CONFIG" "$HTTP_RESPONSE"; }
          trap cleanup EXIT

          SESSION_DATA=$(psql -X -v ON_ERROR_STOP=1 -v shop="$SHOP" -t -A -F '|' "$DATABASE_URL" <<'EOSQL'
          SELECT
            "accessToken",
            expires AT TIME ZONE 'UTC',
            CASE WHEN "refreshToken" IS NOT NULL AND "refreshToken" != '' THEN 'true' ELSE 'false' END
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          EOSQL
          )
          if [ -z "$SESSION_DATA" ]; then
            echo "::error::No offline session found for the dev store"
            exit 1
          fi
          ACCESS_TOKEN=$(echo "$SESSION_DATA" | cut -d'|' -f1)
          EXPIRES_RAW=$(echo "$SESSION_DATA" | cut -d'|' -f2)
          HAS_REFRESH=$(echo "$SESSION_DATA" | cut -d'|' -f3)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Offline session has no access token"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "has_token=true"

          NEEDS_REFRESH=false
          if [ -n "$EXPIRES_RAW" ]; then
            EXPIRES_EPOCH=$(date -u -d "$EXPIRES_RAW" +%s 2>/dev/null || echo "0")
            if [ "$EXPIRES_EPOCH" -le $(( $(date -u +%s) + 300 )) ]; then
              NEEDS_REFRESH=true
            fi
          fi
          echo "needs_refresh=$NEEDS_REFRESH"
          if [ "$NEEDS_REFRESH" = "true" ]; then
            if [ "$HAS_REFRESH" != "true" ]; then
              echo "::error::Token expired but no refresh token available"
              exit 1
            fi
            if [ -z "$DATABASE_URL_SESSION" ]; then
              echo "::error::DATABASE_URL_SESSION secret is not set (required for token refresh)"
              exit 1
            fi
            REFRESH_RESULT=$(env -u PGOPTIONS DATABASE_URL="$DATABASE_URL_SESSION" npx tsx scripts/lib/refresh-offline-token.ts \
              --shop "$SHOP" --threshold-minutes 5) || true
            if ! echo "$REFRESH_RESULT" | jq -e . >/dev/null 2>&1; then
              echo "::error::Token refresh returned invalid JSON"
              exit 1
            fi
            if [ "$(echo "$REFRESH_RESULT" | jq -r '.success // false')" != "true" ]; then
              echo "::error::Token refresh failed: $(echo "$REFRESH_RESULT" | jq -r '.errorCode // "unknown"')"
              exit 1
            fi
            echo "refreshed=$(echo "$REFRESH_RESULT" | jq -r '.wasRefreshed // false')"
            ACCESS_TOKEN=$(psql -X -v ON_ERROR_STOP=1 -v shop="$SHOP" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT "accessToken" FROM "Session" WHERE shop = :'shop' AND "isOnline" = false LIMIT 1;
          EOSQL
            )
            if [ -z "$ACCESS_TOKEN" ]; then
              echo "::error::No access token found after refresh"
              exit 1
            fi
            echo "::add-mask::$ACCESS_TOKEN"
          fi

          CURL_CONFIG=$(mktemp)
          chmod 600 "$CURL_CONFIG"
          cat > "$CURL_CONFIG" <<EOF_CFG
          header = "Content-Type: application/json"
          header = "X-Shopify-Access-Token: $ACCESS_TOKEN"
          EOF_CFG
          HTTP_RESPONSE=$(mktemp)

          GIDS='["gid://shopify/CompanyLocation/24539463845","gid://shopify/CompanyLocation/24539529381","gid://shopify/CompanyLocation/24539594917"]'
          NODES_Q=$(jq -n --argjson ids "$GIDS" '{query: "query($ids: [ID!]!) { nodes(ids: $ids) { id } }", variables: {ids: $ids}}')
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
            -X POST --config "$CURL_CONFIG" --data-binary "$NODES_Q" \
            "https://${SHOP}/admin/api/2026-10/graphql.json")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::nodes query failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          if jq -e '.errors | length > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
            echo "::error::GraphQL errors: $(jq -r '[.errors[] | .extensions.code // "UNKNOWN"] | join(", ")' "$HTTP_RESPONSE")"
            exit 1
          fi
          # nodes(ids:) returns one entry per id, in order; null = node gone.
          jq -c --argjson ids "$GIDS" '[range(0; $ids | length) as $i
            | {company_location_gid: $ids[$i],
               node_null: (if (.data.nodes | length) == ($ids | length) then .data.nodes[$i] == null else null end)}] | .[]' "$HTTP_RESPONSE"
          NULL_COUNT=$(jq -r --argjson ids "$GIDS" \
            'if (.data.nodes | length) == ($ids | length) then [.data.nodes[] | select(. == null)] | length else -1 end' "$HTTP_RESPONSE")
          echo "admin_nodes_null_count=$NULL_COUNT"
          if [ "$NULL_COUNT" = "3" ]; then
            echo "nodes_null=true" >> "$GITHUB_OUTPUT"
          else
            echo "nodes_null=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run guarded delete (${{ inputs.mode }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          NODES_NULL: ${{ steps.nodes.outputs.nodes_null }}
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret is not set"
            exit 1
          fi
          if [ "$INPUT_MODE" = "dry-run" ]; then
            # Belt and braces: the session itself is read-only in dry-run.
            export PGOPTIONS="-c default_transaction_read_only=on"
          fi
          rc=0
          psql -X -q -v ON_ERROR_STOP=1 \
            -v "shop=${SHOP}" -v "mode=${INPUT_MODE}" -v "nodes_null=${NODES_NULL:-false}" \
            -f scripts/ops/200-delete-seed-orphans.sql "$DATABASE_URL" || rc=$?
          echo "exit_code=$rc"
          exit "$rc"
