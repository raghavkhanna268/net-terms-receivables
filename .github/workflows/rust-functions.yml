name: Rust Functions

# Split out of ci.yml as its own workflow. Runs on every PR and every push to
# main (no paths filter) because "Rust functions (test, build WASM)" is a
# REQUIRED status check. Swatinem/rust-cache keeps runs short.
# The Worker deploy (deploy.yml) does not depend on this workflow; Shopify
# Functions ship via the Shopify CLI, not the Worker deploy.
#
# Covers both extensions:
# - credit-check-validation (S12): Cart validation function
# - hide-terms-payment (S13): Payment customization function
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-functions:
    name: Rust functions (test, build WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head 2026-10-16)
        with:
          # Pinned by SHA, so name the toolchain explicitly (same as the @stable default).
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (registry, git deps, target)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            extensions/credit-check-validation -> target
            extensions/hide-terms-payment -> target
          # Only save the cache from main so PR runs don't evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust tests (credit-check-validation)
        working-directory: extensions/credit-check-validation
        run: |
          cargo test --verbose 2>&1 | tee test-output.txt
          echo ""
          echo "=== Test Summary ==="
          grep -E "^test result:|^running [0-9]+ test" test-output.txt || true

      - name: Run Rust tests (hide-terms-payment)
        working-directory: extensions/hide-terms-payment
        run: |
          cargo test --verbose 2>&1 | tee test-output.txt
          echo ""
          echo "=== Test Summary ==="
          grep -E "^test result:|^running [0-9]+ test" test-output.txt || true

      - name: Build WASM (credit-check-validation)
        working-directory: extensions/credit-check-validation
        run: |
          cargo build --release --target wasm32-unknown-unknown
          
          # Report WASM size and enforce limits
          # Shopify Functions have a 256KB limit
          # @see https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions
          WASM_FILE="target/wasm32-unknown-unknown/release/credit_check_validation.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(stat -c%s "$WASM_FILE")
            SIZE_KB=$((SIZE / 1024))
            echo "WASM size: ${SIZE_KB} KB ($SIZE bytes)"
            
            # Fail if over 256KB (Shopify Functions hard limit)
            if [ $SIZE_KB -gt 256 ]; then
              echo "✗ WASM size exceeds 256 KB limit (${SIZE_KB} KB)"
              echo "See: https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions#binary-size-tips"
              exit 1
            fi
            
            # Warn if over 200KB
            if [ $SIZE_KB -gt 200 ]; then
              echo "⚠ Warning: WASM size is ${SIZE_KB} KB, approaching 256 KB limit"
            else
              echo "✓ WASM size is within limits"
            fi
          else
            echo "✗ WASM file not found"
            exit 1
          fi

      - name: Build WASM (hide-terms-payment)
        working-directory: extensions/hide-terms-payment
        run: |
          cargo build --release --target wasm32-unknown-unknown
          
          # Report WASM size and enforce limits
          WASM_FILE="target/wasm32-unknown-unknown/release/hide_terms_payment.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(stat -c%s "$WASM_FILE")
            SIZE_KB=$((SIZE / 1024))
            echo "WASM size: ${SIZE_KB} KB ($SIZE bytes)"
            
            if [ $SIZE_KB -gt 256 ]; then
              echo "✗ WASM size exceeds 256 KB limit (${SIZE_KB} KB)"
              echo "See: https://shopify.dev/docs/apps/build/functions/programming-languages/rust-for-functions#binary-size-tips"
              exit 1
            fi
            
            if [ $SIZE_KB -gt 200 ]; then
              echo "⚠ Warning: WASM size is ${SIZE_KB} KB, approaching 256 KB limit"
            else
              echo "✓ WASM size is within limits"
            fi
          else
            echo "✗ WASM file not found"
            exit 1
          fi

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shopify-functions-wasm
          path: |
            extensions/credit-check-validation/target/wasm32-unknown-unknown/release/credit_check_validation.wasm
            extensions/hide-terms-payment/target/wasm32-unknown-unknown/release/hide_terms_payment.wasm
          retention-days: 7
