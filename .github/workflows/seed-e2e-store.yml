# Seed the throwaway e2e store (INR) with test data for Net Terms Receivables.
#
# SECURITY CONSTRAINTS (do not weaken):
# - Manual dispatch only, and the job runs only on refs/heads/main
# - Inputs are booleans and one enum (dry_run defaults to true; g4_fixture
#   defaults to none). There is NO shop or domain input: the store comes only
#   from the E2E_SHOP repo secret. The G4 recipient comes only from the
#   G4_TEST_RECIPIENT repo secret, mapped into env (never an input, never echoed)
# - E2E_SHOP is masked at once; the guard (scripts/ci/e2e-shop-guard.sh) fails
#   closed if it is empty, not a *.myshopify.com domain, or equal to the main
#   dev store (ALLOWED_DEV_STORE secret). Neither value is ever printed
# - SHOP and seed.ts's dev-store guard env (ALLOWED_DEV_STORE) both come from
#   E2E_SHOP, so seed.ts refuses any other shop
# - Access/refresh tokens are NEVER logged, echoed, written to files or uploaded;
#   the access token is masked with ::add-mask:: immediately
# - Exits non-zero BEFORE any seed write if: no offline session, no access token,
#   session needsReauth is set, token expired without a refresh token, or the
#   refresh failed
# - Only counts, enums and booleans are printed; seed.ts output is piped through
#   scripts/ci/redact-seed-output.sh (GIDs, order names, amounts, emails, domains)
#
# seed-dev-store.yml (main dev store) is unchanged and separate.
#
# Run via GitHub Actions UI: Actions > Seed E2E Store > Run workflow (on main)

name: Seed E2E Store

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no mutations)'
        type: boolean
        default: true
      reviewer_demo:
        description: 'Also seed the reviewer demo company/orders (--reviewer-demo)'
        type: boolean
        default: false
      g4_fixture:
        description: 'G4 reminder fixture: none, write, or cleanup. Writes need dry_run=false.'
        type: choice
        options:
          - none
          - write
          - cleanup
        default: none

permissions:
  contents: read
  # Read-only: resolve the last successful Deploy run SHA for the drift check.
  actions: read

concurrency:
  group: seed-e2e-store
  cancel-in-progress: false

jobs:
  seed:
    name: Seed e2e store
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Same budget as seed-dev-store.yml (~35 orders at 12s pacing + retries)
    timeout-minutes: 20

    env:
      # SHOP is NOT set here: step env headers are printed in public logs.
      # It is resolved from the E2E_SHOP secret and masked.
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_REVIEWER_DEMO: ${{ inputs.reviewer_demo }}
      INPUT_G4_FIXTURE: ${{ inputs.g4_fixture }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve, mask and guard e2e-store domain
        env:
          # Secrets, so the env header prints ***.
          E2E_SHOP: ${{ secrets.E2E_SHOP }}
          MAIN_DEV_STORE: ${{ secrets.ALLOWED_DEV_STORE }}
        # Masks first; fails closed on empty / bad format / equal to main dev store.
        # On success writes SHOP and ALLOWED_DEV_STORE (= E2E_SHOP) to GITHUB_ENV.
        run: bash scripts/ci/e2e-shop-guard.sh

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read and refresh offline token
        id: token
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          DATABASE_URL_SESSION: ${{ secrets.DATABASE_URL_SESSION }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          # Mask API credentials immediately
          if [ -n "$SHOPIFY_API_KEY" ]; then
            echo "::add-mask::$SHOPIFY_API_KEY"
          fi
          if [ -n "$SHOPIFY_API_SECRET" ]; then
            echo "::add-mask::$SHOPIFY_API_SECRET"
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret is not set"
            exit 1
          fi
          if [ -z "${SHOP:-}" ]; then
            echo "::error::e2e_shop_unresolved"
            exit 1
          fi

          # Read offline session from DB (read-only)
          SESSION_DATA=$(psql -v ON_ERROR_STOP=1 -v shop="$SHOP" -t -A -F '|' "$DATABASE_URL" <<'EOSQL'
          SELECT
            "accessToken",
            expires AT TIME ZONE 'UTC',
            CASE WHEN "refreshToken" IS NOT NULL AND "refreshToken" != '' THEN 'true' ELSE 'false' END,
            CASE WHEN "needsReauth" THEN 'true' ELSE 'false' END
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          EOSQL
          )

          if [ -z "$SESSION_DATA" ]; then
            echo "::error::No offline session found for the e2e store"
            echo "has_session=false"
            echo "needs_reauth=true"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "has_session=true"

          ACCESS_TOKEN=$(echo "$SESSION_DATA" | cut -d'|' -f1)
          EXPIRES_RAW=$(echo "$SESSION_DATA" | cut -d'|' -f2)
          HAS_REFRESH=$(echo "$SESSION_DATA" | cut -d'|' -f3)
          NEEDS_REAUTH=$(echo "$SESSION_DATA" | cut -d'|' -f4)

          # Check if we have a token
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Offline session has no access token"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Mask the token immediately before any other use
          echo "::add-mask::$ACCESS_TOKEN"
          echo "has_token=true"
          echo "has_refresh_token=$HAS_REFRESH"

          # Session flagged for merchant re-auth (Session.needsReauth): stop before any write
          if [ "$NEEDS_REAUTH" != "false" ]; then
            echo "needs_reauth=true"
            echo "::error::Offline session needs re-auth (needsReauth set)"
            exit 1
          fi

          # Check if token is expired or within 5 minutes of expiry
          NEEDS_REFRESH=false
          TOKEN_EXPIRED=false
          if [ -n "$EXPIRES_RAW" ]; then
            EXPIRES_EPOCH=$(date -u -d "$EXPIRES_RAW" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date -u +%s)
            THRESHOLD_EPOCH=$((NOW_EPOCH + 300)) # 5 minutes from now

            if [ "$EXPIRES_EPOCH" -le "$NOW_EPOCH" ]; then
              NEEDS_REFRESH=true
              TOKEN_EXPIRED=true
            elif [ "$EXPIRES_EPOCH" -le "$THRESHOLD_EPOCH" ]; then
              NEEDS_REFRESH=true
            fi
          fi
          echo "expired=$TOKEN_EXPIRED"

          # Refresh if needed and we have a refresh token
          if [ "$NEEDS_REFRESH" = "true" ]; then
            if [ "$HAS_REFRESH" = "true" ]; then
              echo "Refreshing token..."

              # Use DATABASE_URL_SESSION for writes (as #49 does)
              if [ -z "$DATABASE_URL_SESSION" ]; then
                echo "::error::DATABASE_URL_SESSION secret is not set (required for token refresh)"
                exit 1
              fi

              # Capture stdout only (not stderr), validate JSON
              # Use env -u to unset PGOPTIONS so refresh helper can write to DB
              REFRESH_RESULT=$(env -u PGOPTIONS DATABASE_URL="$DATABASE_URL_SESSION" npx tsx scripts/lib/refresh-offline-token.ts \
                --shop "$SHOP" \
                --threshold-minutes 5) || true

              # Validate JSON output
              if ! echo "$REFRESH_RESULT" | jq -e . >/dev/null 2>&1; then
                echo "needs_reauth=true"
                echo "::error::Token refresh returned invalid JSON"
                exit 1
              fi

              # Parse result with guarded jq calls
              REFRESH_SUCCESS=$(echo "$REFRESH_RESULT" | jq -r '.success // false' 2>/dev/null || echo "false")
              WAS_REFRESHED=$(echo "$REFRESH_RESULT" | jq -r '.wasRefreshed // false' 2>/dev/null || echo "false")

              if [ "$REFRESH_SUCCESS" = "true" ]; then
                echo "refreshed=$WAS_REFRESHED"
                if [ "$WAS_REFRESHED" = "true" ]; then
                  # Re-read the new token from DB
                  export PGOPTIONS="-c default_transaction_read_only=on"
                  ACCESS_TOKEN=$(psql -v ON_ERROR_STOP=1 -v shop="$SHOP" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT "accessToken"
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          EOSQL
                  )

                  # Verify we got a token after refresh
                  if [ -z "$ACCESS_TOKEN" ]; then
                    echo "::error::No access token found after refresh"
                    exit 1
                  fi

                  # Mask the new token
                  echo "::add-mask::$ACCESS_TOKEN"
                fi
              else
                # errorCode is an enum (RefreshErrorCode | config_error); a failed refresh needs re-auth
                ERROR_CODE=$(echo "$REFRESH_RESULT" | jq -r '.errorCode // "unknown"' 2>/dev/null || echo "unknown")
                echo "needs_reauth=true"
                echo "::error::Token refresh failed: $ERROR_CODE"
                exit 1
              fi
            else
              echo "needs_reauth=true"
              echo "::error::Token expired but no refresh token available"
              exit 1
            fi
          else
            echo "refreshed=false"
          fi
          echo "needs_reauth=false"

          # Output token to GITHUB_ENV (masked, never echoed)
          {
            echo "SHOPIFY_ADMIN_TOKEN<<EOF_TOKEN"
            echo "$ACCESS_TOKEN"
            echo "EOF_TOKEN"
          } >> "$GITHUB_ENV"

          echo "has_token=true" >> "$GITHUB_OUTPUT"

      - name: Mask G4 recipient and resolve deployed SHA
        if: inputs.g4_fixture == 'write'
        env:
          # Repo secret, never a workflow input and never echoed.
          G4_TEST_RECIPIENT: ${{ secrets.G4_TEST_RECIPIENT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Mask every comma entry (and its lowercase form) before anything else.
          IFS=',' read -ra ENTRIES <<< "${G4_TEST_RECIPIENT:-}"
          for e in "${ENTRIES[@]}"; do
            t="$(printf '%s' "$e" | tr -d '[:space:]')"
            if [ -n "$t" ]; then
              echo "::add-mask::$t"
              echo "::add-mask::$(printf '%s' "$t" | tr '[:upper:]' '[:lower:]')"
            fi
          done
          # Drift check input: head SHA of the last successful Deploy run on main.
          DEPLOY_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$DEPLOY_SHA" ]; then
            echo "::error::g4_deploy_sha_unresolved"
            exit 1
          fi
          # The checkout is shallow (fetch-depth 1), so the deployed commit is
          # usually absent and seed.ts's `git show $DEPLOY_SHA:wrangler.jsonc`
          # drift check would fail. Fetch exactly that one commit (depth 1, no
          # tags). persist-credentials is false, so authenticate this single
          # fetch with the job token via an http header (as actions/checkout
          # does). Fail closed if the commit can't be fetched. This fetches a
          # single commit, never the full history.
          GH_AUTH_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$GH_AUTH_B64"
          if ! git -c "http.https://github.com/.extraheader=Authorization: Basic $GH_AUTH_B64" \
            fetch --no-tags --depth=1 origin "$DEPLOY_SHA"; then
            echo "::error::g4_deploy_sha_fetch_failed"
            exit 1
          fi
          echo "G4_DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"

      - name: Run seed script
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ env.SHOPIFY_ADMIN_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          # Recipient mapped into env only (never an input, never echoed).
          G4_TEST_RECIPIENT: ${{ secrets.G4_TEST_RECIPIENT }}
          # Deployed SHA for the allowlist drift check (empty unless g4=write).
          G4_DEPLOY_SHA: ${{ env.G4_DEPLOY_SHA }}
        run: |
          set -euo pipefail

          # seed.ts validateEnv refuses unless SHOP == ALLOWED_DEV_STORE (both = E2E_SHOP here)
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          # Map the G4 fixture choice to a seed flag. Writes still require
          # dry_run=false; normal seeding is skipped when the G4 branch runs.
          case "$INPUT_G4_FIXTURE" in
            write)
              ARGS+=("--g4-reminder-fixture")
              ;;
            cleanup)
              ARGS+=("--g4-reminder-fixture-cleanup")
              ;;
            none)
              if [ "$INPUT_REVIEWER_DEMO" = "true" ]; then
                ARGS+=("--reviewer-demo")
              fi
              ;;
            *)
              echo "::error::g4_fixture_invalid_choice"
              exit 1
              ;;
          esac
          echo "dry_run=$INPUT_DRY_RUN"
          echo "g4_fixture=$INPUT_G4_FIXTURE"
          echo "reviewer_demo=$INPUT_REVIEWER_DEMO"
          # Public logs: redact GIDs, order names, amounts, emails and domains
          # (pipefail keeps seed.ts's exit code).
          npx tsx scripts/seed.ts "${ARGS[@]}" 2>&1 | bash scripts/ci/redact-seed-output.sh
