name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on PRs to any branch (supports stacked PRs)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install actionlint
        env:
          # Pin to specific version for reproducibility
          ACTIONLINT_VERSION: "1.7.4"
          # SHA256 of actionlint_1.7.4_linux_amd64.tar.gz
          ACTIONLINT_SHA256: "adf70860cf7587314d4bbec714d7e3cd4e26adfa3da06c12cfc7ba7058121f12"
        run: |
          set -euo pipefail
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL" actionlint
          rm "$TARBALL"
          ./actionlint --version

      - name: Run actionlint
        run: |
          # actionlint checks workflow syntax and runs shellcheck on run blocks
          ./actionlint -color

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Use pgmq's Postgres 16 image which includes pgmq extension pre-installed.
        # Pinned to v1.5.1 to match production Supabase (pgmq 1.5.1).
        #
        # Version compatibility note:
        # - Production (Supabase): pgmq 1.5.1
        # - CI: pgmq 1.5.1 (this image)
        # The runtime SQL (pgmq.send, pgmq.read, pgmq.delete) is compatible across 1.5.x-1.10.x.
        # Tests use explicit ::bigint casts on msg_ids for pgmq.delete to avoid function
        # overload ambiguity that exists in some pgmq versions.
        #
        # pg_cron and pg_net are NOT available in CI; the migration handles this gracefully.
        # In production (Supabase), all three extensions are available.
        image: ghcr.io/pgmq/pg16-pgmq:v1.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: net_terms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by Prisma migrations (prisma migrate deploy)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/net_terms_test
      # Used by integration tests
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/net_terms_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Check scope sync
        run: npx tsx scripts/check-scope-sync.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test session storage with non-UTC process TZ
        run: |
          # Run session storage tests with Asia/Calcutta process timezone
          # This catches bugs where timestamps shift by the process TZ offset
          # See issue #19 for background
          TZ=Asia/Calcutta npx vitest run \
            app/__tests__/integration/light-session-storage.test.ts \
            app/__tests__/integration/prisma-session-storage.test.ts

      - name: Build
        run: npm run build

      - name: Wrangler dry-run and size check
        run: |
          OUTPUT=$(npx wrangler deploy --dry-run --outdir /tmp/wrangler-out 2>&1)
          echo "$OUTPUT"
          
          # Extract gzip total from output
          GZIP_LINE=$(echo "$OUTPUT" | grep "gzip:")
          GZIP_SIZE=$(echo "$GZIP_LINE" | grep -oP '\d+\.\d+ KiB$' | head -1 | cut -d' ' -f1)
          
          # Fail if we couldn't parse the gzip size
          if [ -z "$GZIP_SIZE" ]; then
            echo "✗ Could not parse gzip size from wrangler output"
            exit 1
          fi
          
          echo "Gzip total: ${GZIP_SIZE} KiB"
          
          # Convert to integer for comparison (400 KiB limit)
          GZIP_INT=$(echo "$GZIP_SIZE" | cut -d'.' -f1)
          if ! [[ "$GZIP_INT" =~ ^[0-9]+$ ]]; then
            echo "✗ Gzip size is not a valid number: $GZIP_SIZE"
            exit 1
          fi
          
          if [ "$GZIP_INT" -gt 400 ]; then
            echo "✗ Gzip size exceeds 400 KiB limit"
            exit 1
          fi
          echo "✓ Bundle gzip size is within 400 KiB limit"

      - name: Worker boot test
        run: |
          # Create throwaway .dev.vars for boot test (wrangler dev doesn't forward shell env)
          cat > .dev.vars << 'EOF'
          SHOPIFY_API_KEY=test-key
          SHOPIFY_API_SECRET=test-secret
          SHOPIFY_APP_URL=https://example.com
          EOF
          
          # Create directory for wrangler logs
          mkdir -p /tmp/wrangler-logs
          
          # Start wrangler dev with bindings
          timeout 60 npx wrangler dev --port 8787 > /tmp/wrangler-logs/output.log 2>&1 &
          WRANGLER_PID=$!
          
          # Retry loop with timeout (max 30 seconds, 1 second intervals)
          MAX_ATTEMPTS=30
          ATTEMPT=0
          RESPONSE=""
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            sleep 1
            
            RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" http://localhost:8787/ 2>/dev/null || echo "000")
            
            # Break if we got any response (not connection refused)
            if [ "$RESPONSE" != "000" ]; then
              break
            fi
            
            # Check if wrangler process is still running
            if ! kill -0 $WRANGLER_PID 2>/dev/null; then
              echo "✗ Wrangler process died unexpectedly"
              cat /tmp/wrangler-logs/output.log
              exit 1
            fi
          done
          
          # Check logs for module errors or uncaught exceptions
          LOGS=$(cat /tmp/wrangler-logs/output.log 2>/dev/null || echo "")
          if echo "$LOGS" | grep -q "No such module"; then
            echo "✗ Worker failed with module resolution error"
            cat /tmp/wrangler-logs/output.log
            kill $WRANGLER_PID 2>/dev/null || true
            rm -f .dev.vars
            exit 1
          fi
          if echo "$LOGS" | grep -qE "Uncaught|uncaught exception"; then
            echo "✗ Worker failed with uncaught exception"
            cat /tmp/wrangler-logs/output.log
            kill $WRANGLER_PID 2>/dev/null || true
            rm -f .dev.vars
            exit 1
          fi
          
          # Clean up .dev.vars
          rm -f .dev.vars
          
          # Fail if no response (timeout)
          if [ "$RESPONSE" = "000" ]; then
            echo "✗ Worker did not respond after $MAX_ATTEMPTS attempts"
            cat /tmp/wrangler-logs/output.log
            kill $WRANGLER_PID 2>/dev/null || true
            exit 1
          fi
          
          # Fail on 5xx server errors
          if [[ "$RESPONSE" =~ ^5[0-9][0-9]$ ]]; then
            echo "✗ Worker returned server error (HTTP $RESPONSE)"
            cat /tmp/response.txt
            cat /tmp/wrangler-logs/output.log
            kill $WRANGLER_PID 2>/dev/null || true
            exit 1
          fi
          
          # Assert success (any 2xx, 3xx, or 4xx is acceptable for boot test)
          echo "✓ Worker booted successfully (HTTP $RESPONSE)"
          kill $WRANGLER_PID 2>/dev/null || true
