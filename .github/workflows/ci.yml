name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Wrangler dry-run and size check
        run: |
          OUTPUT=$(npx wrangler deploy --dry-run --outdir /tmp/wrangler-out 2>&1)
          echo "$OUTPUT"
          
          # Extract gzip total from output
          GZIP_LINE=$(echo "$OUTPUT" | grep "gzip:")
          GZIP_SIZE=$(echo "$GZIP_LINE" | grep -oP '\d+\.\d+ KiB$' | head -1 | cut -d' ' -f1)
          echo "Gzip total: ${GZIP_SIZE} KiB"
          
          # Convert to bytes for comparison (2.5 MB = 2560 KiB)
          GZIP_INT=$(echo "$GZIP_SIZE" | cut -d'.' -f1)
          if [ "$GZIP_INT" -gt 2560 ]; then
            echo "✗ Gzip size exceeds 2.5 MB limit"
            exit 1
          fi
          echo "✓ Bundle gzip size is within 2.5 MB limit"

      - name: Worker boot test
        run: |
          # Start wrangler dev with dummy env vars for boot test
          # The Worker will boot but fail on first request without real creds
          SHOPIFY_API_KEY=test-key \
          SHOPIFY_API_SECRET=test-secret \
          SHOPIFY_APP_URL=https://example.com \
          timeout 30 npx wrangler dev --port 8787 &
          WRANGLER_PID=$!
          
          # Wait for Worker to start
          sleep 10
          
          # Try to reach the Worker (expect non-5xx response or connection)
          RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" http://localhost:8787/ 2>/dev/null || echo "000")
          
          # Check logs for module errors
          LOGS=$(cat /home/runner/.config/.wrangler/logs/*.log 2>/dev/null || echo "")
          if echo "$LOGS" | grep -q "No such module"; then
            echo "✗ Worker failed with module resolution error"
            cat /home/runner/.config/.wrangler/logs/*.log
            kill $WRANGLER_PID 2>/dev/null || true
            exit 1
          fi
          
          # Any response (including 302 redirect to Shopify auth) means boot succeeded
          if [ "$RESPONSE" = "000" ]; then
            echo "✗ Worker did not respond"
            kill $WRANGLER_PID 2>/dev/null || true
            exit 1
          fi
          
          echo "✓ Worker booted successfully (HTTP $RESPONSE)"
          kill $WRANGLER_PID 2>/dev/null || true
