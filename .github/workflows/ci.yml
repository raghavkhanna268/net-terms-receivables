name: CI

# Minutes budget: CI runs only on PRs and on pushes to main, and superseded
# runs on the same ref are cancelled. No paths filters: "Lint, typecheck,
# test, build" is a REQUIRED status check, and a required workflow skipped by
# a paths filter would leave docs-only PRs stuck on a pending check.
on:
  push:
    branches: [main]
  pull_request:
    # Run on PRs to any branch (supports stacked PRs)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Use pgmq's Postgres 16 image which includes pgmq extension pre-installed.
        # Pinned to v1.5.1 to match production Supabase (pgmq 1.5.1).
        #
        # Version compatibility note:
        # - Production (Supabase): pgmq 1.5.1
        # - CI: pgmq 1.5.1 (this image)
        # The runtime SQL (pgmq.send, pgmq.read, pgmq.delete) is compatible across 1.5.x-1.10.x.
        # Tests use explicit ::bigint casts on msg_ids for pgmq.delete to avoid function
        # overload ambiguity that exists in some pgmq versions.
        #
        # pg_cron and pg_net are NOT available in CI; the migration handles this gracefully.
        # In production (Supabase), all three extensions are available.
        image: ghcr.io/pgmq/pg16-pgmq:v1.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: net_terms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by Prisma migrations (prisma migrate deploy)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/net_terms_test
      # Used by integration tests
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/net_terms_test

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # actionlint used to be its own job. Each job is billed rounded up to a
      # whole minute, so a ~10s lint job cost a full minute per CI run. It now
      # runs as the first steps of this job and still fails CI (gates PRs).
      - name: Install actionlint
        env:
          # Pin to specific version for reproducibility
          ACTIONLINT_VERSION: "1.7.12"
          # SHA256 of actionlint_1.7.12_linux_amd64.tar.gz (1.7.10+ allows 25 workflow_dispatch inputs)
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL" actionlint
          rm "$TARBALL"
          ./actionlint --version

      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          # actionlint checks workflow syntax and runs shellcheck on run blocks
          "$RUNNER_TEMP/actionlint/actionlint" -color

      - name: Backfill dry-run log filter self-test
        run: python3 scripts/ci/test_backfill_dry_run_filter.py

      - name: Shopify release guards (scopes, config, input-query PII)
        run: |
          python3 scripts/ci/test_shopify_release_guards.py
          python3 scripts/ci/shopify_release_guards.py .

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create shadow database for drift check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE shadow_db;"

      - name: Check Prisma schema drift
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow_db
        run: |
          # Compare migrations to schema.prisma using a shadow database.
          # Exit code 0 = no drift, 2 = drift detected (fail CI).
          echo "Checking for schema drift (migrations vs schema.prisma)..."
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Check scope sync
        run: npx tsx scripts/check-scope-sync.ts

      - name: Validate Admin GraphQL schema
        run: npx tsx scripts/validate-graphql-schema.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test session storage with non-UTC process TZ
        run: |
          # Run session storage tests with Asia/Calcutta process timezone
          # This catches bugs where timestamps shift by the process TZ offset
          # See issue #19 for background
          TZ=Asia/Calcutta npx vitest run \
            app/__tests__/integration/light-session-storage.test.ts \
            app/__tests__/integration/prisma-session-storage.test.ts

      - name: Build
        run: npm run build

      - name: Test build output (xlsx exclusion, bundle size)
        run: npm run test:build

      - name: Wrangler dry-run and size check
        run: |
          OUTPUT=$(npx wrangler deploy --dry-run --outdir /tmp/wrangler-out 2>&1)
          echo "$OUTPUT"
          
          # Extract gzip total from output
          GZIP_LINE=$(echo "$OUTPUT" | grep "gzip:")
          GZIP_SIZE=$(echo "$GZIP_LINE" | grep -oP '\d+\.\d+ KiB$' | head -1 | cut -d' ' -f1)
          
          # Fail if we couldn't parse the gzip size
          if [ -z "$GZIP_SIZE" ]; then
            echo "✗ Could not parse gzip size from wrangler output"
            exit 1
          fi
          
          echo "Gzip total: ${GZIP_SIZE} KiB"
          
          # Convert to integer for comparison (400 KiB limit)
          GZIP_INT=$(echo "$GZIP_SIZE" | cut -d'.' -f1)
          if ! [[ "$GZIP_INT" =~ ^[0-9]+$ ]]; then
            echo "✗ Gzip size is not a valid number: $GZIP_SIZE"
            exit 1
          fi
          
          if [ "$GZIP_INT" -gt 400 ]; then
            echo "✗ Gzip size exceeds 400 KiB limit"
            exit 1
          fi
          echo "✓ Bundle gzip size is within 400 KiB limit"

      - name: Worker boot test
        run: |
          # Create throwaway .dev.vars for boot test (wrangler dev doesn't forward shell env)
          cat > .dev.vars << 'EOF'
          SHOPIFY_API_KEY=test-key
          SHOPIFY_API_SECRET=test-secret
          SHOPIFY_APP_URL=https://example.com
          EOF
          
          # Create directory for wrangler logs
          mkdir -p /tmp/wrangler-logs
          
          # Start wrangler dev with bindings
          timeout 60 npx wrangler dev --port 8787 > /tmp/wrangler-logs/output.log 2>&1 &
          WRANGLER_PID=$!
          
          # Retry loop with timeout (max 30 seconds, 1 second intervals)
          MAX_ATTEMPTS=30
          ATTEMPT=0
          RESPONSE=""
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            sleep 1
            
            RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" http://localhost:8787/ 2>/dev/null || echo "000")
            
            # Break if we got any response (not connection refused)
            if [ "$RESPONSE" != "000" ]; then
              break
            fi
            
            # Check if wrangler process is still running
            if ! kill -0 $WRANGLER_PID 2>/dev/null; then
              echo "✗ Wrangler process died unexpectedly"
              cat /tmp/wrangler-logs/output.log
              exit 1
            fi
          done
          
          # Check logs for module errors or uncaught exceptions
          LOGS=$(cat /tmp/wrangler-logs/output.log 2>/dev/null || echo "")
          if echo "$LOGS" | grep -q "No such module"; then
            echo "✗ Worker failed with module resolution error"
            cat /tmp/wrangler-logs/output.log
            kill $WRANGLER_PID 2>/dev/null || true
            rm -f .dev.vars
            exit 1
          fi
          if echo "$LOGS" | grep -qE "Uncaught|uncaught exception"; then
            echo "✗ Worker failed with uncaught exception"
            cat /tmp/wrangler-logs/output.log
            kill $WRANGLER_PID 2>/dev/null || true
            rm -f .dev.vars
            exit 1
          fi
          
          # Clean up .dev.vars
          rm -f .dev.vars
          
          # Fail if no response (timeout)
          if [ "$RESPONSE" = "000" ]; then
            echo "✗ Worker did not respond after $MAX_ATTEMPTS attempts"
            cat /tmp/wrangler-logs/output.log
            kill $WRANGLER_PID 2>/dev/null || true
            exit 1
          fi
          
          # Fail on 5xx server errors
          if [[ "$RESPONSE" =~ ^5[0-9][0-9]$ ]]; then
            echo "✗ Worker returned server error (HTTP $RESPONSE)"
            cat /tmp/response.txt
            cat /tmp/wrangler-logs/output.log
            kill $WRANGLER_PID 2>/dev/null || true
            exit 1
          fi
          
          # Assert success (any 2xx, 3xx, or 4xx is acceptable for boot test)
          echo "✓ Worker booted successfully (HTTP $RESPONSE)"
          kill $WRANGLER_PID 2>/dev/null || true

  # Note: Rust functions are tested in rust-functions.yml (separate workflow)
  # to keep the required check name stable: "Rust functions (test, build WASM)"
