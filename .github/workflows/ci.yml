name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Wrangler dry-run (bundle + bindings check, no upload)
        run: npx wrangler deploy --dry-run

      - name: Verify bundle contains Prisma WASM
        run: |
          # Check that the Prisma WASM module was bundled
          if ls dist/server/assets/query_compiler_fast_bg-*.wasm 1>/dev/null 2>&1; then
            echo "✓ Prisma WASM module found"
            ls -la dist/server/assets/*.wasm
          else
            echo "✗ Prisma WASM module not found in bundle"
            exit 1
          fi
          # Check bundle size is under Workers Free limit (3 MB)
          ENTRY_SIZE=$(stat -c%s dist/server/assets/worker-entry-*.js)
          ENTRY_SIZE_MB=$(echo "scale=2; $ENTRY_SIZE / 1048576" | bc)
          echo "Worker entry size: ${ENTRY_SIZE_MB} MB"
          if [ "$ENTRY_SIZE" -gt 3145728 ]; then
            echo "✗ Worker entry exceeds 3 MB limit"
            exit 1
          fi
          echo "✓ Bundle size is within limits"
