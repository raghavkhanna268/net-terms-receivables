# Sync Secrets to Supabase Vault
#
# Writes JOBS_DRAIN_SECRET and jobs_drain_url to Supabase Vault so pg_cron/pg_net
# jobs can read them at runtime via vault.decrypted_secrets.
#
# This workflow creates secrets if missing or updates them if they exist.
# The secret value never appears in logs, code, or command lines.
#
# Required GitHub Secrets:
#   DATABASE_URL_MIGRATIONS - Postgres URL for the Mumbai session pooler
#   JOBS_DRAIN_SECRET       - Random hex secret for /jobs/drain endpoint auth
#
# See docs/ops/s10-jobs.md for rotation instructions.

name: Sync Vault Secrets

on:
  workflow_dispatch:
    inputs:
      jobs_drain_url:
        description: 'URL for the /jobs/drain endpoint'
        required: false
        default: 'https://net-terms-receivables.raghavkhanna.workers.dev/jobs/drain'

permissions:
  contents: read

concurrency:
  group: sync-vault-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Secrets to Vault
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate inputs
        env:
          DB_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          DRAIN_SECRET: ${{ secrets.JOBS_DRAIN_SECRET }}
          DRAIN_URL: ${{ inputs.jobs_drain_url }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret is not set"
            exit 1
          fi
          if [ -z "$DRAIN_SECRET" ]; then
            echo "::error::JOBS_DRAIN_SECRET secret is not set"
            exit 1
          fi
          # Validate URL format (must be https and end with /jobs/drain)
          if [[ ! "$DRAIN_URL" =~ ^https://[a-z0-9.-]+/jobs/drain$ ]]; then
            echo "::error::jobs_drain_url must match ^https://[a-z0-9.-]+/jobs/drain$ (length: ${#DRAIN_URL} characters)"
            exit 1
          fi
          echo "URL validated (${#DRAIN_URL} characters)"

      - name: Install PostgreSQL 16 client
        run: |
          # Install psql 16+ for \getenv support
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql --version

      - name: Check supabase_vault extension
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'EOSQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'supabase_vault') THEN
              RAISE EXCEPTION 'supabase_vault extension is not installed. Enable it in the Supabase dashboard under Database > Extensions.';
            END IF;
          END;
          $$ LANGUAGE plpgsql;
          EOSQL

      - name: Sync jobs_drain_secret to Vault
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          VAULT_SECRET_VALUE: ${{ secrets.JOBS_DRAIN_SECRET }}
        run: |
          # Mask the secret defensively
          echo "::add-mask::$VAULT_SECRET_VALUE"

          # Use \getenv to read secret from env var (psql 16+), keeping it out of argv
          # Top-level SQL with WHERE EXISTS/NOT EXISTS for idempotent upsert
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'EOSQL'
          \getenv secret_value VAULT_SECRET_VALUE

          -- Update if exists
          SELECT vault.update_secret(id, :'secret_value', name)
          FROM vault.secrets
          WHERE name = 'jobs_drain_secret';

          -- Create if not exists
          SELECT vault.create_secret(:'secret_value', 'jobs_drain_secret')
          WHERE NOT EXISTS (SELECT 1 FROM vault.secrets WHERE name = 'jobs_drain_secret');

          -- Report result
          SELECT CASE
            WHEN updated_at > created_at THEN 'updated secret: jobs_drain_secret'
            ELSE 'created secret: jobs_drain_secret'
          END AS result
          FROM vault.secrets
          WHERE name = 'jobs_drain_secret';
          EOSQL

      - name: Sync jobs_drain_url to Vault
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          VAULT_URL_VALUE: ${{ inputs.jobs_drain_url }}
        run: |
          # URL is not secret but we still use the same safe pattern
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'EOSQL'
          \getenv secret_value VAULT_URL_VALUE

          -- Update if exists
          SELECT vault.update_secret(id, :'secret_value', name)
          FROM vault.secrets
          WHERE name = 'jobs_drain_url';

          -- Create if not exists
          SELECT vault.create_secret(:'secret_value', 'jobs_drain_url')
          WHERE NOT EXISTS (SELECT 1 FROM vault.secrets WHERE name = 'jobs_drain_url');

          -- Report result
          SELECT CASE
            WHEN updated_at > created_at THEN 'updated entry: jobs_drain_url'
            ELSE 'created entry: jobs_drain_url'
          END AS result
          FROM vault.secrets
          WHERE name = 'jobs_drain_url';
          EOSQL

      - name: Verify secrets exist (without exposing values)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          echo "Verifying vault entries exist and can be decrypted..."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            SELECT name, length(decrypted_secret) AS len
            FROM vault.decrypted_secrets
            WHERE name IN ('jobs_drain_secret', 'jobs_drain_url')
            ORDER BY name;
          "
