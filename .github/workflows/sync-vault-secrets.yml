# Sync Secrets to Supabase Vault
#
# Writes JOBS_DRAIN_SECRET and jobs_drain_url to Supabase Vault so pg_cron/pg_net
# jobs can read them at runtime via vault.decrypted_secrets.
#
# This workflow creates secrets if missing or updates them if they exist.
# The secret value never appears in logs, code, or command lines.
#
# Required GitHub Secrets:
#   DATABASE_URL_MIGRATIONS - Postgres URL for the Mumbai session pooler
#   JOBS_DRAIN_SECRET       - Random hex secret for /jobs/drain endpoint auth
#
# See docs/ops/s10-jobs.md for rotation instructions.

name: Sync Vault Secrets

on:
  workflow_dispatch:
    inputs:
      jobs_drain_url:
        description: 'URL for the /jobs/drain endpoint'
        required: false
        default: 'https://net-terms-receivables.raghavkhanna.workers.dev/jobs/drain'

permissions:
  contents: read

concurrency:
  group: sync-vault-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Secrets to Vault
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ secrets.DATABASE_URL_MIGRATIONS }}" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.JOBS_DRAIN_SECRET }}" ]; then
            echo "::error::JOBS_DRAIN_SECRET secret is not set"
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Sync jobs_drain_secret to Vault
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          VAULT_SECRET_VALUE: ${{ secrets.JOBS_DRAIN_SECRET }}
        run: |
          # Mask the secret defensively
          echo "::add-mask::$VAULT_SECRET_VALUE"

          # Use psql -v to pass the secret as a variable, never in argv
          # The :'' quoting prevents SQL injection
          psql "$DATABASE_URL" -v secret_value="$VAULT_SECRET_VALUE" -v secret_name='jobs_drain_secret' <<'EOSQL'
          DO $$
          DECLARE
            existing_id uuid;
          BEGIN
            -- Check supabase_vault extension exists
            IF NOT EXISTS (
              SELECT 1 FROM pg_extension WHERE extname = 'supabase_vault'
            ) THEN
              RAISE EXCEPTION 'supabase_vault extension is not installed. Enable it in the Supabase dashboard under Database > Extensions.';
            END IF;

            -- Check if secret already exists by name
            SELECT id INTO existing_id
            FROM vault.secrets
            WHERE name = :'secret_name';

            IF existing_id IS NOT NULL THEN
              -- Update existing secret
              PERFORM vault.update_secret(existing_id, :'secret_value', :'secret_name');
              RAISE NOTICE 'updated secret: %', :'secret_name';
            ELSE
              -- Create new secret
              PERFORM vault.create_secret(:'secret_value', :'secret_name');
              RAISE NOTICE 'created secret: %', :'secret_name';
            END IF;
          END;
          $$ LANGUAGE plpgsql;
          EOSQL

      - name: Sync jobs_drain_url to Vault
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          VAULT_URL_VALUE: ${{ inputs.jobs_drain_url }}
        run: |
          # URL is not secret but we still use the same safe pattern
          psql "$DATABASE_URL" -v secret_value="$VAULT_URL_VALUE" -v secret_name='jobs_drain_url' <<'EOSQL'
          DO $$
          DECLARE
            existing_id uuid;
          BEGIN
            -- Check if entry already exists by name
            SELECT id INTO existing_id
            FROM vault.secrets
            WHERE name = :'secret_name';

            IF existing_id IS NOT NULL THEN
              -- Update existing entry
              PERFORM vault.update_secret(existing_id, :'secret_value', :'secret_name');
              RAISE NOTICE 'updated entry: %', :'secret_name';
            ELSE
              -- Create new entry
              PERFORM vault.create_secret(:'secret_value', :'secret_name');
              RAISE NOTICE 'created entry: %', :'secret_name';
            END IF;
          END;
          $$ LANGUAGE plpgsql;
          EOSQL

      - name: Verify secrets exist (without exposing values)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          echo "Verifying vault entries exist and can be decrypted..."
          psql "$DATABASE_URL" -c "
            SELECT name, length(decrypted_secret) AS len
            FROM vault.decrypted_secrets
            WHERE name IN ('jobs_drain_secret', 'jobs_drain_url')
            ORDER BY name;
          "
