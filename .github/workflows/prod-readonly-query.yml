# Prod read-only query
#
# Runs a committed, read-only SQL file from scripts/readonly/ against prod.
#
# SAFETY:
#   - Manual trigger only (workflow_dispatch), main branch only
#   - Only files listed in the `query` choice input can run (no ad-hoc SQL)
#   - Read-only enforced twice: PGOPTIONS default_transaction_read_only=on and
#     BEGIN TRANSACTION READ ONLY ... ROLLBACK inside each script
#   - Scripts print only ids, enums, booleans, timestamps and counts (no PII)
#   - msg_ids input is validated as a comma-separated list of integers

name: Prod Read-only Query

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Committed read-only script to run"
        required: true
        type: choice
        options:
          - canary-orders-backstop
          - g3-shop-config-currency-counts
          - hold-audit-s12
          - offline-session-preflight
          - post-drain-aggregates
          - reconcile-key-today
          - redriven-webhook-receipts
          - s12-hold-coverage
          - s22-retention-purge-preview
      msg_ids:
        description: "Comma-separated pgmq msg_ids (e.g. 162,163); used by canary-orders-backstop and redriven-webhook-receipts"
        required: false
        default: "0"
        type: string
      since:
        description: "ISO-8601 UTC timestamp, e.g. 2026-10-24T08:29:23Z (post-drain-aggregates, redriven-webhook-receipts baseline, hold-audit-s12, s12-hold-coverage sweep run time, reconcile-key-today UTC day; default = today)"
        required: false
        default: "1970-01-01T00:00:00Z"
        type: string
      location_id:
        description: "Numeric CompanyLocation id for the held-account drill-down (post-drain-aggregates)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: prod-readonly-query
  cancel-in-progress: false

jobs:
  query:
    name: Run read-only query
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate inputs
        env:
          MSG_IDS: ${{ inputs.msg_ids }}
          SINCE: ${{ inputs.since }}
          LOCATION_ID: ${{ inputs.location_id }}
        run: |
          set -euo pipefail
          if [[ ! "$MSG_IDS" =~ ^[0-9]+(,[0-9]+){0,49}$ ]]; then
            echo "::error::msg_ids must be a comma-separated list of integers (max 50)"
            exit 1
          fi
          if [[ ! "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$ ]]; then
            echo "::error::since must be an ISO-8601 UTC timestamp like 2026-10-24T08:29:23Z"
            exit 1
          fi
          if [[ ! "$LOCATION_ID" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::location_id must be numeric"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          QUERY_NAME: ${{ inputs.query }}
          MSG_IDS: ${{ inputs.msg_ids }}
          SINCE: ${{ inputs.since }}
          LOCATION_ID: ${{ inputs.location_id }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi
          FILE="scripts/readonly/${QUERY_NAME}.sql"
          if [ ! -f "$FILE" ]; then
            echo "::error::Unknown query: $QUERY_NAME"
            exit 1
          fi
          if ! command -v psql &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          psql -X -q -v ON_ERROR_STOP=1 -v "msg_ids=${MSG_IDS}" -v "since=${SINCE}" -v "location_id=${LOCATION_ID}" -f "$FILE" "$DATABASE_URL"
