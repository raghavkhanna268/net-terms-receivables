# Prod read-only query
#
# Runs a committed, read-only SQL file from scripts/readonly/ against prod.
#
# SAFETY:
#   - Manual trigger only (workflow_dispatch), main branch only
#   - Only files listed in the `query` choice input can run (no ad-hoc SQL)
#   - Read-only enforced twice: PGOPTIONS default_transaction_read_only=on and
#     BEGIN TRANSACTION READ ONLY ... ROLLBACK inside each script
#   - Scripts print only ids, enums, booleans, timestamps and counts (no PII)
#   - msg_ids input is validated as a comma-separated list of integers
#   - shop_idx is a choice (1|2|reviewer), never a domain; the domains come
#     only from secrets (E2E_SHOP, ALLOWED_DEV_STORE), validated then masked

name: Prod Read-only Query

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Committed read-only script to run"
        required: true
        type: choice
        options:
          - canary-orders-backstop
          - dlq-classify-bulk
          - g3-noninr-is-dev-store
          - g3-shop-config-currency-counts
          - hold-audit-s12
          - initial-sync-timing
          - offline-session-preflight
          - pgmq-archive-age
          - post-drain-aggregates
          - redriven-webhook-receipts
          - s12-hold-coverage
          - s18-reminder-rule-dupes
          - s18-reminders-due-7d
          - s22-retention-purge-preview
      msg_ids:
        description: "Comma-separated pgmq msg_ids (e.g. 162,163); used by canary-orders-backstop and redriven-webhook-receipts"
        required: false
        default: "0"
        type: string
      since:
        description: "ISO-8601 UTC timestamp, e.g. 2026-10-24T08:29:23Z (post-drain-aggregates, redriven-webhook-receipts baseline, hold-audit-s12, s12-hold-coverage sweep run time)"
        required: false
        default: "1970-01-01T00:00:00Z"
        type: string
      location_id:
        description: "Numeric CompanyLocation id for the held-account drill-down (post-drain-aggregates)"
        required: false
        default: "0"
        type: string
      shop_idx:
        description: "Shop for initial-sync-timing: 1 = E2E_SHOP, 2 = ALLOWED_DEV_STORE, reviewer = the single other installed shop (fails closed unless exactly one)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - reviewer

permissions:
  contents: read

concurrency:
  group: prod-readonly-query
  cancel-in-progress: false

jobs:
  query:
    name: Run read-only query
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate inputs
        env:
          MSG_IDS: ${{ inputs.msg_ids }}
          SINCE: ${{ inputs.since }}
          LOCATION_ID: ${{ inputs.location_id }}
          SHOP_IDX: ${{ inputs.shop_idx }}
        run: |
          set -euo pipefail
          if [[ ! "$MSG_IDS" =~ ^[0-9]+(,[0-9]+){0,49}$ ]]; then
            echo "::error::msg_ids must be a comma-separated list of integers (max 50)"
            exit 1
          fi
          if [[ ! "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$ ]]; then
            echo "::error::since must be an ISO-8601 UTC timestamp like 2026-10-24T08:29:23Z"
            exit 1
          fi
          if [[ ! "$LOCATION_ID" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::location_id must be numeric"
            exit 1
          fi
          if [[ ! "$SHOP_IDX" =~ ^(1|2|reviewer)$ ]]; then
            echo "::error::shop_idx must be 1, 2 or reviewer"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          QUERY_NAME: ${{ inputs.query }}
          MSG_IDS: ${{ inputs.msg_ids }}
          SINCE: ${{ inputs.since }}
          LOCATION_ID: ${{ inputs.location_id }}
          SHOP_IDX: ${{ inputs.shop_idx }}
          # Secret, so the env header prints ***. Used only as the psql
          # variable :allowed (g3-noninr-is-dev-store); never printed.
          ALLOWED_DEV_STORE: ${{ secrets.ALLOWED_DEV_STORE }}
          # Secret, used only as the psql variable :e2e (initial-sync-timing
          # shop_idx 1 and the reviewer exclusion); never printed.
          E2E_SHOP: ${{ secrets.E2E_SHOP }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          ALLOWED="${ALLOWED_DEV_STORE:-}"
          if [ -n "$ALLOWED" ]; then
            # Validate before masking so a multi-line value cannot slip past ::add-mask::.
            if [[ ! "$ALLOWED" =~ ^[a-z0-9-]+\.myshopify\.com$ ]]; then
              ALLOWED=""
            else
              echo "::add-mask::$ALLOWED"
            fi
          fi
          if [ "$QUERY_NAME" = "g3-noninr-is-dev-store" ] && [ -z "$ALLOWED" ]; then
            echo "::error::ALLOWED_DEV_STORE secret is unset or invalid (required by g3-noninr-is-dev-store)"
            exit 1
          fi
          E2E="${E2E_SHOP:-}"
          if [ -n "$E2E" ]; then
            # Validate before masking, same as ALLOWED above.
            if [[ ! "$E2E" =~ ^[a-z0-9-]+\.myshopify\.com$ ]]; then
              E2E=""
            else
              echo "::add-mask::$E2E"
            fi
          fi
          if [ "$QUERY_NAME" = "initial-sync-timing" ]; then
            # Both domains are needed: shop_idx 1/2 select them and reviewer
            # excludes them. Fail closed if either is missing or they coincide.
            if [ -z "$E2E" ] || [ -z "$ALLOWED" ] || [ "$E2E" = "$ALLOWED" ]; then
              echo "::error::E2E_SHOP and ALLOWED_DEV_STORE secrets must both be set, valid and different (required by initial-sync-timing)"
              exit 1
            fi
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi
          FILE="scripts/readonly/${QUERY_NAME}.sql"
          if [ ! -f "$FILE" ]; then
            echo "::error::Unknown query: $QUERY_NAME"
            exit 1
          fi
          if ! command -v psql &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          psql -X -q -v ON_ERROR_STOP=1 -v "allowed=${ALLOWED}" -v "e2e=${E2E}" -v "shop_idx=${SHOP_IDX}" -v "msg_ids=${MSG_IDS}" -v "since=${SINCE}" -v "location_id=${LOCATION_ID}" -f "$FILE" "$DATABASE_URL"
