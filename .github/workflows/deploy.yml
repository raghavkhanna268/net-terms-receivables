# Deploys the Cloudflare Worker when code merges to main.
#
# Triggers:
#   - workflow_run: When CI or Database Migrations completes successfully (push to main only)
#   - workflow_dispatch: Manual deployment (main branch only)
#
# Design:
#   Always deploys the CURRENT main HEAD (not the triggering run's sha) to prevent
#   stale or out-of-order deploys. Before deploying, verifies:
#     1. CI workflow has a successful push run for that sha on main
#     2. No Database Migrations run on main is active (not completed)
#     3. The newest migration run on main succeeded (or was skipped)
#   If conditions aren't met yet, skips with a notice (not a failure).
#   Re-checks main HEAD hasn't moved right before wrangler deploy.
#
# Repository secrets required:
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token with Workers permissions
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
#   SHOPIFY_API_KEY        - Shopify app API key (synced as Worker secret)
#   SHOPIFY_API_SECRET     - Shopify app API secret (synced as Worker secret)

name: Deploy

on:
  workflow_run:
    workflows:
      - "CI"
      - "Database Migrations"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only deploy from main branch pushes, never from PR runs or other branches.
    # The upstream run must have succeeded: a failed/cancelled CI or migration
    # run skips this job entirely (skipped jobs use no Actions minutes) instead
    # of spinning up a runner just for the readiness gate to fail.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Resolve current main HEAD
        id: main-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved main HEAD: $SHA"

      - name: Checkout main HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.main-head.outputs.sha }}
          persist-credentials: false

      - name: Check deploy readiness
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.main-head.outputs.sha }}
        run: |
          echo "Checking deploy readiness for $MAIN_SHA"

          # 1. Check CI has a successful push run for this sha on main
          CI_RESULT=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$MAIN_SHA&branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0] // empty')

          if [ -z "$CI_RESULT" ]; then
            echo "::notice::CI workflow has not run for $MAIN_SHA on main yet. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CI_STATUS=$(echo "$CI_RESULT" | jq -r '.status')
          CI_CONCLUSION=$(echo "$CI_RESULT" | jq -r '.conclusion // "pending"')

          if [ "$CI_STATUS" != "completed" ]; then
            echo "::notice::CI workflow is still running for $MAIN_SHA. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "::error::CI workflow failed for $MAIN_SHA (conclusion: $CI_CONCLUSION)"
            exit 1
          fi
          echo "✓ CI is green for $MAIN_SHA"

          # 2. Check no migrations run on main is active (covers queued, in_progress, requested, waiting, pending)
          MIGRATE_ACTIVE=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/migrate.yml/runs?branch=main&event=push&per_page=10" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')

          if [ "$MIGRATE_ACTIVE" -gt 0 ]; then
            echo "::notice::$MIGRATE_ACTIVE migration(s) not yet completed on main. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✓ No migrations active"

          # 3. Check the newest migration run on main succeeded (blocks deploy if last migration failed)
          LATEST_MIGRATE=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/migrate.yml/runs?branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0] // empty')

          if [ -n "$LATEST_MIGRATE" ]; then
            LATEST_CONCLUSION=$(echo "$LATEST_MIGRATE" | jq -r '.conclusion // "pending"')
            LATEST_URL=$(echo "$LATEST_MIGRATE" | jq -r '.html_url')

            case "$LATEST_CONCLUSION" in
              success|skipped)
                echo "✓ Latest migration run on main: $LATEST_CONCLUSION"
                ;;
              *)
                echo "::error::Latest migration run on main is $LATEST_CONCLUSION. Fix or re-run migrations before deploying. See: $LATEST_URL"
                exit 1
                ;;
            esac
          else
            echo "✓ No migration runs on main yet"
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "✓ All checks passed, ready to deploy"

      - name: Guard Hyperdrive configuration
        if: steps.gate.outputs.ready == 'true'
        run: |
          # Parse wrangler.jsonc: strip comments, extract hyperdrive[0].id
          HYPERDRIVE_ID=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('wrangler.jsonc', 'utf8');
            // Strip single-line // comments (not inside strings)
            const noComments = content.replace(/^\s*\/\/.*$/gm, '').replace(/,(\s*[}\]])/g, '\$1');
            try {
              const config = JSON.parse(noComments);
              const id = config.hyperdrive?.[0]?.id || '';
              console.log(id);
            } catch (e) {
              console.error('Failed to parse wrangler.jsonc:', e.message);
              process.exit(1);
            }
          ")

          if [ -z "$HYPERDRIVE_ID" ]; then
            echo "::error file=wrangler.jsonc::Hyperdrive id is missing or empty in hyperdrive[0].id. Create with 'wrangler hyperdrive create' and commit the id."
            exit 1
          fi

          if echo "$HYPERDRIVE_ID" | grep -qiE '<|YOUR_|PLACEHOLDER'; then
            echo "::error file=wrangler.jsonc::Hyperdrive id is a placeholder ($HYPERDRIVE_ID). Replace with actual id from 'wrangler hyperdrive create'."
            exit 1
          fi

          echo "✓ Hyperdrive id configured: $HYPERDRIVE_ID"

      - name: Setup Node
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Prepare Worker secrets file
        if: steps.gate.outputs.ready == 'true'
        id: secrets
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
        run: |
          umask 077
          f="$RUNNER_TEMP/worker-secrets.json"

          # Build JSON with only secrets that have values
          jq -n \
            --arg key "$SHOPIFY_API_KEY" \
            --arg secret "$SHOPIFY_API_SECRET" \
            '{SHOPIFY_API_KEY: $key, SHOPIFY_API_SECRET: $secret} | with_entries(select(.value != ""))' \
            > "$f"

          n=$(jq 'length' "$f")
          echo "Syncing $n Worker secret(s): $(jq -r 'keys | join(", ")' "$f")"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Verify main HEAD unchanged
        if: steps.gate.outputs.ready == 'true'
        id: verify-head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.main-head.outputs.sha }}
        run: |
          CURRENT_SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')

          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "::notice::main HEAD moved from $EXPECTED_SHA to $CURRENT_SHA during build. Skipping deploy to avoid deploying stale code."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "✓ main HEAD unchanged: $CURRENT_SHA"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with Wrangler
        if: steps.gate.outputs.ready == 'true' && steps.verify-head.outputs.changed != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy --secrets-file ${{ steps.secrets.outputs.file }} --var SENTRY_RELEASE:${{ github.sha }}

      - name: Upload source maps to Sentry
        if: steps.gate.outputs.ready == 'true' && steps.verify-head.outputs.changed != 'true' && secrets.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npx @sentry/cli releases new "${{ github.sha }}" \
            --org termwise \
            --project net-terms-app \
            --url https://sentry.io

          npx @sentry/cli sourcemaps upload \
            --org termwise \
            --project net-terms-app \
            --release "${{ github.sha }}" \
            --url https://sentry.io \
            ./dist

          npx @sentry/cli releases finalize "${{ github.sha }}" \
            --org termwise \
            --project net-terms-app \
            --url https://sentry.io

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
