# Production diagnostics workflow with optional token refresh
#
# Checks OAuth session state, protected customer data access, and database
# extensions/jobs for a shop.
# Used by ops to verify Shopify connectivity and infrastructure without modifying data.
#
# SAFETY:
#   - Manual trigger only (workflow_dispatch)
#   - Runs only from main branch
#   - Read-only by default (BEGIN READ ONLY + PGOPTIONS as belt-and-braces)
#   - Token refresh requires explicit opt-in via refresh_if_expired input
#   - No artifacts uploaded
#   - Access token is masked in logs and kept off argv
#   - No customer PII is printed
#   - Never prints cron.job.command (may contain URLs/secrets)
#   - Never selects vault.decrypted_secrets (only checks name existence)
#
# Required secrets:
#   DATABASE_URL_MIGRATIONS - Supabase SESSION pooler connection string
#
# For token refresh (optional):
#   DATABASE_URL_SESSION    - Supabase SESSION pooler for token refresh (write access)
#   SHOPIFY_API_KEY         - App's API key (client_id) for token refresh
#   SHOPIFY_API_SECRET      - App's API secret (client_secret) for token refresh
#
# Optional:
#   Configure a GitHub Environment named "production" to require approval
#   before running diagnostics against prod.

name: Prod Diagnostics

on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Shopify shop domain (e.g., example.myshopify.com)"
        required: true
        default: "net-terms-receivables.myshopify.com"
        type: string
      fail_on_expired:
        description: "Fail if offline token has expired (strict mode)"
        required: false
        default: false
        type: boolean
      refresh_if_expired:
        description: "Attempt to refresh expired token before probe"
        required: false
        default: false
        type: boolean
      invoke_reconcile:
        description: "NOT read-only: runs a real prod reconcile enqueue for all installed shops"
        required: false
        default: false
        type: boolean
      ensure_validation:
        description: "NOT read-only: creates/enables the credit-check-validation on the shop if missing or disabled"
        required: false
        default: false
        type: boolean
      redrive_dlq:
        description: "NOT read-only: redrive dead-letter queue messages back to original queues"
        required: false
        default: false
        type: boolean
      redrive_topic:
        description: "Topic filter for DLQ redrive (required when redrive_dlq=true, e.g. ORDERS_UPDATED)"
        required: false
        type: string
      redrive_limit:
        description: "Maximum messages to redrive (default: 100)"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  diagnostics:
    name: Run Production Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Uncomment to require approval via GitHub Environment:
    # environment: production

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate inputs
        env:
          SHOP_DOMAIN: ${{ inputs.shop }}
        run: |
          set -euo pipefail
          if [[ ! "$SHOP_DOMAIN" =~ ^[a-z0-9-]+\.myshopify\.com$ ]]; then
            echo "::error::Invalid shop domain format. Expected: example.myshopify.com"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Psql capture self-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL_MIGRATIONS not set, skipping psql self-check"
            exit 0
          fi

          # Verify that psql -X -q captures clean output without command tags
          # This catches the P1 issue where BEGIN/ROLLBACK tags corrupt captures
          RESULT=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT 't'::text;
          ROLLBACK;
          EOSQL
          )

          if [ "$RESULT" != "t" ]; then
            echo "::error::Psql self-check failed. Expected 't', got: '$RESULT'"
            echo "This indicates BEGIN/ROLLBACK command tags are corrupting captures."
            exit 1
          fi

          echo "✓ Psql capture self-check passed (output = 't')"

      - name: Session check
        id: session
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          SHOP_DOMAIN: ${{ inputs.shop }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "Querying Session table for shop: $SHOP_DOMAIN"
          echo ""

          psql -X -q -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT
            shop,
            "isOnline",
            scope,
            CASE WHEN "accessToken" IS NOT NULL AND "accessToken" != '' THEN true ELSE false END AS "hasAccessToken",
            expires
          FROM "Session"
          WHERE shop = :'shop';
          ROLLBACK;
          EOSQL

          echo ""
          echo "--- Offline Session Token Status ---"

          # Fetch offline session expiry and refresh token presence
          OFFLINE_DATA=$(psql -X -q -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A -F '|' "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT
            expires AT TIME ZONE 'UTC',
            CASE WHEN "refreshToken" IS NOT NULL AND "refreshToken" != '' THEN 'true' ELSE 'false' END
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          ROLLBACK;
          EOSQL
          )

          if [ -z "$OFFLINE_DATA" ]; then
            echo "No offline session found"
            {
              echo "token_expired=unknown"
              echo "has_refresh_token=false"
              echo "offline_session_exists=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXPIRES_RAW=$(echo "$OFFLINE_DATA" | cut -d'|' -f1)
          HAS_REFRESH=$(echo "$OFFLINE_DATA" | cut -d'|' -f2)

          echo "has_refresh_token: $HAS_REFRESH"

          if [ -z "$EXPIRES_RAW" ] || [ "$EXPIRES_RAW" = "" ]; then
            echo "token_expired: false (no expiry set - legacy non-expiring token)"
            {
              echo "has_refresh_token=$HAS_REFRESH"
              echo "offline_session_exists=true"
              echo "token_expired=false"
            } >> "$GITHUB_OUTPUT"
          else
            # Compare expiry to current UTC time (expires is already in UTC from query)
            EXPIRES_EPOCH=$(date -u -d "$EXPIRES_RAW" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date -u +%s)
            if [ "$EXPIRES_EPOCH" -le "$NOW_EPOCH" ]; then
              echo "token_expired: true (expired at ${EXPIRES_RAW} UTC)"
              {
                echo "has_refresh_token=$HAS_REFRESH"
                echo "offline_session_exists=true"
                echo "token_expired=true"
              } >> "$GITHUB_OUTPUT"
            else
              echo "token_expired: false (expires at ${EXPIRES_RAW} UTC)"
              {
                echo "has_refresh_token=$HAS_REFRESH"
                echo "offline_session_exists=true"
                echo "token_expired=false"
              } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Session metadata per shop
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Session Metadata (all shops) ==="
          echo ""

          # Check if needsReauth column exists (from PR #76)
          NEEDS_REAUTH_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT EXISTS(
            SELECT 1 FROM information_schema.columns
            WHERE table_name = 'Session' AND column_name = 'needsReauth'
          );
          ROLLBACK;
          EOSQL
          )

          if [ "$NEEDS_REAUTH_EXISTS" = "t" ]; then
            echo "Session metadata (with needsReauth column):"
            # Note: Session table has no updatedAt column - only print existing columns
            psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT
            shop,
            expires,
            "refreshTokenExpires",
            "needsReauth"
          FROM "Session"
          WHERE "isOnline" = false
          ORDER BY shop;
          ROLLBACK;
          EOSQL
          else
            echo "Session metadata (needsReauth column not present):"
            psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT
            shop,
            expires,
            "refreshTokenExpires"
          FROM "Session"
          WHERE "isOnline" = false
          ORDER BY shop;
          ROLLBACK;
          EOSQL
          fi

          echo ""
          echo "Session metadata summary (JSON):"
          if [ "$NEEDS_REAUTH_EXISTS" = "t" ]; then
            psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_agg(json_build_object(
            'shop', shop,
            'expires', expires,
            'refreshTokenExpires', "refreshTokenExpires",
            'needsReauth', "needsReauth"
          ))
          FROM "Session"
          WHERE "isOnline" = false;
          ROLLBACK;
          EOSQL
          else
            psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_agg(json_build_object(
            'shop', shop,
            'expires', expires,
            'refreshTokenExpires', "refreshTokenExpires"
          ))
          FROM "Session"
          WHERE "isOnline" = false;
          ROLLBACK;
          EOSQL
          fi

      - name: Prisma migrations check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Prisma Migrations Check ==="
          echo ""

          # Get expected migrations from repo directory (no hardcoded prefixes)
          EXPECTED_MIGRATIONS=$(ls -1 prisma/migrations | grep -E '^[0-9]+_' | sort)
          echo "Expected migrations from repo:"
          echo "$EXPECTED_MIGRATIONS"
          echo ""

          # Get applied migrations from database
          echo "Applied migrations in database:"
          psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT
            migration_name,
            finished_at,
            rolled_back_at,
            CASE WHEN logs IS NULL THEN true ELSE false END AS logs_is_null
          FROM _prisma_migrations
          ORDER BY migration_name;
          ROLLBACK;
          EOSQL

          echo ""
          echo "Checking for missing or failed migrations..."

          # Build a temp table query to compare
          MIGRATION_CHECK=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<EOSQL
          BEGIN READ ONLY;
          WITH expected AS (
            SELECT unnest(ARRAY[$(echo "$EXPECTED_MIGRATIONS" | sed "s/^/'/" | sed "s/$/'/" | tr '\n' ',' | sed 's/,$//')]) AS name
          ),
          applied AS (
            SELECT migration_name, finished_at, rolled_back_at
            FROM _prisma_migrations
          )
          SELECT json_build_object(
            'missing', (
              SELECT COALESCE(json_agg(e.name), '[]'::json)
              FROM expected e
              LEFT JOIN applied a ON a.migration_name = e.name
              WHERE a.migration_name IS NULL
            ),
            'failed', (
              SELECT COALESCE(json_agg(a.migration_name), '[]'::json)
              FROM applied a
              WHERE a.finished_at IS NULL OR a.rolled_back_at IS NOT NULL
            ),
            'total_expected', (SELECT COUNT(*) FROM expected),
            'total_applied', (SELECT COUNT(*) FROM applied WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL)
          );
          ROLLBACK;
          EOSQL
          )

          echo "Migration status:"
          echo "$MIGRATION_CHECK" | jq .

      - name: Invoice aging buckets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Invoice Aging Buckets (per-shop timezone) ==="
          echo ""
          echo "Bucket definitions: current (not due), 1-30, 31-60, 61-90, 90+ days past due"
          echo "Days computed as: (now AT TIME ZONE tz)::date - (dueAt AT TIME ZONE tz)::date"
          echo ""

          # Calculate aging buckets using shop's IANA timezone (from S7 #80)
          psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          WITH aging AS (
            SELECT
              s.domain AS shop,
              s.currency,
              i.outstanding,
              COALESCE(s.timezone, 'Asia/Kolkata') AS tz,
              CASE
                WHEN i."dueAt" IS NULL THEN 0
                ELSE (
                  (now() AT TIME ZONE COALESCE(s.timezone, 'Asia/Kolkata'))::date -
                  (i."dueAt" AT TIME ZONE COALESCE(s.timezone, 'Asia/Kolkata'))::date
                )
              END AS days_past_due
            FROM "Invoice" i
            JOIN "Shop" s ON i."shopId" = s.id
            WHERE i.status = 'open'
          )
          SELECT
            shop,
            currency,
            CASE
              WHEN days_past_due <= 0 THEN 'current'
              WHEN days_past_due <= 30 THEN '1-30'
              WHEN days_past_due <= 60 THEN '31-60'
              WHEN days_past_due <= 90 THEN '61-90'
              ELSE '90+'
            END AS bucket,
            COUNT(*) AS count,
            SUM(outstanding) AS total
          FROM aging
          GROUP BY shop, currency,
            CASE
              WHEN days_past_due <= 0 THEN 'current'
              WHEN days_past_due <= 30 THEN '1-30'
              WHEN days_past_due <= 60 THEN '31-60'
              WHEN days_past_due <= 90 THEN '61-90'
              ELSE '90+'
            END
          ORDER BY shop, currency,
            CASE
              WHEN days_past_due <= 0 THEN 1
              WHEN days_past_due <= 30 THEN 2
              WHEN days_past_due <= 60 THEN 3
              WHEN days_past_due <= 90 THEN 4
              ELSE 5
            END;
          ROLLBACK;
          EOSQL

          echo ""
          echo "Aging summary (JSON):"
          psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          WITH aging AS (
            SELECT
              s.domain AS shop,
              s.currency,
              i.outstanding,
              CASE
                WHEN i."dueAt" IS NULL THEN 0
                ELSE (
                  (now() AT TIME ZONE COALESCE(s.timezone, 'Asia/Kolkata'))::date -
                  (i."dueAt" AT TIME ZONE COALESCE(s.timezone, 'Asia/Kolkata'))::date
                )
              END AS days_past_due
            FROM "Invoice" i
            JOIN "Shop" s ON i."shopId" = s.id
            WHERE i.status = 'open'
          ),
          bucketed AS (
            SELECT
              shop,
              currency,
              CASE
                WHEN days_past_due <= 0 THEN 'current'
                WHEN days_past_due <= 30 THEN '1-30'
                WHEN days_past_due <= 60 THEN '31-60'
                WHEN days_past_due <= 90 THEN '61-90'
                ELSE '90+'
              END AS bucket,
              outstanding
            FROM aging
          )
          SELECT json_agg(json_build_object(
            'shop', shop,
            'currency', currency,
            'bucket', bucket,
            'count', count,
            'total', total
          ))
          FROM (
            SELECT shop, currency, bucket, COUNT(*) AS count, SUM(outstanding) AS total
            FROM bucketed
            GROUP BY shop, currency, bucket
          ) sub;
          ROLLBACK;
          EOSQL

      - name: BuyerAccount and bulk operations counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== BuyerAccount Counts ==="
          echo ""

          psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_build_object(
            'distinct_buyer_accounts', (SELECT COUNT(DISTINCT id) FROM "BuyerAccount"),
            'buyer_accounts_with_deleted_company_location', (
              SELECT COUNT(DISTINCT ba.id)
              FROM "BuyerAccount" ba
              WHERE ba."companyLocationId" IS NOT NULL
                AND EXISTS (
                  SELECT 1 FROM s6_processed_webhooks pw
                  WHERE pw.topic = 'COMPANY_LOCATIONS_DELETE'
                    AND pw.resource_gid = ba."companyLocationId"
                )
            )
          );
          ROLLBACK;
          EOSQL

          echo ""
          echo "=== Bulk Operations by Type and Status ==="
          echo ""

          # Check if s6_bulk_operations table exists
          BULK_OPS_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT to_regclass('public.s6_bulk_operations') IS NOT NULL;
          ROLLBACK;
          EOSQL
          )

          if [ "$BULK_OPS_EXISTS" = "t" ]; then
            psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT
            bulk_type,
            CASE
              WHEN completed_at IS NOT NULL THEN 'finished'
              WHEN failure_count > 0 THEN 'failed'
              ELSE 'pending'
            END AS status,
            COUNT(*) AS count
          FROM s6_bulk_operations
          GROUP BY bulk_type,
            CASE
              WHEN completed_at IS NOT NULL THEN 'finished'
              WHEN failure_count > 0 THEN 'failed'
              ELSE 'pending'
            END
          ORDER BY bulk_type, status;
          ROLLBACK;
          EOSQL

            echo ""
            echo "Bulk operations summary (JSON):"
            psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_build_object(
            'by_type_and_status', (
              SELECT json_agg(json_build_object(
                'bulk_type', bulk_type,
                'status', status,
                'count', count
              ))
              FROM (
                SELECT
                  bulk_type,
                  CASE
                    WHEN completed_at IS NOT NULL THEN 'finished'
                    WHEN failure_count > 0 THEN 'failed'
                    ELSE 'pending'
                  END AS status,
                  COUNT(*) AS count
                FROM s6_bulk_operations
                GROUP BY bulk_type,
                  CASE
                    WHEN completed_at IS NOT NULL THEN 'finished'
                    WHEN failure_count > 0 THEN 'failed'
                    ELSE 'pending'
                  END
              ) sub
            )
          );
          ROLLBACK;
          EOSQL
          else
            echo "::notice::s6_bulk_operations table not found"
            echo '{"s6_bulk_operations_exists": false}' | jq .
          fi

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Refresh expired token
        id: refresh
        if: ${{ inputs.refresh_if_expired && steps.session.outputs.token_expired == 'true' && steps.session.outputs.has_refresh_token == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SESSION }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SHOP_DOMAIN: ${{ inputs.shop }}
        run: |
          set -euo pipefail

          # Mask secrets immediately
          if [ -n "$SHOPIFY_API_KEY" ]; then echo "::add-mask::$SHOPIFY_API_KEY"; fi
          if [ -n "$SHOPIFY_API_SECRET" ]; then echo "::add-mask::$SHOPIFY_API_SECRET"; fi

          # Check required secrets
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_SESSION secret not set (required for token refresh)"
            echo "refresh_success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SHOPIFY_API_KEY" ] || [ -z "$SHOPIFY_API_SECRET" ]; then
            echo "::error::SHOPIFY_API_KEY or SHOPIFY_API_SECRET secret not set (required for token refresh)"
            echo "refresh_success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Attempting to refresh expired token for shop: $SHOP_DOMAIN"
          echo ""

          # Run the refresh script (never outputs tokens - probe re-reads from DB)
          if ! REFRESH_RESULT=$(npx tsx scripts/lib/refresh-offline-token.ts \
            --shop "$SHOP_DOMAIN" \
            --threshold-minutes 0); then
            true
          fi

          # Guard against non-JSON output breaking jq
          if ! echo "$REFRESH_RESULT" | jq -e . >/dev/null 2>&1; then
            echo "::warning::Refresh script returned non-JSON output"
            {
              echo "refresh_success=false"
              echo "refresh_error_code=script_error"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REFRESH_SUCCESS=$(echo "$REFRESH_RESULT" | jq -r '.success // false' 2>/dev/null || echo false)
          REFRESH_ERROR_CODE=$(echo "$REFRESH_RESULT" | jq -r '.errorCode // ""' 2>/dev/null || echo "")
          WAS_REFRESHED=$(echo "$REFRESH_RESULT" | jq -r '.wasRefreshed // false' 2>/dev/null || echo false)

          if [ "$REFRESH_SUCCESS" = "true" ]; then
            echo "::notice::Token refresh successful (wasRefreshed: $WAS_REFRESHED)"
            {
              echo "refresh_success=true"
              echo "was_refreshed=$WAS_REFRESHED"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Token refresh failed: $REFRESH_ERROR_CODE"
            {
              echo "refresh_success=false"
              echo "refresh_error_code=$REFRESH_ERROR_CODE"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Protected customer data probe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          SHOP_DOMAIN: ${{ inputs.shop }}
          TOKEN_EXPIRED: ${{ steps.session.outputs.token_expired }}
          OFFLINE_SESSION_EXISTS: ${{ steps.session.outputs.offline_session_exists }}
          FAIL_ON_EXPIRED: ${{ inputs.fail_on_expired }}
          REFRESH_REQUESTED: ${{ inputs.refresh_if_expired }}
          REFRESH_SUCCESS: ${{ steps.refresh.outputs.refresh_success }}
          HAS_REFRESH_TOKEN: ${{ steps.session.outputs.has_refresh_token }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          CURL_CONFIG=""
          HTTP_RESPONSE=""
          cleanup() {
            rm -f "$CURL_CONFIG" "$HTTP_RESPONSE"
          }
          trap cleanup EXIT

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          if [ "$OFFLINE_SESSION_EXISTS" != "true" ]; then
            echo "::error::No offline session found for shop $SHOP_DOMAIN"
            exit 1
          fi

          if [ "$TOKEN_EXPIRED" = "true" ] && [ "$REFRESH_SUCCESS" != "true" ]; then
            echo "::notice::Offline access token has expired."
            echo ""
            echo "The offline access token for this shop has expired."

            if [ "$REFRESH_REQUESTED" = "true" ]; then
              if [ "$HAS_REFRESH_TOKEN" != "true" ]; then
                echo "Token refresh was requested but no refresh token is available."
              else
                echo "Token refresh was attempted but failed."
              fi
            else
              echo "To renew it, re-run with 'refresh_if_expired' enabled"
            fi
            echo ""
            echo "Skipping Admin API probe (token expired)."
            echo '{"status": "skipped", "reason": "token_expired"}' | jq .

            if [ "$FAIL_ON_EXPIRED" = "true" ]; then
              echo "::error::Token expired and fail_on_expired=true"
              exit 1
            fi
            exit 0
          fi

          ACCESS_TOKEN=$(psql -X -q -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT "accessToken"
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          ROLLBACK;
          EOSQL
          )

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::No offline session found for shop $SHOP_DOMAIN"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "Probing Admin GraphQL API for protected customer data access..."
          echo ""

          QUERY='{"query":"{ customers(first:1) { nodes { id email firstName lastName } } }"}'

          CURL_CONFIG=$(mktemp)
          chmod 600 "$CURL_CONFIG"
          cat > "$CURL_CONFIG" <<EOF
          header = "Content-Type: application/json"
          header = "X-Shopify-Access-Token: $ACCESS_TOKEN"
          EOF

          HTTP_RESPONSE=$(mktemp)
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
            -X POST \
            --config "$CURL_CONFIG" \
            --data-binary "$QUERY" \
            "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json")

          echo "HTTP Status: $HTTP_STATUS"
          echo ""

          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ]; then
            echo "::warning::Admin API returned HTTP $HTTP_STATUS"
            ERROR_CODES=$(jq -r 'if .errors then {error_codes: [.errors[] | .extensions.code // "UNKNOWN"]} else {error_code: "unknown"} end' "$HTTP_RESPONSE" 2>/dev/null || echo '{"error_code": "parse_failed"}')
            echo "{\"status\": \"auth_failed\", \"http_status\": $HTTP_STATUS, \"details\": $ERROR_CODES}" | jq .
            exit 0
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            RESULT=$(jq -r 'if .errors then {status: "error", graphql_error_codes: [.errors[] | .extensions.code // "UNKNOWN"]} else {status: "success", customer_found: ((.data.customers.nodes | length) > 0), email_non_null: ((.data.customers.nodes[0].email // null) != null)} end' "$HTTP_RESPONSE")
            echo "Protected Customer Data Probe Results:"
            echo "$RESULT" | jq .
          else
            echo "::warning::GraphQL API request failed with HTTP $HTTP_STATUS"
            echo "{\"status\": \"error\", \"http_status\": $HTTP_STATUS}" | jq .
          fi

      - name: Database extensions and jobs check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Database Extensions ==="
          echo ""

          psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT e.extname AS extension, true AS installed, e.extversion AS version
          FROM pg_extension e
          WHERE e.extname IN ('pgmq', 'pg_cron', 'pg_net', 'supabase_vault')
          ORDER BY e.extname;
          ROLLBACK;
          EOSQL

          echo ""
          echo "Extensions status (JSON):"
          psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_build_object(
            'pgmq_installed', EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pgmq'),
            'pg_cron_installed', EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pg_cron'),
            'pg_net_installed', EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pg_net'),
            'supabase_vault_installed', EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'supabase_vault')
          );
          ROLLBACK;
          EOSQL

          echo ""
          echo "=== Cron Jobs ==="
          echo ""

          CRON_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT EXISTS(SELECT 1 FROM information_schema.schemata WHERE schema_name = 'cron');
          ROLLBACK;
          EOSQL
          )

          if [ "$CRON_EXISTS" = "t" ]; then
            echo "Cron jobs (command omitted for security):"
            psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT jobid, jobname, schedule, active FROM cron.job ORDER BY jobname;
          ROLLBACK;
          EOSQL

            echo ""
            psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_build_object(
            's10_drain_job_exists', EXISTS(SELECT 1 FROM cron.job WHERE jobname = 's10_drain_every_minute'),
            's10_drain_job_active', COALESCE((SELECT active FROM cron.job WHERE jobname = 's10_drain_every_minute'), false)
          );
          ROLLBACK;
          EOSQL
          else
            echo "::notice::cron schema does not exist"
            echo '{"cron_schema_exists": false}' | jq .
          fi

          echo ""
          echo "=== Vault Secrets ==="
          echo ""

          VAULT_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT EXISTS(SELECT 1 FROM information_schema.schemata WHERE schema_name = 'vault');
          ROLLBACK;
          EOSQL
          )

          if [ "$VAULT_EXISTS" = "t" ]; then
            echo "Vault secrets existence (names only):"
            psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_build_object(
            'vault_schema_exists', true,
            'jobs_drain_secret_exists', EXISTS(SELECT 1 FROM vault.secrets WHERE name = 'jobs_drain_secret'),
            'jobs_drain_url_exists', EXISTS(SELECT 1 FROM vault.secrets WHERE name = 'jobs_drain_url')
          );
          ROLLBACK;
          EOSQL
          else
            echo "::notice::vault schema does not exist"
            echo '{"vault_schema_exists": false}' | jq .
          fi

          echo ""
          echo "=== pgmq Queues ==="
          echo ""

          PGMQ_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pgmq');
          ROLLBACK;
          EOSQL
          )

          if [ "$PGMQ_EXISTS" = "t" ]; then
            psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT queue_name FROM pgmq.list_queues() ORDER BY queue_name;
          ROLLBACK;
          EOSQL

            echo ""
            psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_build_object(
            's6_sync_queue_exists', EXISTS(SELECT 1 FROM pgmq.list_queues() WHERE queue_name = 's6_sync'),
            's6_bulk_queue_exists', EXISTS(SELECT 1 FROM pgmq.list_queues() WHERE queue_name = 's6_bulk'),
            's6_dead_letter_table_exists', (to_regclass('public.s6_dead_letter') IS NOT NULL)
          );
          ROLLBACK;
          EOSQL
          else
            echo "::notice::pgmq extension is not installed"
            echo '{"pgmq_installed": false}' | jq .
          fi

      - name: Queue and webhook counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          SHOP_DOMAIN: ${{ inputs.shop }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Queue and Webhook Counts (last 24h) ==="
          echo ""

          PGMQ_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pgmq');
          ROLLBACK;
          EOSQL
          )

          if [ "$PGMQ_EXISTS" = "t" ]; then
            echo "--- pgmq Queue Metrics ---"
            psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT queue_name, queue_length AS pending, total_messages AS total_ever, oldest_msg_age_sec
          FROM pgmq.metrics_all()
          ORDER BY queue_name;
          ROLLBACK;
          EOSQL
          fi

          echo ""
          echo "--- Webhook Receipts (last 24h by topic) ---"

          RECEIPTS_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT to_regclass('public.webhook_receipts') IS NOT NULL;
          ROLLBACK;
          EOSQL
          )

          if [ "$RECEIPTS_EXISTS" = "t" ]; then
            psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT topic, COUNT(*) AS count_24h
          FROM webhook_receipts
          WHERE received_at > NOW() - INTERVAL '24 hours'
          GROUP BY topic
          ORDER BY count_24h DESC;
          ROLLBACK;
          EOSQL
          fi

          echo ""
          echo "--- Processed Webhooks (last 24h by topic) ---"

          PROCESSED_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT to_regclass('public.s6_processed_webhooks') IS NOT NULL;
          ROLLBACK;
          EOSQL
          )

          if [ "$PROCESSED_EXISTS" = "t" ]; then
            psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT topic, COUNT(*) AS count_24h
          FROM s6_processed_webhooks
          WHERE processed_at > NOW() - INTERVAL '24 hours'
          GROUP BY topic
          ORDER BY count_24h DESC;
          ROLLBACK;
          EOSQL
          fi

          echo ""
          echo "--- Dead Letter Queue (DLQ) Summary ---"

          DLQ_EXISTS=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT to_regclass('public.s6_dead_letter') IS NOT NULL;
          ROLLBACK;
          EOSQL
          )

          if [ "$DLQ_EXISTS" = "t" ]; then
            psql -X -q -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT json_build_object(
            'total', (SELECT COUNT(*) FROM s6_dead_letter),
            'by_queue', (SELECT json_object_agg(original_queue, cnt) FROM (SELECT original_queue, COUNT(*) AS cnt FROM s6_dead_letter GROUP BY original_queue) sub),
            'by_topic', (SELECT json_object_agg(topic, cnt) FROM (SELECT message->>'topic' AS topic, COUNT(*) AS cnt FROM s6_dead_letter GROUP BY message->>'topic') sub)
          );
          ROLLBACK;
          EOSQL
          fi

          echo ""
          echo "--- Entity Counts by Shop ---"

          psql -X -q -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT s.domain AS shop,
            (SELECT COUNT(*) FROM "Invoice" i WHERE i."shopId" = s.id) AS invoice_count,
            (SELECT COUNT(*) FROM "BuyerAccount" ba WHERE ba."shopId" = s.id) AS buyer_account_count
          FROM "Shop" s
          WHERE s."uninstalledAt" IS NULL
          ORDER BY s.domain;
          ROLLBACK;
          EOSQL

      - name: DLQ Redrive
        if: ${{ inputs.redrive_dlq }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SESSION }}
          REDRIVE_TOPIC: ${{ inputs.redrive_topic }}
          REDRIVE_LIMIT: ${{ inputs.redrive_limit }}
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_SESSION secret not set (required for DLQ redrive)"
            exit 1
          fi

          if [ -z "$REDRIVE_TOPIC" ]; then
            echo "::error::redrive_topic is required when redrive_dlq=true"
            exit 1
          fi

          if ! [[ "$REDRIVE_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::redrive_limit must be a positive integer"
            exit 1
          fi

          echo "=== DLQ Redrive ==="
          echo "Topic: $REDRIVE_TOPIC"
          echo "Limit: $REDRIVE_LIMIT"

          # Note: redrive is a WRITE operation, no BEGIN READ ONLY here
          MATCH_COUNT=$(psql -X -q -v ON_ERROR_STOP=1 -v topic="$REDRIVE_TOPIC" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT COUNT(*) FROM s6_dead_letter WHERE message->>'topic' = :'topic';
          EOSQL
          )

          echo "Messages matching topic '$REDRIVE_TOPIC': $MATCH_COUNT"

          if [ "$MATCH_COUNT" = "0" ]; then
            echo "No messages to redrive."
            exit 0
          fi

          REDRIVE_RESULT=$(psql -X -q -v ON_ERROR_STOP=1 -v topic="$REDRIVE_TOPIC" -v lim="$REDRIVE_LIMIT" -t -A "$DATABASE_URL" <<'EOSQL'
          WITH to_redrive AS (
            SELECT id, original_queue, message FROM s6_dead_letter
            WHERE message->>'topic' = :'topic' ORDER BY dead_lettered_at ASC LIMIT :lim
          ),
          requeued AS (
            SELECT tr.id, tr.original_queue, pgmq.send(tr.original_queue, tr.message) AS new_msg_id FROM to_redrive tr
          ),
          deleted AS (
            DELETE FROM s6_dead_letter WHERE id IN (SELECT id FROM requeued) RETURNING id
          )
          SELECT json_build_object('redriven_count', (SELECT COUNT(*) FROM deleted), 'sample_queues', (SELECT array_agg(DISTINCT original_queue) FROM requeued));
          EOSQL
          )

          echo "Redrive result:"
          echo "$REDRIVE_RESULT" | jq .

