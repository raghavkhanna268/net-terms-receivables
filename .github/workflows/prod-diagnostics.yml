            'tag_rule_count', (SELECT COUNT(*) FROM "AccountSource" WHERE "shopId" = :'shop_id')
          );
          ROLLBACK;
          EOSQL

      - name: S12 Validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          DATABASE_URL_SESSION: ${{ secrets.DATABASE_URL_SESSION }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SHOP_DOMAIN: ${{ inputs.shop }}
          ENSURE_VALIDATION: ${{ inputs.ensure_validation }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          echo "=== S12 Validation ==="

          if [ -n "${SHOPIFY_API_KEY:-}" ]; then echo "::add-mask::$SHOPIFY_API_KEY"; fi
          if [ -n "${SHOPIFY_API_SECRET:-}" ]; then echo "::add-mask::$SHOPIFY_API_SECRET"; fi

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          INPUT_QUERY_FILE="extensions/credit-check-validation/src/cart_validations_generate_run.graphql"
          REPO_INPUT_QUERY_HAS_CREDIT_STATUS=false
          if [ -f "$INPUT_QUERY_FILE" ]; then
            # Check for metafield with namespace: "$app" and key: "credit_status" in either order
            if grep -qE 'metafield\s*\(\s*(namespace:\s*"\$app"\s*,\s*key:\s*"credit_status"|key:\s*"credit_status"\s*,\s*namespace:\s*"\$app")' "$INPUT_QUERY_FILE"; then
              REPO_INPUT_QUERY_HAS_CREDIT_STATUS=true
            fi
          fi
          echo "repo_input_query_has_credit_status: $REPO_INPUT_QUERY_HAS_CREDIT_STATUS"

          SESSION_DATA=$(psql -X -q -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A -F '|' "$DATABASE_URL" <<'EOSQL'
          BEGIN READ ONLY;
          SELECT "accessToken", expires AT TIME ZONE 'UTC', CASE WHEN "refreshToken" IS NOT NULL AND "refreshToken" != '' THEN 'true' ELSE 'false' END
          FROM "Session" WHERE shop = :'shop' AND "isOnline" = false LIMIT 1;
          ROLLBACK;
          EOSQL
          )

          if [ -z "$SESSION_DATA" ]; then
            echo "::warning::No offline session found"
            echo '{"offline_session_exists": false}' | jq .
            exit 0
          fi

          ACCESS_TOKEN=$(echo "$SESSION_DATA" | cut -d'|' -f1)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::No access token"
            exit 0
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          CURL_CONFIG=$(mktemp)
          HTTP_RESPONSE=$(mktemp)
          cleanup() { rm -f "$CURL_CONFIG" "$HTTP_RESPONSE"; }
          trap cleanup EXIT

          chmod 600 "$CURL_CONFIG"
          cat > "$CURL_CONFIG" <<EOF
          header = "Content-Type: application/json"
          header = "X-Shopify-Access-Token: $ACCESS_TOKEN"
          EOF

          QUERY='{"query":"{ validations(first:50) { nodes { id title enabled blockOnFailure shopifyFunction { handle inputQuery } } } }"}'

          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" -X POST --config "$CURL_CONFIG" --data-binary "$QUERY" "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Validations query failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          VALIDATION_NODE=$(jq -r '.data.validations.nodes[] | select(.shopifyFunction.handle == "credit-check-validation")' "$HTTP_RESPONSE")

          VALIDATION_EXISTS=false
          VALIDATION_ENABLED=false
          DEPLOYED_INPUT_QUERY_HAS_CREDIT_STATUS=false

          if [ -n "$VALIDATION_NODE" ] && [ "$VALIDATION_NODE" != "null" ]; then
            VALIDATION_EXISTS=true
            VALIDATION_ENABLED=$(echo "$VALIDATION_NODE" | jq -r '.enabled')
            INPUT_QUERY=$(echo "$VALIDATION_NODE" | jq -r '.shopifyFunction.inputQuery // ""')
            # Match namespace and key in either order
            MATCH_RESULT=$(node -e '
              const query = process.argv[1];
              const p1 = /metafield\s*\(\s*namespace\s*:\s*"\$app"\s*,\s*key\s*:\s*"credit_status"\s*\)/s;
              const p2 = /metafield\s*\(\s*key\s*:\s*"credit_status"\s*,\s*namespace\s*:\s*"\$app"\s*\)/s;
              const match = query.match(p1) || query.match(p2);
              console.log(match ? "true" : "false");
            ' "$INPUT_QUERY" 2>/dev/null || echo "false")
            if [ "$MATCH_RESULT" = "true" ]; then
              DEPLOYED_INPUT_QUERY_HAS_CREDIT_STATUS=true
            fi
          fi

          echo "S12 Validation status:"
          jq -n --argjson exists "$VALIDATION_EXISTS" --argjson enabled "$VALIDATION_ENABLED" --argjson repo "$REPO_INPUT_QUERY_HAS_CREDIT_STATUS" --argjson deployed "$DEPLOYED_INPUT_QUERY_HAS_CREDIT_STATUS" '{exists: $exists, enabled: $enabled, repo_input_query_has_credit_status: $repo, deployed_input_query_has_credit_status: $deployed}'

          if [ "$ENSURE_VALIDATION" = "true" ] && [ "$VALIDATION_EXISTS" = "false" ]; then
            echo "Creating validation..."
            # Note: this is a WRITE operation
            CREATE_MUTATION='{"query":"mutation { validationCreate(validation: { functionHandle: \"credit-check-validation\", title: \"Net Terms Credit Check\", enable: true, blockOnFailure: false }) { validation { id enabled } userErrors { field message } } }"}'
            curl -s -o "$HTTP_RESPONSE" -X POST --config "$CURL_CONFIG" --data-binary "$CREATE_MUTATION" "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json"
            echo "Validation created"
          fi

      - name: Reconcile probe
        if: ${{ inputs.invoke_reconcile }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Reconcile Probe ==="
          echo "Invoking public.s10b_call_reconcile()..."

          # Note: reconcile is a WRITE operation
          REQUEST_ID_OUTPUT=$(psql -X -q -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT public.s10b_call_reconcile();
          SELECT currval(pg_get_serial_sequence('net.http_request_queue', 'id'));
          EOSQL
          ) || {
            echo "::error::s10b_call_reconcile failed"
            exit 1
          }

          REQUEST_ID=$(echo "$REQUEST_ID_OUTPUT" | tail -n1)

          if [ -z "$REQUEST_ID" ] || ! [[ "$REQUEST_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to get request_id"
            exit 1
          fi

          echo "request_id: $REQUEST_ID"
          echo "Polling for HTTP response (up to 75s)..."

          POLL_END=$(($(date +%s) + 75))
          FOUND_ROW=""

          while [ "$(date +%s)" -lt "$POLL_END" ]; do
            FOUND_ROW=$(psql -X -q -v ON_ERROR_STOP=1 -v req_id="$REQUEST_ID" -t -A -F '|' "$DATABASE_URL" <<'EOSQL'
          SELECT id, COALESCE(status_code::text, 'null'), CASE WHEN timed_out THEN 'true' ELSE 'false' END
          FROM net._http_response WHERE id = :req_id;
          EOSQL
            )
            if [ -n "$FOUND_ROW" ]; then break; fi
            sleep 3
          done

          if [ -z "$FOUND_ROW" ]; then
            echo "::error::No HTTP response within 75 seconds"
            exit 1
          fi

          STATUS_CODE=$(echo "$FOUND_ROW" | cut -d'|' -f2)
          echo "Reconcile completed with status: $STATUS_CODE"

          if [ "$STATUS_CODE" = "null" ] || [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
            echo "::error::Reconcile failed with status $STATUS_CODE"
            exit 1
          fi
