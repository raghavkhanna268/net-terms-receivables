# Production diagnostics workflow with optional token refresh
#
# Checks OAuth session state, protected customer data access, and database
# extensions/jobs for a shop.
# Used by ops to verify Shopify connectivity and infrastructure without modifying data.
#
# SAFETY:
#   - Manual trigger only (workflow_dispatch)
#   - Runs only from main branch
#   - Read-only by default (PGOPTIONS enforced for session check)
#   - Token refresh requires explicit opt-in via refresh_if_expired input
#   - No artifacts uploaded
#   - Access token is masked in logs and kept off argv
#   - No customer PII is printed
#   - Never prints cron.job.command (may contain URLs/secrets)
#   - Never selects vault.decrypted_secrets (only checks name existence)
#
# Required secrets:
#   DATABASE_URL_MIGRATIONS - Supabase SESSION pooler connection string
#
# For token refresh (optional):
#   DATABASE_URL_SESSION    - Supabase SESSION pooler for token refresh (write access)
#   SHOPIFY_API_KEY         - App's API key (client_id) for token refresh
#   SHOPIFY_API_SECRET      - App's API secret (client_secret) for token refresh
#
# Optional:
#   Configure a GitHub Environment named "production" to require approval
#   before running diagnostics against prod.

name: Prod Diagnostics

on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Shopify shop domain (e.g., example.myshopify.com). Leave empty to use the single installed shop from the DB (never printed)"
        required: false
        default: ""
        type: string
      fail_on_expired:
        description: "Fail if offline token has expired (strict mode)"
        required: false
        default: false
        type: boolean
      refresh_if_expired:
        description: "Attempt to refresh expired token before probe"
        required: false
        default: false
        type: boolean
      invoke_reconcile:
        description: "NOT read-only: runs a real prod reconcile enqueue for all installed shops"
        required: false
        default: false
        type: boolean
      ensure_validation:
        description: "NOT read-only: creates/enables the credit-check-validation on the shop if missing or disabled"
        required: false
        default: false
        type: boolean
      redrive_dlq:
        description: "NOT read-only: redrive dead-letter queue messages back to original queues"
        required: false
        default: false
        type: boolean
      redrive_topic:
        description: "Topic filter for DLQ redrive (required when redrive_dlq=true, e.g. ORDERS_UPDATED)"
        required: false
        type: string
      redrive_limit:
        description: "Maximum messages to redrive (default: 100)"
        required: false
        default: "100"
        type: string
      post_redrive_verify:
        description: "Run post-redrive verification SQL script (read-only)"
        required: false
        default: false
        type: boolean
      redrive_started_at:
        description: "UTC timestamp when redrive started (for post_redrive_verify, e.g. 2026-10-24T10:00:00Z)"
        required: false
        type: string
      checkout_fixtures:
        description: "Read-only: S12 checkout fixtures (seed BuyerAccount ids/enums/booleans + $app:credit_status values + active validation function ids)"
        required: false
        default: false
        type: boolean
      e2e_second_shop:
        description: "Read-only: second-shop E2E mode (install/uninstall/reinstall test). Runs ONLY the e2e_second_shop job; shop comes from the E2E_SHOP secret or the single non-allowed Shop row (never an input, never printed)"
        required: false
        default: false
        type: boolean
      drain_cron:
        description: "NOT read-only unless none: pause/resume ONLY the s10_drain_every_minute pg_cron job (cron.alter_job active=false/true)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - pause
          - resume

permissions:
  contents: read

jobs:
  diagnostics:
    name: Run Production Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Uncomment to require approval via GitHub Environment:
    # environment: production

    # Skipped in e2e_second_shop mode: that mode runs only the e2e_second_shop
    # job below, which never touches the allowed dev store.
    if: github.ref == 'refs/heads/main' && !inputs.e2e_second_shop

    steps:
      # Checkout runs first so every psql step can source
      # scripts/ci/psql-redacted.sh (DB host redaction, #190 F2). It never sees
      # the shop domain, and `inputs.shop` is not referenced by it.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Must stay the FIRST step that touches the shop (only Checkout may run
      # before it). The shop domain must never appear in the
      # public log: not in a step `env:` header (Actions prints those) and
      # not via an inputs.shop expression inside `run:` (the "Run" header
      # shows the expanded script). So it is read from the event payload file,
      # masked, and only then exported via GITHUB_ENV. Later steps see
      # SHOP_DOMAIN in their env header as ***.
      #
      # If the shop input is empty, the shop is resolved from the DB, read-only:
      #   - exactly 1 installed shop ("Shop"."uninstalledAt" IS NULL): that shop
      #   - more than 1 installed (e.g. during the second-shop E2E test): the
      #     shop equal to the ALLOWED_DEV_STORE secret, which must be installed
      #   - otherwise fail closed with a fixed shop_select=error code=<CODE>
      # Only counts and fixed codes are printed, never a domain.
      - name: Mask shop input
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          # Secret, so the env header prints *** (#190 F1).
          ALLOWED_DEV_STORE: ${{ secrets.ALLOWED_DEV_STORE }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          SHOP=$(jq -r '.inputs.shop // empty' "$GITHUB_EVENT_PATH")
          # Default shop selection (domain never printed)
          if [ -z "$SHOP" ]; then
            echo "shop input empty: resolving the shop from the DB (domain not printed)"
            if [ -z "$DATABASE_URL" ]; then
              echo "::error::DATABASE_URL_MIGRATIONS secret not set (needed to resolve shop)"
              exit 1
            fi
            INSTALLED=$(psql -X -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" \
              -c 'SELECT COUNT(*) FROM "Shop" WHERE "uninstalledAt" IS NULL;')
            if [[ ! "$INSTALLED" =~ ^[0-9]+$ ]]; then
              echo "shop_select=error code=SHOP_COUNT_INVALID"
              echo "::error::Installed shop count was not an integer"
              exit 1
            fi
            echo "installed_shop_count=$INSTALLED"
            if [ "$INSTALLED" = "0" ]; then
              echo "shop_select=error code=NO_INSTALLED_SHOP"
              echo "::error::No installed shop found. Pass the shop input explicitly."
              exit 1
            elif [ "$INSTALLED" = "1" ]; then
              SHOP=$(psql -X -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" \
                -c 'SELECT domain FROM "Shop" WHERE "uninstalledAt" IS NULL;')
              echo "shop_source=db_single_installed"
            else
              # More than 1 installed: select the allowed dev store, never the
              # other shop(s). Fail closed if it is unset or not installed.
              if [ -z "${ALLOWED_DEV_STORE:-}" ]; then
                echo "shop_select=error code=ALLOWED_DEV_STORE_UNSET"
                echo "::error::More than 1 installed shop and ALLOWED_DEV_STORE is not set. Pass the shop input explicitly."
                exit 1
              fi
              if [[ ! "$ALLOWED_DEV_STORE" =~ ^[a-z0-9-]+\.myshopify\.com$ ]]; then
                echo "shop_select=error code=ALLOWED_DEV_STORE_INVALID"
                echo "::error::ALLOWED_DEV_STORE has an invalid format"
                exit 1
              fi
              echo "::add-mask::$ALLOWED_DEV_STORE"
              MATCH=$(psql -X -v ON_ERROR_STOP=1 -t -A -v allowed="$ALLOWED_DEV_STORE" "$DATABASE_URL" \
                <<< "SELECT COUNT(*) FROM \"Shop\" WHERE \"uninstalledAt\" IS NULL AND domain = :'allowed';")
              if [ "$MATCH" != "1" ]; then
                echo "shop_select=error code=ALLOWED_DEV_STORE_NOT_INSTALLED"
                echo "::error::More than 1 installed shop and ALLOWED_DEV_STORE matches no installed shop. Pass the shop input explicitly."
                exit 1
              fi
              SHOP="$ALLOWED_DEV_STORE"
              echo "shop_source=db_allowed_dev_store"
            fi
          else
            echo "shop_source=input"
          fi
          # End default shop selection
          # Validate before masking (never printed) so a multi-line value
          # cannot slip partly past ::add-mask::.
          if [[ ! "$SHOP" =~ ^[a-z0-9-]+\.myshopify\.com$ ]]; then
            echo "::error::Invalid shop domain format. Expected: example.myshopify.com"
            exit 1
          fi
          echo "::add-mask::$SHOP"
          echo "SHOP_DOMAIN=$SHOP" >> "$GITHUB_ENV"

      # Public counts/booleans only:
      #   installed_shop_count=<int>
      #   installed_shop_is_allowed_dev_store=<true|false|unknown>: true iff the
      #     SELECTED shop (SHOP_DOMAIN) equals the ALLOWED_DEV_STORE secret and
      #     is installed
      #   allowed_shop_buyer_accounts=<int|unknown>, allowed_shop_invoices=<int|unknown>:
      #     existing-store guard counts (show the E2E test didn't change them)
      # Comparisons run inside SQL via psql variables; no domain is printed.
      - name: Installed shop vs allowed dev store
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          # Secret, so the env header prints *** (#190 F1).
          ALLOWED_DEV_STORE: ${{ secrets.ALLOWED_DEV_STORE }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          # Allowed dev store summary (counts/booleans only)
          INSTALLED=$(psql -X -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" \
            -c 'SELECT COUNT(*) FROM "Shop" WHERE "uninstalledAt" IS NULL;')
          [[ "$INSTALLED" =~ ^[0-9]+$ ]] || INSTALLED=unknown
          echo "installed_shop_count=$INSTALLED"
          if [ -z "${ALLOWED_DEV_STORE:-}" ]; then
            echo "installed_shop_is_allowed_dev_store=unknown"
            echo "allowed_shop_buyer_accounts=unknown"
            echo "allowed_shop_invoices=unknown"
            exit 0
          fi
          # Validate before masking (never printed), as in seed-dev-store.yml.
          if [[ ! "$ALLOWED_DEV_STORE" =~ ^[a-z0-9-]+\.myshopify\.com$ ]]; then
            echo "installed_shop_is_allowed_dev_store=false"
            echo "allowed_shop_buyer_accounts=unknown"
            echo "allowed_shop_invoices=unknown"
            exit 0
          fi
          echo "::add-mask::$ALLOWED_DEV_STORE"
          RESULT=$(psql -X -v ON_ERROR_STOP=1 -t -A -v allowed="$ALLOWED_DEV_STORE" -v shop="$SHOP_DOMAIN" "$DATABASE_URL" <<'EOSQL'
          SELECT CASE WHEN :'shop' = :'allowed'
                       AND EXISTS (SELECT 1 FROM "Shop" WHERE domain = :'shop' AND "uninstalledAt" IS NULL)
                      THEN 'true' ELSE 'false' END;
          EOSQL
          )
          if [ "$RESULT" != "true" ]; then
            RESULT=false
          fi
          echo "installed_shop_is_allowed_dev_store=$RESULT"
          GUARD=$(psql -X -v ON_ERROR_STOP=1 -t -A -F '|' -v allowed="$ALLOWED_DEV_STORE" "$DATABASE_URL" <<'EOSQL'
          SELECT
            (SELECT COUNT(*) FROM "BuyerAccount" ba JOIN "Shop" s ON s.id = ba."shopId" WHERE s.domain = :'allowed'),
            (SELECT COUNT(*) FROM "Invoice" i JOIN "Shop" s ON s.id = i."shopId" WHERE s.domain = :'allowed');
          EOSQL
          )
          BA=$(echo "$GUARD" | cut -d'|' -f1)
          INV=$(echo "$GUARD" | cut -d'|' -f2)
          [[ "$BA" =~ ^[0-9]+$ ]] || BA=unknown
          [[ "$INV" =~ ^[0-9]+$ ]] || INV=unknown
          echo "allowed_shop_buyer_accounts=$BA"
          echo "allowed_shop_invoices=$INV"
          # End allowed dev store summary

      - name: Validate inputs
        env:
          REDRIVE_STARTED_AT: ${{ inputs.redrive_started_at }}
        run: |
          set -euo pipefail

          # Validate redrive_started_at if provided: strict ISO-8601 UTC format
          # Accepts: YYYY-MM-DDTHH:MMZ or YYYY-MM-DDTHH:MM:SSZ (seconds optional)
          if [[ -n "${REDRIVE_STARTED_AT:-}" ]]; then
            if [[ ! "$REDRIVE_STARTED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z$ ]]; then
              echo "::error::Invalid redrive_started_at format. Expected ISO-8601 UTC: YYYY-MM-DDTHH:MM:SSZ or YYYY-MM-DDTHH:MMZ"
              exit 1
            fi
          fi

      - name: Session check
        id: session
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "Querying Session table for the input shop (domain not printed)"
          echo ""

          psql -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" "$DATABASE_URL" <<'EOSQL'
          SELECT
            "isOnline",
            scope,
            CASE WHEN "accessToken" IS NOT NULL AND "accessToken" != '' THEN true ELSE false END AS "hasAccessToken",
            expires
          FROM "Session"
          WHERE shop = :'shop';
          EOSQL

          echo ""
          echo "--- Offline Session Token Status ---"

          # Fetch offline session expiry and refresh token presence
          OFFLINE_DATA=$(psql -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A -F '|' "$DATABASE_URL" <<'EOSQL'
          SELECT
            expires AT TIME ZONE 'UTC',
            CASE WHEN "refreshToken" IS NOT NULL AND "refreshToken" != '' THEN 'true' ELSE 'false' END
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          EOSQL
          )

          if [ -z "$OFFLINE_DATA" ]; then
            echo "No offline session found"
            {
              echo "token_expired=unknown"
              echo "has_refresh_token=false"
              echo "offline_session_exists=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXPIRES_RAW=$(echo "$OFFLINE_DATA" | cut -d'|' -f1)
          HAS_REFRESH=$(echo "$OFFLINE_DATA" | cut -d'|' -f2)

          echo "has_refresh_token: $HAS_REFRESH"

          if [ -z "$EXPIRES_RAW" ] || [ "$EXPIRES_RAW" = "" ]; then
            echo "token_expired: false (no expiry set - legacy non-expiring token)"
            {
              echo "has_refresh_token=$HAS_REFRESH"
              echo "offline_session_exists=true"
              echo "token_expired=false"
            } >> "$GITHUB_OUTPUT"
          else
            # Compare expiry to current UTC time (expires is already in UTC from query)
            EXPIRES_EPOCH=$(date -u -d "$EXPIRES_RAW" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date -u +%s)
            if [ "$EXPIRES_EPOCH" -le "$NOW_EPOCH" ]; then
              echo "token_expired: true (expired at ${EXPIRES_RAW} UTC)"
              {
                echo "has_refresh_token=$HAS_REFRESH"
                echo "offline_session_exists=true"
                echo "token_expired=true"
              } >> "$GITHUB_OUTPUT"
            else
              echo "token_expired: false (expires at ${EXPIRES_RAW} UTC)"
              {
                echo "has_refresh_token=$HAS_REFRESH"
                echo "offline_session_exists=true"
                echo "token_expired=false"
              } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Post-redrive verification (read-only)
        if: ${{ inputs.post_redrive_verify }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          REDRIVE_STARTED_AT: ${{ inputs.redrive_started_at }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          # Install psql client if not available
          if ! command -v psql &> /dev/null; then
            echo "Installing PostgreSQL client..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          echo "=== Post-Redrive Verification ==="
          echo ""
          echo "Shop: (input shop; domain not printed)"
          echo "Read-only mode: enforced via PGOPTIONS and BEGIN TRANSACTION READ ONLY"
          echo ""

          # Build psql args as a bash array (no eval, no shell injection)
          PSQL_ARGS=(-v ON_ERROR_STOP=1 -v "shop=${SHOP_DOMAIN}")

          if [[ -n "${REDRIVE_STARTED_AT:-}" ]]; then
            echo "Redrive started at: $REDRIVE_STARTED_AT"
            PSQL_ARGS+=(-v "redrive_started_at=${REDRIVE_STARTED_AT}")
          else
            echo "Redrive started at: (defaulting to now - 24h)"
          fi
          echo ""

          # Run the verification script
          # The script uses BEGIN TRANSACTION READ ONLY and ROLLBACK, and only outputs
          # counts, booleans, and enum labels - no customer PII.
          # -X: ignore .psqlrc, -q: suppress command tags (BEGIN/ROLLBACK) from stdout
          psql -X -q "${PSQL_ARGS[@]}" -f scripts/post-redrive-verify.sql "$DATABASE_URL"

          echo ""
          echo "::notice::Post-redrive verification completed"

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Refresh expired token
        id: refresh
        if: ${{ inputs.refresh_if_expired && steps.session.outputs.token_expired == 'true' && steps.session.outputs.has_refresh_token == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SESSION }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
        run: |
          set -euo pipefail

          # Mask secrets immediately
          if [ -n "$SHOPIFY_API_KEY" ]; then echo "::add-mask::$SHOPIFY_API_KEY"; fi
          if [ -n "$SHOPIFY_API_SECRET" ]; then echo "::add-mask::$SHOPIFY_API_SECRET"; fi

          # Check required secrets
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_SESSION secret not set (required for token refresh)"
            echo "refresh_success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SHOPIFY_API_KEY" ] || [ -z "$SHOPIFY_API_SECRET" ]; then
            echo "::error::SHOPIFY_API_KEY or SHOPIFY_API_SECRET secret not set (required for token refresh)"
            echo "refresh_success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Attempting to refresh expired token for the input shop"
          echo ""

          # Run the refresh script (never outputs tokens - probe re-reads from DB)
          # Capture stdout separately so stderr doesn't break jq parsing
          if ! REFRESH_RESULT=$(npx tsx scripts/lib/refresh-offline-token.ts \
            --shop "$SHOP_DOMAIN" \
            --threshold-minutes 0); then
            # Script failed - try to parse output anyway
            true
          fi

          # Guard against non-JSON output breaking jq
          if ! echo "$REFRESH_RESULT" | jq -e . >/dev/null 2>&1; then
            echo "::warning::Refresh script returned non-JSON output"
            {
              echo "refresh_success=false"
              echo "refresh_error_code=script_error"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Parse result - script outputs only {success, wasRefreshed, expires, errorCode, error}
          # Guard each jq call so non-JSON or jq errors set refresh_success=false
          REFRESH_SUCCESS=$(echo "$REFRESH_RESULT" | jq -r '.success // false' 2>/dev/null || echo false)
          REFRESH_ERROR_CODE=$(echo "$REFRESH_RESULT" | jq -r '.errorCode // ""' 2>/dev/null || echo "")
          WAS_REFRESHED=$(echo "$REFRESH_RESULT" | jq -r '.wasRefreshed // false' 2>/dev/null || echo false)

          if [ "$REFRESH_SUCCESS" = "true" ]; then
            echo "::notice::Token refresh successful (wasRefreshed: $WAS_REFRESHED)"
            {
              echo "refresh_success=true"
              echo "was_refreshed=$WAS_REFRESHED"
            } >> "$GITHUB_OUTPUT"
            # Record in summary when refresh_if_expired was used
            echo "refresh_token_used=true" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Token refresh failed: $REFRESH_ERROR_CODE"
            {
              echo "refresh_success=false"
              echo "refresh_error_code=$REFRESH_ERROR_CODE"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Protected customer data probe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          TOKEN_EXPIRED: ${{ steps.session.outputs.token_expired }}
          OFFLINE_SESSION_EXISTS: ${{ steps.session.outputs.offline_session_exists }}
          FAIL_ON_EXPIRED: ${{ inputs.fail_on_expired }}
          REFRESH_REQUESTED: ${{ inputs.refresh_if_expired }}
          REFRESH_SUCCESS: ${{ steps.refresh.outputs.refresh_success }}
          HAS_REFRESH_TOKEN: ${{ steps.session.outputs.has_refresh_token }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          # Temp files for cleanup
          CURL_CONFIG=""
          HTTP_RESPONSE=""
          cleanup() {
            rm -f "$CURL_CONFIG" "$HTTP_RESPONSE"
          }
          trap cleanup EXIT

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          # Check if offline session exists
          if [ "$OFFLINE_SESSION_EXISTS" != "true" ]; then
            echo "::error::No offline session found for the input shop"
            exit 1
          fi

          # Check if token is expired and refresh was not successful
          if [ "$TOKEN_EXPIRED" = "true" ] && [ "$REFRESH_SUCCESS" != "true" ]; then
            echo "::notice::Offline access token has expired."
            echo ""
            echo "The offline access token for this shop has expired."

            if [ "$REFRESH_REQUESTED" = "true" ]; then
              if [ "$HAS_REFRESH_TOKEN" != "true" ]; then
                echo "Token refresh was requested but no refresh token is available."
                echo "The shop needs to re-authenticate with the app."
              else
                echo "Token refresh was attempted but failed."
                echo "See the 'Refresh expired token' step for details."
              fi
            else
              echo "To renew it, either:"
              echo "  1. Open the app in the Shopify admin (triggers automatic token refresh)"
              echo "  2. Re-run this workflow with 'refresh_if_expired' enabled"
            fi
            echo ""
            echo "Skipping Admin API probe (token expired)."
            echo ""
            echo "Protected Customer Data Probe Results:"
            echo '{"status": "skipped", "reason": "token_expired"}' | jq .

            if [ "$FAIL_ON_EXPIRED" = "true" ]; then
              echo "::error::Token expired and fail_on_expired=true"
              exit 1
            fi
            exit 0
          fi

          # Fetch offline access token into variable (never print it)
          ACCESS_TOKEN=$(psql -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT "accessToken"
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          EOSQL
          )

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::No offline session found for the input shop"
            exit 1
          fi

          # Mask the token immediately before any use
          echo "::add-mask::$ACCESS_TOKEN"

          echo "Probing Admin GraphQL API for protected customer data access..."
          echo ""

          # Build GraphQL query
          QUERY='{"query":"{ customers(first:1) { nodes { id email firstName lastName } } }"}'

          # Create curl config file with token (keeps token off argv)
          CURL_CONFIG=$(mktemp)
          chmod 600 "$CURL_CONFIG"
          cat > "$CURL_CONFIG" <<EOF
          header = "Content-Type: application/json"
          header = "X-Shopify-Access-Token: $ACCESS_TOKEN"
          EOF

          # Call Admin GraphQL API using config file for headers
          HTTP_RESPONSE=$(mktemp)
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
            -X POST \
            --config "$CURL_CONFIG" \
            --data-binary "$QUERY" \
            "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json")

          # Parse response and output only boolean indicators
          echo "HTTP Status: $HTTP_STATUS"
          echo ""

          # Handle auth failures gracefully (401/403)
          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ]; then
            echo "::warning::Admin API returned HTTP $HTTP_STATUS (authentication/authorization failed)"
            echo ""
            # Extract only error codes, never messages or raw content
            ERROR_CODES=$(jq -r '
              if .errors then
                {error_codes: [.errors[] | .extensions.code // "UNKNOWN"]}
              else
                {error_code: "unknown"}
              end
            ' "$HTTP_RESPONSE" 2>/dev/null || echo '{"error_code": "parse_failed"}')

            echo "Protected Customer Data Probe Results:"
            echo "{\"status\": \"auth_failed\", \"http_status\": $HTTP_STATUS, \"details\": $ERROR_CODES}" | jq .
            exit 0
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            # Extract indicators without exposing PII
            RESULT=$(jq -r '
              if .errors then
                {
                  status: "error",
                  graphql_error_codes: [.errors[] | .extensions.code // "UNKNOWN"]
                }
              else
                {
                  status: "success",
                  customer_found: ((.data.customers.nodes | length) > 0),
                  email_non_null: ((.data.customers.nodes[0].email // null) != null),
                  email_not_redacted: (((.data.customers.nodes[0].email // "") | test("^[^@]+@[^@]+$")) // false),
                  first_name_non_null: ((.data.customers.nodes[0].firstName // null) != null),
                  last_name_non_null: ((.data.customers.nodes[0].lastName // null) != null)
                }
                | .pii_readable = (.customer_found and .email_non_null and .email_not_redacted)
              end
            ' "$HTTP_RESPONSE")
            # Public-repo safe: only booleans/status codes are printed, never values.
            echo "Protected Customer Data Probe Results:"
            echo "$RESULT" | jq '{status, pii_readable, customer_found, email_non_null, email_not_redacted, first_name_non_null, last_name_non_null, graphql_error_codes} | with_entries(select(.value != null))'
            echo "pii_readable=$(echo "$RESULT" | jq -r '.pii_readable // false')"
          else
            echo "::warning::GraphQL API request failed with HTTP $HTTP_STATUS"
            # Extract only error codes from response, never raw content
            ERROR_CODES=$(jq -r '
              if .errors then
                [.errors[] | .extensions.code // "UNKNOWN"]
              else
                ["UNKNOWN"]
              end
            ' "$HTTP_RESPONSE" 2>/dev/null || echo '["parse_failed"]')

            echo "Protected Customer Data Probe Results:"
            echo "{\"status\": \"error\", \"http_status\": $HTTP_STATUS, \"error_codes\": $ERROR_CODES}" | jq .
          fi

      - name: Active subscriptions probe
        id: active_subscriptions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          TOKEN_EXPIRED: ${{ steps.session.outputs.token_expired }}
          OFFLINE_SESSION_EXISTS: ${{ steps.session.outputs.offline_session_exists }}
          REFRESH_SUCCESS: ${{ steps.refresh.outputs.refresh_success }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          # Read-only: currentAppInstallation { activeSubscriptions { name status } }.
          # Public-repo safe: prints ONLY active_subscriptions_count=<int> and
          # any_subscription_has_plan_name=<true|false>. Never the names or statuses.
          # Soft-fails (warning + status line) so it can't break the run.
          echo "=== Active subscriptions (read-only) ==="

          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL_MIGRATIONS secret not set"
            echo "active_subscriptions=skipped_no_database_url"
            exit 0
          fi
          if [ "$OFFLINE_SESSION_EXISTS" != "true" ]; then
            echo "active_subscriptions=skipped_no_offline_session"
            exit 0
          fi
          # Default read-only mode never refreshes; skip when the token is expired.
          if [ "$TOKEN_EXPIRED" = "true" ] && [ "$REFRESH_SUCCESS" != "true" ]; then
            echo "active_subscriptions=skipped_token_expired"
            exit 0
          fi

          ACCESS_TOKEN=$(psql -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT "accessToken"
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          EOSQL
          )
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "active_subscriptions=skipped_no_access_token"
            exit 0
          fi
          echo "::add-mask::$ACCESS_TOKEN"

          CURL_CONFIG=""
          HTTP_RESPONSE=""
          cleanup() {
            rm -f "$CURL_CONFIG" "$HTTP_RESPONSE"
          }
          trap cleanup EXIT

          CURL_CONFIG=$(mktemp)
          chmod 600 "$CURL_CONFIG"
          cat > "$CURL_CONFIG" <<EOF
          header = "Content-Type: application/json"
          header = "X-Shopify-Access-Token: $ACCESS_TOKEN"
          EOF
          unset ACCESS_TOKEN

          # Active subscriptions query and summary (counts/booleans only)
          SUBS_QUERY='{"query":"{ currentAppInstallation { activeSubscriptions { name status } } }"}'
          HTTP_RESPONSE=$(mktemp)
          SUBS_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
            -X POST \
            --config "$CURL_CONFIG" \
            --data-binary "$SUBS_QUERY" \
            "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json" || echo "000")
          if [ "$SUBS_STATUS" != "200" ]; then
            echo "::warning::activeSubscriptions query failed with HTTP $SUBS_STATUS"
            echo "active_subscriptions=error http_status=$SUBS_STATUS"
          elif ! jq -e . "$HTTP_RESPONSE" >/dev/null 2>&1; then
            echo "::warning::activeSubscriptions response was not JSON"
            echo "active_subscriptions=error parse_failed"
          elif jq -e '(.errors | length) > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
            echo "::warning::activeSubscriptions query returned GraphQL errors"
            echo "active_subscriptions=error error_codes=$(jq -r '[.errors[] | .extensions.code // "UNKNOWN" | tostring | if test("^[A-Z0-9_]{1,40}$") then . else "UNKNOWN" end] | join(",")' "$HTTP_RESPONSE")"
          else
            jq -r '[.data.currentAppInstallation.activeSubscriptions[]?] as $subs
              | "active_subscriptions_count=\($subs | length)",
                "any_subscription_has_plan_name=\([$subs[] | .name | select(type == "string" and length > 0)] | length > 0)"' "$HTTP_RESPONSE"
          fi
          # End active subscriptions

      - name: Database extensions and jobs check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Database Extensions ==="
          echo ""

          # Check extensions: pgmq, pg_cron, pg_net, supabase_vault
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          SELECT
            e.extname AS extension,
            true AS installed,
            e.extversion AS version
          FROM pg_extension e
          WHERE e.extname IN ('pgmq', 'pg_cron', 'pg_net', 'supabase_vault')
          ORDER BY e.extname;
          EOSQL

          # Check which extensions are missing
          echo ""
          echo "Extensions status (boolean check):"
          psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            'pgmq_installed', EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pgmq'),
            'pg_cron_installed', EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pg_cron'),
            'pg_net_installed', EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pg_net'),
            'supabase_vault_installed', EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'supabase_vault')
          );
          EOSQL

          echo ""
          echo "=== Cron Jobs ==="
          echo ""

          # Check if cron schema exists before querying
          CRON_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT EXISTS(SELECT 1 FROM information_schema.schemata WHERE schema_name = 'cron');
          EOSQL
          )

          if [ "$CRON_EXISTS" = "t" ]; then
            # List cron jobs (jobname, schedule, active only - never command)
            echo "Cron jobs (command column omitted for security):"
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          SELECT
            jobid,
            jobname,
            schedule,
            active
          FROM cron.job
          ORDER BY jobname;
          EOSQL

            echo ""
            echo "S10 drain job status:"
            psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            's10_drain_job_exists', EXISTS(SELECT 1 FROM cron.job WHERE jobname = 's10_drain_every_minute'),
            's10_drain_job_active', COALESCE((SELECT active FROM cron.job WHERE jobname = 's10_drain_every_minute'), false)
          );
          EOSQL
          else
            echo "::notice::cron schema does not exist (pg_cron not installed or not configured)"
            echo '{"cron_schema_exists": false, "s10_drain_job_exists": false, "s10_drain_job_active": false}' | jq .
          fi

          echo ""
          echo "=== Vault Secrets ==="
          echo ""

          # Check if vault schema exists before querying
          VAULT_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT EXISTS(SELECT 1 FROM information_schema.schemata WHERE schema_name = 'vault');
          EOSQL
          )

          if [ "$VAULT_EXISTS" = "t" ]; then
            # Check if required secrets exist (query names only, never decrypted_secret)
            echo "Vault secrets existence check (names only, never values):"
            psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            'vault_schema_exists', true,
            'jobs_drain_secret_exists', EXISTS(SELECT 1 FROM vault.secrets WHERE name = 'jobs_drain_secret'),
            'jobs_drain_url_exists', EXISTS(SELECT 1 FROM vault.secrets WHERE name = 'jobs_drain_url')
          );
          EOSQL
          else
            echo "::notice::vault schema does not exist (supabase_vault not installed or not configured)"
            echo '{"vault_schema_exists": false, "jobs_drain_secret_exists": false, "jobs_drain_url_exists": false}' | jq .
          fi

          echo ""
          echo "=== pgmq Queues ==="
          echo ""

          PGMQ_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pgmq');
          EOSQL
          )

          if [ "$PGMQ_EXISTS" = "t" ]; then
            echo "Queue names from pgmq.list_queues():"
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          SELECT queue_name FROM pgmq.list_queues() ORDER BY queue_name;
          EOSQL

            echo ""
            echo "S6 queue and dead letter table status:"
            psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            's6_sync_queue_exists', EXISTS(SELECT 1 FROM pgmq.list_queues() WHERE queue_name = 's6_sync'),
            's6_bulk_queue_exists', EXISTS(SELECT 1 FROM pgmq.list_queues() WHERE queue_name = 's6_bulk'),
            's6_dead_letter_table_exists', (to_regclass('public.s6_dead_letter') IS NOT NULL)
          );
          EOSQL
          else
            echo "::notice::pgmq extension is not installed"
            echo '{"s6_sync_queue_exists": false, "s6_bulk_queue_exists": false, "s6_dead_letter_table_exists": false}' | jq .
          fi

      - name: Queue and webhook counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Queue and Webhook Counts (last 24h) ==="
          echo ""

          # Check if pgmq extension is installed
          PGMQ_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT EXISTS(SELECT 1 FROM pg_extension WHERE extname = 'pgmq');
          EOSQL
          )

          if [ "$PGMQ_EXISTS" = "t" ]; then
            echo "--- pgmq Queue Metrics ---"
            echo ""
            echo "Queue depth and archive counts (via pgmq.metrics):"
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          SELECT
            queue_name,
            queue_length AS pending,
            total_messages AS total_ever,
            newest_msg_age_sec,
            oldest_msg_age_sec
          FROM pgmq.metrics_all()
          ORDER BY queue_name;
          EOSQL

            echo ""
            echo "Queue metrics as JSON:"
            psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_agg(json_build_object(
            'queue', queue_name,
            'pending', queue_length,
            'total_ever', total_messages,
            'oldest_msg_age_sec', oldest_msg_age_sec
          ))
          FROM pgmq.metrics_all();
          EOSQL
          else
            echo "::notice::pgmq not installed, skipping queue metrics"
          fi

          echo ""
          echo "--- Webhook Receipts (last 24h by topic) ---"
          echo ""

          # Check if webhook_receipts table exists
          RECEIPTS_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT to_regclass('public.webhook_receipts') IS NOT NULL;
          EOSQL
          )

          if [ "$RECEIPTS_EXISTS" = "t" ]; then
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          SELECT
            topic,
            COUNT(*) AS count_24h
          FROM webhook_receipts
          WHERE received_at > NOW() - INTERVAL '24 hours'
          GROUP BY topic
          ORDER BY count_24h DESC;
          EOSQL

            echo ""
            echo "Webhook receipts summary (JSON):"
            psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            'total_24h', (SELECT COUNT(*) FROM webhook_receipts WHERE received_at > NOW() - INTERVAL '24 hours'),
            'by_topic', (
              SELECT json_object_agg(topic, cnt)
              FROM (
                SELECT topic, COUNT(*) AS cnt
                FROM webhook_receipts
                WHERE received_at > NOW() - INTERVAL '24 hours'
                GROUP BY topic
              ) sub
            )
          );
          EOSQL
          else
            echo "::notice::webhook_receipts table not found"
          fi

          echo ""
          echo "--- Processed Webhooks (last 24h by topic) ---"
          echo ""

          # Check if s6_processed_webhooks table exists
          PROCESSED_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT to_regclass('public.s6_processed_webhooks') IS NOT NULL;
          EOSQL
          )

          if [ "$PROCESSED_EXISTS" = "t" ]; then
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          SELECT
            topic,
            COUNT(*) AS count_24h
          FROM s6_processed_webhooks
          WHERE processed_at > NOW() - INTERVAL '24 hours'
          GROUP BY topic
          ORDER BY count_24h DESC;
          EOSQL

            echo ""
            echo "Processed webhooks summary (JSON):"
            psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            'total_24h', (SELECT COUNT(*) FROM s6_processed_webhooks WHERE processed_at > NOW() - INTERVAL '24 hours'),
            'by_topic', (
              SELECT json_object_agg(topic, cnt)
              FROM (
                SELECT topic, COUNT(*) AS cnt
                FROM s6_processed_webhooks
                WHERE processed_at > NOW() - INTERVAL '24 hours'
                GROUP BY topic
              ) sub
            )
          );
          EOSQL
          else
            echo "::notice::s6_processed_webhooks table not found"
          fi

          echo ""
          echo "--- Dead Letter Queue (DLQ) Summary ---"
          echo ""

          # Check if s6_dead_letter table exists
          DLQ_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT to_regclass('public.s6_dead_letter') IS NOT NULL;
          EOSQL
          )

          if [ "$DLQ_EXISTS" = "t" ]; then
            # #174/#176: s6_dead_letter.error is now "[non_retryable:|permanent:]<code>".
            # Rows written before #176 hold raw text; they are bucketed as legacy_* (or
            # no_handler, still text) and the text itself is never printed. Same
            # classification as scripts/readonly/post-drain-aggregates.sql.
            echo "DLQ messages by queue/topic/error code (no payloads; error text never printed):"
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          SELECT original_queue, message->>'topic' AS topic,
                 error_format, error_disposition, error_code, COUNT(*) AS count
          FROM
          (SELECT d.*,
            CASE WHEN d.error IS NULL THEN NULL
                 WHEN m.m IS NOT NULL THEN 'code'
                 WHEN d.error LIKE 'No handler registered for topic after %' THEN 'no_handler_text'
                 ELSE 'legacy_text' END AS error_format,
            CASE WHEN d.error IS NULL THEN NULL
                 WHEN m.m IS NOT NULL THEN COALESCE(m.m[1], 'none')
                 WHEN d.error LIKE 'Non-retryable error:%' THEN 'non_retryable'
                 ELSE 'none' END AS error_disposition,
            CASE WHEN d.error IS NULL THEN NULL
                 WHEN m.m IS NOT NULL THEN m.m[2]
                 WHEN d.error LIKE 'No handler registered for topic after %' THEN 'no_handler'
                 WHEN d.error LIKE 'Order has payment terms but no matching BuyerAccount found%' THEN 'legacy_nba_payment_terms'
                 WHEN d.error LIKE 'Customer matches tag rule % but no BuyerAccount found%' THEN 'legacy_nba_tag_rule'
                 WHEN d.error LIKE 'CompanyLocation exists but no BuyerAccount synced yet%' THEN 'legacy_nba_company_location'
                 ELSE 'legacy_unclassified' END AS error_code
          FROM s6_dead_letter d
          CROSS JOIN LATERAL (SELECT regexp_match(d.error, '^(?:(non_retryable|permanent):)?([A-Za-z][A-Za-z0-9_]{0,63}|graphql_error:[A-Za-z0-9_,]{1,200})$') AS m) m) dlq
          GROUP BY 1, 2, 3, 4, 5
          ORDER BY count DESC, 1, 2, 3, 4, 5
          LIMIT 50;
          EOSQL

            echo ""
            echo "DLQ summary (JSON):"
            psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            'total', (SELECT COUNT(*) FROM s6_dead_letter),
            'by_queue', (
              SELECT json_object_agg(original_queue, cnt)
              FROM (
                SELECT original_queue, COUNT(*) AS cnt
                FROM s6_dead_letter
                GROUP BY original_queue
              ) sub
            ),
            'by_topic', (
              SELECT json_object_agg(topic, cnt)
              FROM (
                SELECT message->>'topic' AS topic, COUNT(*) AS cnt
                FROM s6_dead_letter
                GROUP BY message->>'topic'
              ) sub
            ),
            'by_error_code', (
              SELECT json_object_agg(COALESCE(error_code, '(null)'), cnt)
              FROM (
                SELECT error_code, COUNT(*) AS cnt
                FROM
                (SELECT d.*,
                  CASE WHEN d.error IS NULL THEN NULL
                       WHEN m.m IS NOT NULL THEN 'code'
                       WHEN d.error LIKE 'No handler registered for topic after %' THEN 'no_handler_text'
                       ELSE 'legacy_text' END AS error_format,
                  CASE WHEN d.error IS NULL THEN NULL
                       WHEN m.m IS NOT NULL THEN COALESCE(m.m[1], 'none')
                       WHEN d.error LIKE 'Non-retryable error:%' THEN 'non_retryable'
                       ELSE 'none' END AS error_disposition,
                  CASE WHEN d.error IS NULL THEN NULL
                       WHEN m.m IS NOT NULL THEN m.m[2]
                       WHEN d.error LIKE 'No handler registered for topic after %' THEN 'no_handler'
                       WHEN d.error LIKE 'Order has payment terms but no matching BuyerAccount found%' THEN 'legacy_nba_payment_terms'
                       WHEN d.error LIKE 'Customer matches tag rule % but no BuyerAccount found%' THEN 'legacy_nba_tag_rule'
                       WHEN d.error LIKE 'CompanyLocation exists but no BuyerAccount synced yet%' THEN 'legacy_nba_company_location'
                       ELSE 'legacy_unclassified' END AS error_code
                FROM s6_dead_letter d
                CROSS JOIN LATERAL (SELECT regexp_match(d.error, '^(?:(non_retryable|permanent):)?([A-Za-z][A-Za-z0-9_]{0,63}|graphql_error:[A-Za-z0-9_,]{1,200})$') AS m) m) dlq
                GROUP BY error_code
              ) sub
            )
          );
          EOSQL
          else
            echo "::notice::s6_dead_letter table not found"
          fi

          echo ""
          echo "--- Entity Counts by Shop ---"
          echo ""

          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
          SELECT
            ROW_NUMBER() OVER (ORDER BY s.id) AS shop_idx,
            (SELECT COUNT(*) FROM "Invoice" i WHERE i."shopId" = s.id) AS invoice_count,
            (SELECT COUNT(*) FROM "BuyerAccount" ba WHERE ba."shopId" = s.id) AS buyer_account_count
          FROM "Shop" s
          WHERE s."uninstalledAt" IS NULL
          ORDER BY s.id;
          EOSQL

          echo ""
          echo "Entity counts summary (JSON):"
          psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_agg(json_build_object(
            'shop_idx', x.shop_idx,
            'invoices', x.invoices,
            'buyer_accounts', x.buyer_accounts
          ) ORDER BY x.shop_idx)
          FROM (
            SELECT
              ROW_NUMBER() OVER (ORDER BY s.id) AS shop_idx,
              (SELECT COUNT(*) FROM "Invoice" i WHERE i."shopId" = s.id) AS invoices,
              (SELECT COUNT(*) FROM "BuyerAccount" ba WHERE ba."shopId" = s.id) AS buyer_accounts
            FROM "Shop" s
            WHERE s."uninstalledAt" IS NULL
          ) x;
          EOSQL

      - name: Drain cron control
        # Runs before DLQ Redrive so pause can take effect first in the same run.
        if: ${{ inputs.drain_cron == 'pause' || inputs.drain_cron == 'resume' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          DRAIN_CRON: ${{ inputs.drain_cron }}
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set (required for drain_cron)"
            exit 1
          fi

          case "$DRAIN_CRON" in
            pause)  TARGET_ACTIVE=false ;;
            resume) TARGET_ACTIVE=true ;;
            *) echo "::error::drain_cron must be none|pause|resume"; exit 1 ;;
          esac

          echo "=== Drain cron control: $DRAIN_CRON ==="

          # Scoped to the single job named s10_drain_every_minute; never reads or prints cron.job.command.
          # Fails (no change) unless exactly one such job exists.
          RESULT=$(psql -X -v ON_ERROR_STOP=1 -v target_active="$TARGET_ACTIVE" -t -A "$DATABASE_URL" <<'EOSQL'
          DO $$
          DECLARE n int;
          BEGIN
            SELECT count(*) INTO n FROM cron.job WHERE jobname = 's10_drain_every_minute';
            IF n <> 1 THEN
              RAISE EXCEPTION 'expected exactly 1 s10_drain_every_minute job, found %', n;
            END IF;
          END $$;
          SELECT cron.alter_job(
            job_id := (SELECT jobid FROM cron.job WHERE jobname = 's10_drain_every_minute'),
            active := :'target_active'::boolean
          );
          SELECT json_build_object(
            'jobid', jobid,
            'jobname', jobname,
            'schedule', schedule,
            'active', active
          )
          FROM cron.job
          WHERE jobname = 's10_drain_every_minute';
          EOSQL
          )

          echo "s10_drain_every_minute after alter_job:"
          echo "$RESULT" | tail -n 1 | jq .
          echo "::notice::drain_cron=$DRAIN_CRON applied to s10_drain_every_minute"

      - name: DLQ Redrive
        if: ${{ inputs.redrive_dlq }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_SESSION }}
          REDRIVE_TOPIC: ${{ inputs.redrive_topic }}
          REDRIVE_LIMIT: ${{ inputs.redrive_limit }}
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_SESSION secret not set (required for DLQ redrive - needs write access)"
            exit 1
          fi

          if [ -z "$REDRIVE_TOPIC" ]; then
            echo "::error::redrive_topic is required when redrive_dlq=true"
            exit 1
          fi

          # Validate limit is numeric
          if ! [[ "$REDRIVE_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::redrive_limit must be a positive integer"
            exit 1
          fi

          echo "=== DLQ Redrive ==="
          echo ""
          echo "Topic: $REDRIVE_TOPIC"
          echo "Limit: $REDRIVE_LIMIT"
          echo ""

          # First, show how many messages match (excluding sanitized rows)
          MATCH_COUNTS=$(psql -v ON_ERROR_STOP=1 -v topic="$REDRIVE_TOPIC" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            'redrivable', COUNT(*) FILTER (WHERE NOT (message ? 'sanitized')),
            'sanitized', COUNT(*) FILTER (WHERE message ? 'sanitized')
          )
          FROM s6_dead_letter
          WHERE message->>'topic' = :'topic';
          EOSQL
          )

          MATCH_COUNT=$(echo "$MATCH_COUNTS" | jq -r '.redrivable')
          SANITIZED_COUNT=$(echo "$MATCH_COUNTS" | jq -r '.sanitized')

          echo "Messages matching topic '$REDRIVE_TOPIC':"
          echo "  Redrivable: $MATCH_COUNT"
          echo "  Sanitized (skipped): $SANITIZED_COUNT"
          echo ""

          if [ "$MATCH_COUNT" = "0" ]; then
            echo "No redrivable messages. (Sanitized rows have no payload to re-process.)"
            exit 0
          fi

          # Redrive messages in a single transaction:
          # 1. Select matching DLQ rows (limited)
          # 2. For each, call pgmq.send to re-enqueue
          # 3. Delete from s6_dead_letter
          # This is idempotent: if the workflow is re-run, rows already deleted won't be processed again.
          # NOTE: Sanitized rows (message ? 'sanitized') are excluded - they have no payload to re-process.
          REDRIVE_RESULT=$(psql -v ON_ERROR_STOP=1 -v topic="$REDRIVE_TOPIC" -v lim="$REDRIVE_LIMIT" -t -A "$DATABASE_URL" <<'EOSQL'
          WITH to_redrive AS (
            SELECT id, original_queue, message
            FROM s6_dead_letter
            WHERE message->>'topic' = :'topic'
              AND NOT (message ? 'sanitized')
            ORDER BY dead_lettered_at ASC
            LIMIT :lim
          ),
          requeued AS (
            SELECT
              tr.id,
              tr.original_queue,
              pgmq.send(tr.original_queue, tr.message) AS new_msg_id
            FROM to_redrive tr
          ),
          deleted AS (
            DELETE FROM s6_dead_letter
            WHERE id IN (SELECT id FROM requeued)
            RETURNING id
          )
          SELECT json_build_object(
            'redriven_count', (SELECT COUNT(*) FROM deleted),
            'sample_queues', (SELECT array_agg(DISTINCT original_queue) FROM requeued)
          );
          EOSQL
          )

          echo "Redrive result:"
          echo "$REDRIVE_RESULT" | jq .

          echo ""
          echo "::notice::DLQ redrive completed"

      - name: Invoices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Invoices ==="
          echo ""

          # Get shop id first
          SHOP_ID=$(psql -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT id FROM "Shop" WHERE domain = :'shop';
          EOSQL
          )

          if [ -z "$SHOP_ID" ]; then
            echo "::warning::Shop not found in database"
            echo '{"shop_found": false}' | jq .
            exit 0
          fi

          echo "Invoice counts for shop:"
          psql -v ON_ERROR_STOP=1 -v shop_id="$SHOP_ID" -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            'total', (SELECT COUNT(*) FROM "Invoice" WHERE "shopId" = :'shop_id'),
            'open_unpaid', (SELECT COUNT(*) FROM "Invoice" WHERE "shopId" = :'shop_id' AND status = 'open'),
            'past_due', (SELECT COUNT(*) FROM "Invoice" WHERE "shopId" = :'shop_id' AND status = 'open' AND "dueAt" IS NOT NULL AND "dueAt" < NOW())
          );
          EOSQL

          echo ""
          echo "Invoices grouped by dueBasis (how payment terms were determined):"
          echo "(null means Shopify PaymentSchedule dueAt OR no payment terms)"
          psql -v ON_ERROR_STOP=1 -v shop_id="$SHOP_ID" -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_object_agg(
            COALESCE("dueBasis", 'null'),
            cnt
          )
          FROM (
            SELECT "dueBasis", COUNT(*) AS cnt
            FROM "Invoice"
            WHERE "shopId" = :'shop_id'
            GROUP BY "dueBasis"
          ) sub;
          EOSQL

          echo ""
          echo "BuyerAccount and tag rule counts:"
          psql -v ON_ERROR_STOP=1 -v shop_id="$SHOP_ID" -t "$DATABASE_URL" <<'EOSQL'
          SELECT json_build_object(
            'buyer_account_count', (SELECT COUNT(*) FROM "BuyerAccount" WHERE "shopId" = :'shop_id'),
            'tag_rule_count', (SELECT COUNT(*) FROM "AccountSource" WHERE "shopId" = :'shop_id')
          );
          EOSQL

      - name: S12 Validation
        id: s12_validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          ENSURE_VALIDATION: ${{ inputs.ensure_validation }}
          CHECKOUT_FIXTURES: ${{ inputs.checkout_fixtures }}
          TOKEN_EXPIRED: ${{ steps.session.outputs.token_expired }}
          OFFLINE_SESSION_EXISTS: ${{ steps.session.outputs.offline_session_exists }}
          REFRESH_SUCCESS: ${{ steps.refresh.outputs.refresh_success }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          echo "=== S12 Validation ==="
          echo ""

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          # Check if repo's input query references metafield namespace $app key credit_status
          # (deployed function's inputQuery will be checked via API below)
          INPUT_QUERY_FILE="extensions/credit-check-validation/src/cart_validations_generate_run.graphql"
          REPO_INPUT_QUERY_HAS_CREDIT_STATUS=false
          if [ -f "$INPUT_QUERY_FILE" ]; then
            # shellcheck disable=SC2016
            # Check for: metafield(namespace: "$app", key: "credit_status")
            if grep -qE 'metafield\s*\(\s*namespace:\s*"\$app"\s*,\s*key:\s*"credit_status"' "$INPUT_QUERY_FILE"; then
              REPO_INPUT_QUERY_HAS_CREDIT_STATUS=true
            fi
          fi
          echo "repo_input_query_has_credit_status: $REPO_INPUT_QUERY_HAS_CREDIT_STATUS"
          echo ""

          # Check if offline session exists
          if [ "$OFFLINE_SESSION_EXISTS" != "true" ]; then
            echo "::warning::No offline session found for shop"
            echo '{"offline_session_exists": false, "status": "skipped"}' | jq .
            exit 0
          fi

          # Check if token is expired and refresh was not successful
          # In read-only default mode, skip checks that require a valid token
          if [ "$TOKEN_EXPIRED" = "true" ] && [ "$REFRESH_SUCCESS" != "true" ]; then
            echo "::notice::Offline access token has expired, skipping S12 Validation (read-only mode)."
            echo ""
            # If ensure_validation was requested but we can't run it, warn and record in summary
            if [ "$ENSURE_VALIDATION" = "true" ]; then
              echo "::warning::ensure_validation=true but token is expired; cannot create/enable validation without valid token"
              echo "ensure_validation_skipped=true" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "S12 Validation status:"
            jq -n \
              --argjson repo_input_query_has_credit_status "$REPO_INPUT_QUERY_HAS_CREDIT_STATUS" \
              --argjson ensure_validation_skipped "$([ "$ENSURE_VALIDATION" = "true" ] && echo true || echo false)" \
              '{status: "skipped", reason: "token_expired", repo_input_query_has_credit_status: $repo_input_query_has_credit_status, ensure_validation_skipped: $ensure_validation_skipped}'
            exit 0
          fi

          # Fetch offline access token (read-only query)
          ACCESS_TOKEN=$(psql -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT "accessToken"
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          EOSQL
          )

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::Offline session has no access token"
            echo '{"has_access_token": false, "status": "skipped"}' | jq .
            exit 0
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          # Temp files for cleanup
          CURL_CONFIG=""
          HTTP_RESPONSE=""
          cleanup() {
            rm -f "$CURL_CONFIG" "$HTTP_RESPONSE"
          }
          trap cleanup EXIT

          # Create curl config file with token
          CURL_CONFIG=$(mktemp)
          chmod 600 "$CURL_CONFIG"
          cat > "$CURL_CONFIG" <<EOF
          header = "Content-Type: application/json"
          header = "X-Shopify-Access-Token: $ACCESS_TOKEN"
          EOF

          # Query validations (use shopifyFunction.handle per 2026-10 schema, not functionHandle)
          QUERY='{"query":"{ validations(first:50) { nodes { id title enabled blockOnFailure shopifyFunction { handle inputQuery } } } }"}'

          HTTP_RESPONSE=$(mktemp)
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
            -X POST \
            --config "$CURL_CONFIG" \
            --data-binary "$QUERY" \
            "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Validations query failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          # Check for GraphQL errors
          if jq -e '.errors | length > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
            ERROR_CODES=$(jq -r '[.errors[] | .extensions.code // "UNKNOWN"] | join(", ")' "$HTTP_RESPONSE")
            echo "::error::GraphQL errors: $ERROR_CODES"
            exit 1
          fi

          # Find credit-check-validation node by shopifyFunction.handle
          VALIDATION_NODE=$(jq -r '.data.validations.nodes[] | select(.shopifyFunction.handle == "credit-check-validation")' "$HTTP_RESPONSE")

          VALIDATION_EXISTS=false
          VALIDATION_ENABLED=false
          VALIDATION_BLOCK_ON_FAILURE=false
          DEPLOYED_INPUT_QUERY_HAS_CREDIT_STATUS=false
          # Shape-only metrics for the deployed inputQuery: booleans + one integer.
          # NEVER print the query text or any part of it (public Actions logs).
          # "Missing node" counts as null (the API gave us no inputQuery string).
          INPUT_QUERY_NULL=true
          INPUT_QUERY_LENGTH=0
          IQ_HAS_CREDIT_STATUS=false
          IQ_HAS_DOLLAR_APP=false
          IQ_HAS_APP_PREFIX=false
          IQ_HAS_METAFIELD=false
          # metafield(... namespace: "$app" | "app--<digits>" ... key: "credit_status" ...),
          # either argument order, matched on the query flattened to one line.
          # shellcheck disable=SC2016
          IQ_NS='namespace[[:space:]]*:[[:space:]]*"(\$app|app--[0-9]+)"'
          IQ_KEY='key[[:space:]]*:[[:space:]]*"credit_status"'
          IQ_CREDIT_STATUS_RE="metafield[[:space:]]*\\([^)]*(${IQ_NS}[^)]*${IQ_KEY}|${IQ_KEY}[^)]*${IQ_NS})"

          if [ -n "$VALIDATION_NODE" ] && [ "$VALIDATION_NODE" != "null" ]; then
            VALIDATION_EXISTS=true
            VALIDATION_ENABLED=$(echo "$VALIDATION_NODE" | jq -r '.enabled')
            VALIDATION_BLOCK_ON_FAILURE=$(echo "$VALIDATION_NODE" | jq -r '.blockOnFailure')
            # Null/missing is tested on the raw JSON value (no `// ""` default), so an
            # empty string ("" => null=false, length=0) is distinguishable from null.
            INPUT_QUERY_NULL=$(echo "$VALIDATION_NODE" | jq '(.shopifyFunction.inputQuery | type) != "string"')
            INPUT_QUERY_LENGTH=$(echo "$VALIDATION_NODE" | jq '.shopifyFunction.inputQuery | if type == "string" then length else 0 end')
            if [ "$INPUT_QUERY_NULL" = "false" ]; then
              # Flatten to one line so multiline queries match; held in memory only.
              IQ_FLAT=$(echo "$VALIDATION_NODE" | jq -r '.shopifyFunction.inputQuery' | tr '\n' ' ')
              # Bash pattern tests (no pipes into grep -q, so no SIGPIPE/pipefail false negatives)
              # shellcheck disable=SC2016
              if [[ "$IQ_FLAT" == *'$app'* ]]; then IQ_HAS_DOLLAR_APP=true; fi
              if [[ "$IQ_FLAT" =~ app--[0-9]+ ]]; then IQ_HAS_APP_PREFIX=true; fi
              if [[ "$IQ_FLAT" == *metafield* ]]; then IQ_HAS_METAFIELD=true; fi
              if [[ "$IQ_FLAT" == *credit_status* ]]; then IQ_HAS_CREDIT_STATUS=true; fi
              if [[ "$IQ_FLAT" =~ $IQ_CREDIT_STATUS_RE ]]; then DEPLOYED_INPUT_QUERY_HAS_CREDIT_STATUS=true; fi
              unset IQ_FLAT
            fi
          fi
          # A null/missing inputQuery tells us nothing about credit_status, so report
          # the JSON string "unknown" rather than false. A non-null query (including the
          # empty string "", which is non-null with length 0) keeps a true/false verdict.
          # deployed_input_query_check: unavailable_api_null (null, not a failure),
          # has_credit_status (non-null with credit_status), or missing_credit_status.
          DEPLOYED_INPUT_QUERY_CHECK="missing_credit_status"
          if [ "$INPUT_QUERY_NULL" = "true" ]; then
            DEPLOYED_INPUT_QUERY_HAS_CREDIT_STATUS='"unknown"'
            DEPLOYED_INPUT_QUERY_CHECK="unavailable_api_null"
          elif [ "$DEPLOYED_INPUT_QUERY_HAS_CREDIT_STATUS" = "true" ]; then
            DEPLOYED_INPUT_QUERY_CHECK="has_credit_status"
          fi

          echo "S12 Validation status (read-only):"
          jq -n \
            --argjson exists "$VALIDATION_EXISTS" \
            --argjson enabled "$VALIDATION_ENABLED" \
            --argjson block_on_failure "$VALIDATION_BLOCK_ON_FAILURE" \
            --argjson repo_input_query_has_credit_status "$REPO_INPUT_QUERY_HAS_CREDIT_STATUS" \
            --argjson deployed_input_query_has_credit_status "$DEPLOYED_INPUT_QUERY_HAS_CREDIT_STATUS" \
            --arg deployed_input_query_check "$DEPLOYED_INPUT_QUERY_CHECK" \
            --argjson input_query_null "$INPUT_QUERY_NULL" \
            --argjson input_query_length "$INPUT_QUERY_LENGTH" \
            --argjson iq_has_credit_status "$IQ_HAS_CREDIT_STATUS" \
            --argjson iq_has_dollar_app "$IQ_HAS_DOLLAR_APP" \
            --argjson iq_has_app_prefix "$IQ_HAS_APP_PREFIX" \
            --argjson iq_has_metafield "$IQ_HAS_METAFIELD" \
            '{exists: $exists, enabled: $enabled, blockOnFailure: $block_on_failure, repo_input_query_has_credit_status: $repo_input_query_has_credit_status, deployed_input_query_has_credit_status: $deployed_input_query_has_credit_status, deployed_input_query_check: $deployed_input_query_check, input_query_null: $input_query_null, input_query_length: $input_query_length, iq_has_credit_status: $iq_has_credit_status, iq_has_dollar_app: $iq_has_dollar_app, iq_has_app_prefix: $iq_has_app_prefix, iq_has_metafield: $iq_has_metafield}'
          echo "deployed_input_query_check=$DEPLOYED_INPUT_QUERY_CHECK"

          # Cross-check via shopifyFunctions(apiType: cart_checkout_validation), read-only.
          # Prints a count, function ids and per-function booleans/integers only; never
          # titles or query text. has_credit_status is "unknown" when inputQuery is null.
          # Soft-fails (warning) so it can't break the step.
          echo ""
          echo "S12 shopifyFunctions cross-check (read-only):"
          FN_QUERY='{"query":"{ shopifyFunctions(first: 25, apiType: \"cart_checkout_validation\") { nodes { id handle inputQuery } } }"}'
          FN_RESPONSE=$(mktemp)
          FN_STATUS=$(curl -s -w "%{http_code}" -o "$FN_RESPONSE" \
            -X POST \
            --config "$CURL_CONFIG" \
            --data-binary "$FN_QUERY" \
            "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json" || echo "000")
          if [ "$FN_STATUS" != "200" ]; then
            echo "::warning::shopifyFunctions cross-check failed with HTTP $FN_STATUS"
            jq -n --arg http_status "$FN_STATUS" '{cross_check: "error", http_status: $http_status}'
          elif jq -e '(.errors | length) > 0' "$FN_RESPONSE" >/dev/null 2>&1; then
            echo "::warning::shopifyFunctions cross-check returned GraphQL errors"
            jq '{cross_check: "error", error_codes: [.errors[] | .extensions.code // "UNKNOWN"]}' "$FN_RESPONSE"
          else
            jq --arg ns_re '(\$app|app--[0-9]+)' '
              [.data.shopifyFunctions.nodes[]?] as $fns
              | ("namespace\\s*:\\s*\"" + $ns_re + "\"") as $ns
              | "key\\s*:\\s*\"credit_status\"" as $key
              | ("metafield\\s*\\([^)]*(" + $ns + "[^)]*" + $key + "|" + $key + "[^)]*" + $ns + ")") as $re
              | {cross_check: "ok",
                 function_count: ($fns | length),
                 functions: [$fns[] |
                   ((.inputQuery | type) != "string") as $null
                   | (.inputQuery | if type == "string" then (gsub("\n"; " ") | test($re)) else false end) as $has_cs
                   | {
                   id: .id,
                   handle_is_credit_check_validation: (.handle == "credit-check-validation"),
                   input_query_null: $null,
                   input_query_length: (.inputQuery | if type == "string" then length else 0 end),
                   has_credit_status: (if $null then "unknown" elif $has_cs then true else false end),
                   input_query_check: (if $null then "unavailable_api_null" elif $has_cs then "has_credit_status" else "missing_credit_status" end)
                 }]}' "$FN_RESPONSE"
          fi
          rm -f "$FN_RESPONSE"

          # S12 checkout fixtures (read-only). Prints ids, enums, booleans and the
          # whitelisted credit_status fields only. Never names, emails, phones or addresses.
          if [ "$CHECKOUT_FIXTURES" = "true" ]; then
            echo ""
            echo "=== S12 checkout fixtures (read-only) ==="
            FX_QUERY='{"query":"{ validations(first:50) { nodes { id enabled blockOnFailure shopifyFunction { id handle apiType apiVersion app { id handle } } } } }"}'
            HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
              -X POST \
              --config "$CURL_CONFIG" \
              --data-binary "$FX_QUERY" \
              "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "::error::Fixtures validations query failed with HTTP $HTTP_STATUS"
              exit 1
            fi
            if jq -e '.errors | length > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
              echo "::error::GraphQL errors: $(jq -r '[.errors[] | .extensions.code // "UNKNOWN"] | join(", ")' "$HTTP_RESPONSE")"
              exit 1
            fi
            echo "active_validation (credit-check-validation):"
            jq -c '.data.validations.nodes[] | select(.shopifyFunction.handle == "credit-check-validation")
              | {validation_id: .id, enabled, blockOnFailure,
                 function_id: .shopifyFunction.id, function_handle: .shopifyFunction.handle,
                 function_api_type: .shopifyFunction.apiType, function_api_version: .shopifyFunction.apiVersion,
                 app_id: .shopifyFunction.app.id, app_handle: .shopifyFunction.app.handle}' "$HTTP_RESPONSE"
            echo "app_version: not exposed by the Admin API (see the release workflow output / Dev Dashboard)"

            FX_SHOP_ID=$(psql -v ON_ERROR_STOP=1 -v shop="$SHOP_DOMAIN" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT id FROM "Shop" WHERE domain = :'shop';
          EOSQL
            )
            if [ -z "$FX_SHOP_ID" ]; then
              echo '{"fixtures_shop_found": false}'
            else
              FIXTURES=$(psql -v ON_ERROR_STOP=1 -v shop_id="$FX_SHOP_ID" -t -A "$DATABASE_URL" \
                -f scripts/readonly/s12-checkout-fixtures.sql | grep '^{' || true)
              FX_COUNT=$(printf '%s\n' "$FIXTURES" | grep -c '^{' || true)
              echo "seed_fixture_accounts: $FX_COUNT"
              if [ "$FX_COUNT" != "0" ]; then
                OWNER_IDS=$(printf '%s\n' "$FIXTURES" | jq -s -c '[.[] | (.company_location_id // .customer_id) | select(. != null)] | unique')
                # shellcheck disable=SC2016
                NODES_Q=$(jq -n --argjson ids "$OWNER_IDS" '{query: "query($ids: [ID!]!) { nodes(ids: $ids) { ... on CompanyLocation { id metafield(namespace: \"$app\", key: \"credit_status\") { jsonValue } } ... on Customer { id metafield(namespace: \"$app\", key: \"credit_status\") { jsonValue } } } }", variables: {ids: $ids}}')
                HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
                  -X POST \
                  --config "$CURL_CONFIG" \
                  --data-binary "$NODES_Q" \
                  "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json")
                if [ "$HTTP_STATUS" != "200" ]; then
                  echo "::error::Fixtures metafield query failed with HTTP $HTTP_STATUS"
                  exit 1
                fi
                if jq -e '.errors | length > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
                  echo "::error::GraphQL errors: $(jq -r '[.errors[] | .extensions.code // "UNKNOWN"] | join(", ")' "$HTTP_RESPONSE")"
                  exit 1
                fi
                MF_MAP=$(jq -c '[.data.nodes[] | select(. != null and .id != null)
                  | {key: .id, value: (if .metafield == null then null else (.metafield.jsonValue
                      | {schemaVersion, hold, currencyCode,
                         holdReasonCode: (if .holdReasonCode == null then null
                                          elif ((.holdReasonCode | type) == "string" and (.holdReasonCode | test("^[A-Z0-9_]{1,40}$"))) then .holdReasonCode
                                          else "<other>" end),
                         has_limit: (.limitPaise != null),
                         over_limit: (if .limitPaise == null or .exposurePaise == null then null
                                      else ((.exposurePaise | tonumber) > (.limitPaise | tonumber)) end),
                         updatedAt}) end)}]
                  | from_entries' "$HTTP_RESPONSE")
                echo "fixtures (one per line):"
                printf '%s\n' "$FIXTURES" | jq -c --argjson mf "$MF_MAP" '
                  . as $a | ($a.company_location_id // $a.customer_id) as $owner
                  | {buyer_account_id, kind, company_id, company_location_id, customer_id,
                     hold_state, manual_hold, bypass, manual_hold_reason_code, overdue,
                     owner_found: ($owner != null and ($mf | has($owner))),
                     credit_status: (if $owner == null then null else $mf[$owner] end)}'
                printf '%s\n' "$FIXTURES" | jq -s -c --argjson mf "$MF_MAP" '
                  {fixtures_total: length,
                   db_held: (map(select(.hold_state == "HELD" or .manual_hold)) | length),
                   db_overdue: (map(select(.overdue)) | length),
                   metafield_present: (map((.company_location_id // .customer_id) as $o | select($o != null and $mf[$o] != null)) | length),
                   metafield_hold_true: (map((.company_location_id // .customer_id) as $o | select($o != null and ($mf[$o].hold // false))) | length)}' \
                  | sed 's/^/fixtures_summary: /'
              fi
            fi
          fi

          # Handle ensure_validation flag
          if [ "$ENSURE_VALIDATION" = "true" ]; then
            echo ""
            echo "ensure_validation=true: checking if action needed..."

            if [ "$VALIDATION_EXISTS" = "false" ]; then
              echo "Validation missing, creating..."
              CREATE_MUTATION='{"query":"mutation { validationCreate(validation: { functionHandle: \"credit-check-validation\", title: \"Net Terms Credit Check\", enable: true, blockOnFailure: false }) { validation { id enabled } userErrors { field message } } }"}'

              HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
                -X POST \
                --config "$CURL_CONFIG" \
                --data-binary "$CREATE_MUTATION" \
                "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json")

              if [ "$HTTP_STATUS" != "200" ]; then
                echo "::error::validationCreate failed with HTTP $HTTP_STATUS"
                exit 1
              fi

              if jq -e '.errors | length > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
                ERROR_CODES=$(jq -r '[.errors[] | .extensions.code // "UNKNOWN"] | join(", ")' "$HTTP_RESPONSE")
                echo "::error::GraphQL errors: $ERROR_CODES"
                exit 1
              fi

              # Public-repo safe: print only the count and field paths, never messages.
              USER_ERROR_COUNT=$(jq -r '.data.validationCreate.userErrors // [] | length' "$HTTP_RESPONSE")
              if [ "$USER_ERROR_COUNT" != "0" ]; then
                USER_ERROR_FIELDS=$(jq -r '[.data.validationCreate.userErrors[] | (.field // []) | join(".")] | join(", ")' "$HTTP_RESPONSE")
                echo "::error::userErrors count=$USER_ERROR_COUNT fields=[$USER_ERROR_FIELDS]"
                exit 1
              fi

              FINAL_ENABLED=$(jq -r '.data.validationCreate.validation.enabled' "$HTTP_RESPONSE")
              echo "Validation created. enabled: $FINAL_ENABLED"

            elif [ "$VALIDATION_ENABLED" = "false" ]; then
              echo "Validation exists but disabled, enabling..."
              VALIDATION_ID=$(echo "$VALIDATION_NODE" | jq -r '.id')
              UPDATE_MUTATION=$(jq -n --arg id "$VALIDATION_ID" '{"query": "mutation($id: ID!) { validationUpdate(id: $id, validation: { enable: true }) { validation { id enabled } userErrors { field message } } }", "variables": {"id": $id}}')

              HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
                -X POST \
                --config "$CURL_CONFIG" \
                --data-binary "$UPDATE_MUTATION" \
                "https://${SHOP_DOMAIN}/admin/api/2026-10/graphql.json")

              if [ "$HTTP_STATUS" != "200" ]; then
                echo "::error::validationUpdate failed with HTTP $HTTP_STATUS"
                exit 1
              fi

              if jq -e '.errors | length > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
                ERROR_CODES=$(jq -r '[.errors[] | .extensions.code // "UNKNOWN"] | join(", ")' "$HTTP_RESPONSE")
                echo "::error::GraphQL errors: $ERROR_CODES"
                exit 1
              fi

              # Public-repo safe: print only the count and field paths, never messages.
              USER_ERROR_COUNT=$(jq -r '.data.validationUpdate.userErrors // [] | length' "$HTTP_RESPONSE")
              if [ "$USER_ERROR_COUNT" != "0" ]; then
                USER_ERROR_FIELDS=$(jq -r '[.data.validationUpdate.userErrors[] | (.field // []) | join(".")] | join(", ")' "$HTTP_RESPONSE")
                echo "::error::userErrors count=$USER_ERROR_COUNT fields=[$USER_ERROR_FIELDS]"
                exit 1
              fi

              FINAL_ENABLED=$(jq -r '.data.validationUpdate.validation.enabled' "$HTTP_RESPONSE")
              echo "Validation enabled. enabled: $FINAL_ENABLED"

            else
              echo "Validation already exists and is enabled, no action needed."
            fi
          fi

      # Cron job 11 (credit_status_daily_sweep) last run and sweep effect counts.
      # Read-only; prints only timestamps, enums, durations and counts.
      - name: Cron sweep diagnostics
        id: cron_sweep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh

          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL_MIGRATIONS not set, skipping cron sweep diagnostics"
            echo "cron_sweep=skipped_no_db"
            exit 0
          fi

          echo "=== Cron Sweep Diagnostics ==="
          echo ""

          # Check if cron schema exists
          CRON_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT EXISTS(SELECT 1 FROM information_schema.schemata WHERE schema_name = 'cron');
          EOSQL
          )

          if [ "$CRON_EXISTS" != "t" ]; then
            echo "cron_sweep=skipped_no_cron_schema"
            exit 0
          fi

          # Check if job_run_details table exists (pg_cron 1.4+)
          JRD_EXISTS=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT to_regclass('cron.job_run_details') IS NOT NULL;
          EOSQL
          )

          if [ "$JRD_EXISTS" != "t" ]; then
            echo "cron_sweep=skipped_no_job_run_details"
            exit 0
          fi

          # Query last run of credit_status_daily_sweep by job name
          echo "credit_status_daily_sweep last run (by jobname):"
          LAST_RUN=$(psql -v ON_ERROR_STOP=1 -t -A -F '|' "$DATABASE_URL" <<'EOSQL'
          SELECT
            jrd.runid,
            jrd.start_time AT TIME ZONE 'UTC',
            jrd.end_time AT TIME ZONE 'UTC',
            jrd.status,
            EXTRACT(EPOCH FROM (jrd.end_time - jrd.start_time))::int AS duration_sec
          FROM cron.job_run_details jrd
          JOIN cron.job j ON j.jobid = jrd.jobid
          WHERE j.jobname = 'credit_status_daily_sweep'
          ORDER BY jrd.start_time DESC
          LIMIT 1;
          EOSQL
          )

          if [ -z "$LAST_RUN" ]; then
            echo "cron_sweep_last_run=none"
          else
            RUNID=$(echo "$LAST_RUN" | cut -d'|' -f1)
            START_TIME=$(echo "$LAST_RUN" | cut -d'|' -f2)
            END_TIME=$(echo "$LAST_RUN" | cut -d'|' -f3)
            STATUS=$(echo "$LAST_RUN" | cut -d'|' -f4)
            DURATION=$(echo "$LAST_RUN" | cut -d'|' -f5)
            jq -n \
              --arg start_time "${START_TIME}Z" \
              --arg status "$STATUS" \
              --argjson duration_sec "${DURATION:-0}" \
              '{cron_sweep_last_run: {start_time_utc: $start_time, status: $status, duration_sec: $duration_sec}}'
          fi

          echo ""
          echo "=== Sweep Effect Counts ==="
          echo ""

          # Current syncPending count and count changed since last sweep start
          # "before" is not stored, so we report current and delta based on audit events
          SWEEP_COUNTS=$(psql -v ON_ERROR_STOP=1 -t "$DATABASE_URL" <<'EOSQL'
          WITH last_sweep AS (
            SELECT jrd.start_time
            FROM cron.job_run_details jrd
            JOIN cron.job j ON j.jobid = jrd.jobid
            WHERE j.jobname = 'credit_status_daily_sweep'
            ORDER BY jrd.start_time DESC
            LIMIT 1
          )
          SELECT json_build_object(
            'sync_pending_current', (SELECT COUNT(*) FROM "BuyerAccount" WHERE "syncPending" = true),
            'holds_applied_since_sweep', (
              SELECT COUNT(*) FROM "AuditEvent"
              WHERE type = 'credit_status.hold_applied'
                AND at >= COALESCE((SELECT start_time FROM last_sweep), '1970-01-01'::timestamptz)
            ),
            'holds_released_since_sweep', (
              SELECT COUNT(*) FROM "AuditEvent"
              WHERE type = 'credit_status.hold_released'
                AND at >= COALESCE((SELECT start_time FROM last_sweep), '1970-01-01'::timestamptz)
            ),
            'sweep_start_found', EXISTS(SELECT 1 FROM last_sweep)
          );
          EOSQL
          )

          echo "sweep_effect_counts (current syncPending, holds applied/released since last sweep start):"
          echo "$SWEEP_COUNTS" | jq .

      # Admin API checks for the allowed dev store: hide-terms-payment active and webhook subscription diff.
      # Read-only; uses the existing offline token path. Skips gracefully if token expired.
      - name: Allowed dev store Admin checks
        id: allowed_admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          PGOPTIONS: "-c default_transaction_read_only=on"
          TOKEN_EXPIRED: ${{ steps.session.outputs.token_expired }}
          REFRESH_SUCCESS: ${{ steps.refresh.outputs.success }}
          ALLOWED_DEV_STORE: ${{ vars.ALLOWED_DEV_STORE }}
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh

          echo "=== Allowed Dev Store Admin Checks ==="
          echo ""

          # Skip if no allowed dev store configured
          if [ -z "${ALLOWED_DEV_STORE:-}" ]; then
            echo "allowed_admin=skipped_no_allowed_dev_store"
            exit 0
          fi

          # Gate: skip if token expired and refresh didn't succeed
          if [ "$TOKEN_EXPIRED" = "true" ] && [ "$REFRESH_SUCCESS" != "true" ]; then
            echo "allowed_admin=skipped_token_expired"
            exit 0
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "allowed_admin=skipped_no_db"
            exit 0
          fi

          # Fetch offline access token for allowed dev store
          ACCESS_TOKEN=$(psql -v ON_ERROR_STOP=1 -v shop="$ALLOWED_DEV_STORE" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT "accessToken"
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false
          LIMIT 1;
          EOSQL
          )

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "allowed_admin=skipped_no_offline_session"
            exit 0
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          CURL_CONFIG=""
          HTTP_RESPONSE=""
          cleanup() { rm -f "$CURL_CONFIG" "$HTTP_RESPONSE"; }
          trap cleanup EXIT

          CURL_CONFIG=$(mktemp)
          chmod 600 "$CURL_CONFIG"
          cat > "$CURL_CONFIG" <<EOF
          header = "Content-Type: application/json"
          header = "X-Shopify-Access-Token: $ACCESS_TOKEN"
          EOF

          HTTP_RESPONSE=$(mktemp)

          # Query paymentCustomizations and webhookSubscriptions
          QUERY='{"query":"{ paymentCustomizations(first: 50) { nodes { enabled shopifyFunction { handle } } } webhookSubscriptions(first: 100) { nodes { topic } } }"}'

          HTTP_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
            -X POST \
            --config "$CURL_CONFIG" \
            --data-binary "$QUERY" \
            "https://${ALLOWED_DEV_STORE}/admin/api/2026-10/graphql.json" || echo "000")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "allowed_admin=error http_status=$HTTP_STATUS"
            exit 0
          fi

          if ! jq -e . "$HTTP_RESPONSE" >/dev/null 2>&1; then
            echo "allowed_admin=error parse_failed"
            exit 0
          fi

          if jq -e '(.errors | length) > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
            echo "allowed_admin=error error_codes=$(jq -r '[.errors[] | .extensions.code // "UNKNOWN" | if test("^[A-Z0-9_]{1,40}$") then . else "UNKNOWN" end] | join(",")' "$HTTP_RESPONSE")"
            exit 0
          fi

          # hide-terms-payment active check (boolean only)
          echo "hide-terms-payment active (boolean):"
          jq -r '
            [.data.paymentCustomizations.nodes[]? | select(.shopifyFunction.handle == "hide-terms-payment")] as $pc
            | "hide_terms_payment_present=\($pc | length > 0)",
              "hide_terms_payment_enabled=\([$pc[] | select(.enabled == true)] | length > 0)"
          ' "$HTTP_RESPONSE"

          echo ""
          # Webhook subscription diff
          # Expected topics from shopify.app.toml (excluding compliance_topics)
          EXPECTED_TOPICS_FILE=$(mktemp)
          { grep -E '^[[:space:]]*topics[[:space:]]*=' shopify.app.toml || true; } \
            | grep -oE '"[a-z_]+/[a-z_]+"' | tr -d '"' | tr 'a-z/' 'A-Z_' | sort -u > "$EXPECTED_TOPICS_FILE"

          echo "Webhook subscription diff (topics only, never URLs):"
          jq -r --rawfile exp "$EXPECTED_TOPICS_FILE" '
            def okenum: type == "string" and test("^[A-Z0-9_]{1,64}$");
            ($exp | split("\n") | map(select(okenum)) | unique) as $e
            | [.data.webhookSubscriptions.nodes[]? | .topic] as $raw
            | ($raw | map(if okenum then . else "INVALID_TOPIC" end) | unique) as $p
            | ($e - $p) as $missing
            | ($p - $e) as $extra
            | "webhook_expected_count=\($e | length)",
              "webhook_present_count=\($p | length)",
              "webhook_missing_count=\($missing | length)",
              "webhook_extra_count=\($extra | length)",
              "webhook_missing_topics=\(if ($missing | length) == 0 then "none" else ($missing | join(",")) end)",
              "webhook_extra_topics=\(if ($extra | length) == 0 then "none" else ($extra | join(",")) end)"
          ' "$HTTP_RESPONSE"

          rm -f "$EXPECTED_TOPICS_FILE"

      - name: Reconcile probe
        if: ${{ inputs.invoke_reconcile }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)

          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_MIGRATIONS secret not set"
            exit 1
          fi

          echo "=== Reconcile Probe ==="
          echo ""

          echo "Invoking public.s10b_call_reconcile() and capturing request_id..."

          # Call reconcile and get the request_id via currval in the same session.
          # If currval errors, the function may have returned early or currval itself failed.
          # pg_net 0.20.4: http_request_queue.id uses sequence net.http_request_queue_id_seq
          # Capture stdout only; stderr goes to the log separately.
          REQUEST_ID_OUTPUT=$(psql -v ON_ERROR_STOP=1 -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT public.s10b_call_reconcile();
          SELECT currval(pg_get_serial_sequence('net.http_request_queue', 'id'));
          EOSQL
          ) || {
            echo "::error::s10b_call_reconcile or currval failed. The function may have returned early or currval failed."
            echo "psql stdout lines: $(printf '%s' "${REQUEST_ID_OUTPUT:-}" | grep -c '' || true)"
            exit 1
          }

          # currval output is the second line (first is the function result)
          REQUEST_ID=$(echo "$REQUEST_ID_OUTPUT" | tail -n1)

          if [ -z "$REQUEST_ID" ] || ! [[ "$REQUEST_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to get request_id from currval. The function may have returned early or currval failed."
            echo "Output lines: $(printf '%s' "$REQUEST_ID_OUTPUT" | grep -c '' || true) (values not printed)"
            exit 1
          fi

          echo "request_id: $REQUEST_ID"
          echo ""
          echo "Polling for HTTP response (up to 75s)..."

          POLL_END=$(($(date +%s) + 75))
          FOUND_ROW=""

          while [ "$(date +%s)" -lt "$POLL_END" ]; do
            FOUND_ROW=$(psql -v ON_ERROR_STOP=1 -v req_id="$REQUEST_ID" -t -A -F '|' "$DATABASE_URL" <<'EOSQL'
          SELECT
            id,
            COALESCE(status_code::text, 'null'),
            CASE WHEN timed_out THEN 'true' ELSE 'false' END,
            CASE WHEN error_msg IS NOT NULL THEN 'true' ELSE 'false' END
          FROM net._http_response
          WHERE id = :req_id;
          EOSQL
            )
            if [ -n "$FOUND_ROW" ]; then
              break
            fi
            sleep 3
          done

          if [ -z "$FOUND_ROW" ]; then
            echo "::error::No HTTP response received within 75 seconds for request_id=$REQUEST_ID"
            echo '{"response_received": false}' | jq .
            exit 1
          fi

          RESP_ID=$(echo "$FOUND_ROW" | cut -d'|' -f1)
          STATUS_CODE=$(echo "$FOUND_ROW" | cut -d'|' -f2)
          TIMED_OUT=$(echo "$FOUND_ROW" | cut -d'|' -f3)
          HAS_ERROR=$(echo "$FOUND_ROW" | cut -d'|' -f4)

          echo ""
          echo "Reconcile HTTP response (id=$RESP_ID):"
          jq -n \
            --argjson status_code "$STATUS_CODE" \
            --argjson timed_out "$TIMED_OUT" \
            --argjson error_msg_present "$HAS_ERROR" \
            '{status_code: $status_code, timed_out: $timed_out, error_msg_present: $error_msg_present}'

          if [ "$TIMED_OUT" = "true" ]; then
            echo "::error::Reconcile HTTP request timed out"
            exit 1
          fi

          if [ "$STATUS_CODE" = "null" ]; then
            echo "::error::Reconcile HTTP response has no status code"
            exit 1
          fi

          if [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
            echo "::error::Reconcile HTTP response status $STATUS_CODE is not 2xx"
            exit 1
          fi

          echo ""
          echo "::notice::Reconcile probe completed successfully (status $STATUS_CODE)"

  # Second-shop E2E mode (install/uninstall/reinstall test on a throwaway dev
  # store). Read-only, dispatch-only, and the ONLY job that runs when
  # e2e_second_shop=true.
  #
  # SAFETY:
  #   - No shop input: the shop comes from the masked E2E_SHOP secret, else the
  #     single Shop row whose domain != ALLOWED_DEV_STORE. Anything else fails
  #     closed with e2e_shop_select=error code=<CODE> (counts only).
  #   - Never selects the allowed dev store (Admin calls never go to it; it is
  #     only counted in SQL for the allowed_shop_* guard lines).
  #   - SELECT only (PGOPTIONS read-only), Admin GraphQL queries only (no
  #     mutations), never refreshes tokens.
  #   - Prints only e2e_<name>=<int|bool|enum|UTC ISO timestamp> lines and
  #     fixed codes; never a domain, name, email, money or per-entity id.
  e2e_second_shop:
    name: Second-shop E2E checks (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && inputs.e2e_second_shop

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Must stay the FIRST step that touches the shop. The selected domain is
      # masked before it is exported via GITHUB_ENV, so later env headers show
      # E2E_SHOP_DOMAIN as ***.
      - name: E2E select shop
        id: e2e_select
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          # Secrets, so the env header prints *** (#190 F1).
          E2E_SHOP: ${{ secrets.E2E_SHOP }}
          ALLOWED_DEV_STORE: ${{ secrets.ALLOWED_DEV_STORE }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          # E2E shop selection (domain never printed)
          fail() {
            echo "e2e_shop_select=error code=$1${2:+ $2}"
            echo "::error::e2e shop selection failed: $1"
            exit 1
          }
          SHOP_RE='^[a-z0-9-]+\.myshopify\.com$'
          if [ -n "$(jq -r '.inputs.shop // empty' "$GITHUB_EVENT_PATH")" ]; then
            fail E2E_SHOP_INPUT_NOT_ALLOWED
          fi
          [ -n "${DATABASE_URL:-}" ] || fail E2E_DATABASE_URL_UNSET
          [ -n "${ALLOWED_DEV_STORE:-}" ] || fail E2E_ALLOWED_DEV_STORE_UNSET
          [[ "$ALLOWED_DEV_STORE" =~ $SHOP_RE ]] || fail E2E_ALLOWED_DEV_STORE_INVALID
          echo "::add-mask::$ALLOWED_DEV_STORE"
          if [ -n "${E2E_SHOP:-}" ]; then
            # Validate before masking so a multi-line value cannot slip past it.
            [[ "$E2E_SHOP" =~ $SHOP_RE ]] || fail E2E_SHOP_INVALID
            echo "::add-mask::$E2E_SHOP"
            [ "$E2E_SHOP" != "$ALLOWED_DEV_STORE" ] || fail E2E_SHOP_IS_ALLOWED_DEV_STORE
            echo "e2e_shop_source=secret"
            N=$(psql -X -v ON_ERROR_STOP=1 -t -A -v shop="$E2E_SHOP" "$DATABASE_URL" \
              <<< "SELECT COUNT(*) FROM \"Shop\" WHERE domain = :'shop';")
            [[ "$N" =~ ^[0-9]+$ ]] || fail E2E_SHOP_COUNT_INVALID
            echo "e2e_shop_candidates=$N"
            [ "$N" != "0" ] || fail E2E_SHOP_NOT_FOUND
            [ "$N" = "1" ] || fail E2E_SHOP_NOT_UNIQUE "candidates=$N"
            SELECTED="$E2E_SHOP"
          else
            echo "e2e_shop_source=fallback_non_allowed"
            N=$(psql -X -v ON_ERROR_STOP=1 -t -A -v allowed="$ALLOWED_DEV_STORE" "$DATABASE_URL" \
              <<< "SELECT COUNT(*) FROM \"Shop\" WHERE domain <> :'allowed';")
            [[ "$N" =~ ^[0-9]+$ ]] || fail E2E_SHOP_COUNT_INVALID
            echo "e2e_shop_candidates=$N"
            [ "$N" != "0" ] || fail E2E_SHOP_NOT_FOUND
            [ "$N" = "1" ] || fail E2E_SHOP_NOT_UNIQUE "candidates=$N"
            SELECTED=$(psql -X -v ON_ERROR_STOP=1 -t -A -v allowed="$ALLOWED_DEV_STORE" "$DATABASE_URL" \
              <<< "SELECT domain FROM \"Shop\" WHERE domain <> :'allowed';")
            [[ "$SELECTED" =~ $SHOP_RE ]] || fail E2E_SHOP_INVALID
            echo "::add-mask::$SELECTED"
          fi
          [ "$SELECTED" != "$ALLOWED_DEV_STORE" ] || fail E2E_SHOP_IS_ALLOWED_DEV_STORE
          echo "E2E_SHOP_DOMAIN=$SELECTED" >> "$GITHUB_ENV"
          echo "e2e_shop_select=ok"
          # End E2E shop selection

      # DB state for the selected shop, plus the allowed-store guard counts.
      # Session has no created/updated columns, so freshness after reinstall is
      # shown by e2e_offline_session_expires_at (expiring offline tokens get a
      # new expiry when issued). Onboarding "complete" is computed per request
      # from Admin API + DB + env and is not stored, so it prints unknown; the
      # stored parts (default terms, dismissed) are printed instead.
      # e2e_initial_sync_status mirrors getInitialSyncState()
      # (app/lib/initial-sync.server.ts).
      - name: E2E DB checks
        id: e2e_db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          # Secret, so the env header prints *** (#190 F1).
          ALLOWED_DEV_STORE: ${{ secrets.ALLOWED_DEV_STORE }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          DB_OUT=$(mktemp)
          trap 'rm -f "$DB_OUT"' EXIT
          psql -X -v ON_ERROR_STOP=1 -t -A -F '|' \
            -v shop="$E2E_SHOP_DOMAIN" -v allowed="$ALLOWED_DEV_STORE" "$DATABASE_URL" > "$DB_OUT" <<'EOSQL'
          WITH s AS (SELECT * FROM "Shop" WHERE domain = :'shop'),
          sess AS (SELECT * FROM "Session" WHERE shop = :'shop'),
          off AS (SELECT * FROM sess WHERE "isOnline" = false),
          bulk AS (SELECT * FROM s6_bulk_operations WHERE shop = :'shop'),
          comp AS (
            SELECT bulk_operation_id, completed_at, failure_count, started_at FROM bulk
            WHERE origin = 'reconcile' AND reconcile_stage = 'companies'
            ORDER BY started_at DESC LIMIT 1),
          cust AS (
            SELECT bulk_operation_id, completed_at, failure_count FROM bulk
            WHERE origin = 'reconcile' AND reconcile_stage = 'customers'
              AND started_at >= (SELECT started_at FROM comp)
            ORDER BY started_at DESC LIMIT 1),
          ord AS (
            SELECT bulk_operation_id, completed_at, failure_count FROM bulk
            WHERE origin = 'reconcile' AND reconcile_stage = 'orders'
              AND started_at >= (SELECT started_at FROM comp)
            ORDER BY started_at DESC LIMIT 1),
          ids AS (
            SELECT bulk_operation_id FROM comp
            UNION ALL SELECT bulk_operation_id FROM cust
            UNION ALL SELECT bulk_operation_id FROM ord),
          sync AS (
            SELECT CASE
              WHEN NOT EXISTS (SELECT 1 FROM comp) THEN 'not_started'
              WHEN EXISTS (SELECT 1 FROM comp WHERE failure_count >= 5)
                OR EXISTS (SELECT 1 FROM cust WHERE failure_count >= 5)
                OR EXISTS (SELECT 1 FROM ord WHERE failure_count >= 5)
                OR EXISTS (
                  SELECT 1 FROM s6_dead_letter d
                  WHERE d.message->>'bulkOperationId' IN (SELECT bulk_operation_id FROM ids)
                    AND d.message->>'topic' IN ('RECONCILE_COMPANIES', 'RECONCILE_CUSTOMERS', 'RECONCILE_ORDERS', 'BULK_OPERATIONS_FINISH'))
                THEN 'failed'
              WHEN EXISTS (SELECT 1 FROM comp WHERE completed_at IS NOT NULL)
                AND EXISTS (SELECT 1 FROM ord WHERE completed_at IS NOT NULL)
                AND CASE WHEN EXISTS (SELECT 1 FROM cust)
                         THEN EXISTS (SELECT 1 FROM cust WHERE completed_at IS NOT NULL)
                         ELSE NOT EXISTS (
                           SELECT 1 FROM pgmq.q_s6_sync q
                           WHERE q.message->>'shop' = :'shop' AND q.message->>'topic' = 'RECONCILE_CUSTOMERS')
                    END
                THEN 'done'
              ELSE 'in_progress'
            END AS status)
          SELECT k, v FROM (VALUES
            (1, 'e2e_installed_shop_count', (SELECT COUNT(*) FROM "Shop" WHERE "uninstalledAt" IS NULL)::text),
            (2, 'e2e_shop_rows_for_selected', (SELECT COUNT(*) FROM s)::text),
            (3, 'e2e_uninstalled_at_set', COALESCE((SELECT bool_or("uninstalledAt" IS NOT NULL) FROM s)::text, 'unknown')),
            (4, 'e2e_uninstalled_at', COALESCE((SELECT to_char(max("uninstalledAt") AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS"Z"') FROM s), 'null')),
            (5, 'e2e_db_currency_is_inr', COALESCE((SELECT bool_and(currency = 'INR') FROM s)::text, 'unknown')),
            (6, 'e2e_onboarding_default_terms_set', COALESCE((SELECT bool_and("defaultTermsDays" IS NOT NULL AND "defaultTermsDays" > 0) FROM s)::text, 'unknown')),
            (7, 'e2e_onboarding_dismissed', COALESCE((SELECT bool_and(onboarding_dismissed_at IS NOT NULL) FROM s)::text, 'unknown')),
            (8, 'e2e_onboarding_complete', 'unknown'),
            (9, 'e2e_session_rows', (SELECT COUNT(*) FROM sess)::text),
            (10, 'e2e_offline_session_rows', (SELECT COUNT(*) FROM off)::text),
            (11, 'e2e_offline_session_with_token', (SELECT COALESCE(bool_or("accessToken" IS NOT NULL AND "accessToken" <> ''), false) FROM off)::text),
            (12, 'e2e_offline_session_expires_at', COALESCE((SELECT to_char(max(expires), 'YYYY-MM-DD"T"HH24:MI:SS"Z"') FROM off), 'null')),
            (13, 'e2e_offline_session_expired', (SELECT COALESCE(max(expires) <= (now() AT TIME ZONE 'UTC'), false) FROM off)::text),
            (14, 'e2e_offline_session_has_refresh_token', (SELECT COALESCE(bool_or("refreshToken" IS NOT NULL AND "refreshToken" <> ''), false) FROM off)::text),
            (15, 'e2e_offline_session_needs_reauth', (SELECT COALESCE(bool_or("needsReauth"), false) FROM off)::text),
            (16, 'e2e_initial_sync_status', (SELECT status FROM sync)),
            (17, 'e2e_bulk_ops_rows', (SELECT COUNT(*) FROM bulk)::text),
            (18, 'e2e_open_bulk_ops', (SELECT COUNT(*) FROM bulk WHERE completed_at IS NULL)::text),
            (19, 'e2e_dlq_rows', (SELECT COUNT(*) FROM s6_dead_letter WHERE message->>'shop' = :'shop')::text),
            (20, 'e2e_webhook_receipts_rows', (SELECT COUNT(*) FROM webhook_receipts WHERE shop = :'shop')::text),
            (21, 'e2e_webhook_receipts_app_uninstalled', (SELECT COUNT(*) FROM webhook_receipts WHERE shop = :'shop' AND topic = 'APP_UNINSTALLED')::text),
            (22, 'e2e_buyer_accounts', (SELECT COUNT(*) FROM "BuyerAccount" WHERE "shopId" IN (SELECT id FROM s))::text),
            (23, 'e2e_invoices', (SELECT COUNT(*) FROM "Invoice" WHERE "shopId" IN (SELECT id FROM s))::text),
            (24, 'allowed_shop_buyer_accounts', (SELECT COUNT(*) FROM "BuyerAccount" ba JOIN "Shop" a ON a.id = ba."shopId" WHERE a.domain = :'allowed')::text),
            (25, 'allowed_shop_invoices', (SELECT COUNT(*) FROM "Invoice" i JOIN "Shop" a ON a.id = i."shopId" WHERE a.domain = :'allowed')::text)
          ) AS t(n, k, v)
          ORDER BY n;
          EOSQL
          # E2E DB summary (allow-listed shapes only)
          VALUE_RE='^([0-9]{1,12}|true|false|null|unknown|not_started|in_progress|done|failed|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)$'
          OFFLINE_OK=false
          TOKEN_EXPIRED=unknown
          UNINSTALLED=unknown
          while IFS='|' read -r k v; do
            [[ "$k" =~ ^[a-z0-9_]{1,64}$ ]] || continue
            [[ "$v" =~ $VALUE_RE ]] || v=invalid
            echo "$k=$v"
            case "$k" in
              e2e_offline_session_with_token) OFFLINE_OK="$v" ;;
              e2e_offline_session_expired) TOKEN_EXPIRED="$v" ;;
              e2e_uninstalled_at_set) UNINSTALLED="$v" ;;
            esac
          done < "$DB_OUT"
          {
            echo "offline_session_with_token=$OFFLINE_OK"
            echo "token_expired=$TOKEN_EXPIRED"
            echo "uninstalled=$UNINSTALLED"
          } >> "$GITHUB_OUTPUT"
          # End E2E DB summary

      # Admin API (queries only) with the selected shop's offline token.
      # NOTE: webhookSubscriptions returns only shop-specific (API-created)
      # subscriptions; this app's subscriptions are app-specific (declared in
      # shopify.app.toml), which the Admin API does not list. So present=0 is
      # expected and e2e_webhooks_match prints unknown in that case; the
      # meaningful check is e2e_webhooks_extra=0 (no stray API subscriptions).
      # Delivery is shown by e2e_webhook_receipts_rows in the DB step.
      - name: E2E Admin checks
        id: e2e_admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          OFFLINE_OK: ${{ steps.e2e_db.outputs.offline_session_with_token }}
          TOKEN_EXPIRED: ${{ steps.e2e_db.outputs.token_expired }}
          UNINSTALLED: ${{ steps.e2e_db.outputs.uninstalled }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          source scripts/ci/psql-redacted.sh  # redact DB host from psql stderr (#190 F2)
          # E2E Admin gate
          if [ "$UNINSTALLED" != "false" ]; then
            echo "e2e_admin=skipped_shop_uninstalled"
            exit 0
          fi
          if [ "$OFFLINE_OK" != "true" ]; then
            echo "e2e_admin=skipped_no_offline_session"
            exit 0
          fi
          # Read-only mode never refreshes; skip unless definitely not expired.
          if [ "$TOKEN_EXPIRED" != "false" ]; then
            echo "e2e_admin=skipped_token_expired"
            exit 0
          fi
          # End E2E Admin gate

          ACCESS_TOKEN=$(psql -X -v ON_ERROR_STOP=1 -v shop="$E2E_SHOP_DOMAIN" -t -A "$DATABASE_URL" <<'EOSQL'
          SELECT "accessToken"
          FROM "Session"
          WHERE shop = :'shop' AND "isOnline" = false AND "accessToken" <> ''
          ORDER BY expires DESC NULLS LAST
          LIMIT 1;
          EOSQL
          )
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "e2e_admin=skipped_no_access_token"
            exit 0
          fi
          echo "::add-mask::$ACCESS_TOKEN"

          CURL_CONFIG=""
          HTTP_RESPONSE=""
          EXPECTED_TOPICS_FILE=""
          cleanup() {
            rm -f "$CURL_CONFIG" "$HTTP_RESPONSE" "$EXPECTED_TOPICS_FILE"
          }
          trap cleanup EXIT

          CURL_CONFIG=$(mktemp)
          chmod 600 "$CURL_CONFIG"
          cat > "$CURL_CONFIG" <<EOF
          header = "Content-Type: application/json"
          header = "X-Shopify-Access-Token: $ACCESS_TOKEN"
          EOF
          unset ACCESS_TOKEN

          # E2E Admin query and summary (counts/booleans only)
          # Expected topics: every `topics = [...]` entry in shopify.app.toml
          # (compliance_topics excluded: they cannot be API subscriptions),
          # as WebhookSubscriptionTopic enums (orders/updated -> ORDERS_UPDATED).
          EXPECTED_TOPICS_FILE=$(mktemp)
          { grep -E '^[[:space:]]*topics[[:space:]]*=' shopify.app.toml || true; } \
            | grep -oE '"[a-z_]+/[a-z_]+"' | tr -d '"' | tr 'a-z/' 'A-Z_' | sort -u > "$EXPECTED_TOPICS_FILE"
          E2E_QUERY='{"query":"{ shop { currencyCode } webhookSubscriptions(first: 100) { nodes { topic } } validations(first: 50) { nodes { enabled shopifyFunction { handle } } } paymentCustomizations(first: 50) { nodes { enabled shopifyFunction { handle } } } }"}'
          HTTP_RESPONSE=$(mktemp)
          E2E_STATUS=$(curl -s -w "%{http_code}" -o "$HTTP_RESPONSE" \
            -X POST \
            --config "$CURL_CONFIG" \
            --data-binary "$E2E_QUERY" \
            "https://${E2E_SHOP_DOMAIN}/admin/api/2026-10/graphql.json" || echo "000")
          if [ "$E2E_STATUS" != "200" ]; then
            echo "::warning::e2e Admin query failed with HTTP $E2E_STATUS"
            echo "e2e_admin=error http_status=$E2E_STATUS"
          elif ! jq -e . "$HTTP_RESPONSE" >/dev/null 2>&1; then
            echo "::warning::e2e Admin response was not JSON"
            echo "e2e_admin=error parse_failed"
          elif jq -e '(.errors | length) > 0' "$HTTP_RESPONSE" >/dev/null 2>&1; then
            echo "::warning::e2e Admin query returned GraphQL errors"
            echo "e2e_admin=error error_codes=$(jq -r '[.errors[] | .extensions.code // "UNKNOWN" | tostring | if test("^[A-Z0-9_]{1,40}$") then . else "UNKNOWN" end] | join(",")' "$HTTP_RESPONSE")"
          else
            jq -r --rawfile exp "$EXPECTED_TOPICS_FILE" '
              def okenum: type == "string" and test("^[A-Z0-9_]{1,64}$");
              ($exp | split("\n") | map(select(okenum)) | unique) as $e
              | [.data.webhookSubscriptions.nodes[]? | .topic] as $raw
              | ($raw | map(if okenum then . else "INVALID_TOPIC" end) | unique) as $p
              | [.data.validations.nodes[]? | select(.shopifyFunction.handle == "credit-check-validation")] as $v
              | [.data.paymentCustomizations.nodes[]? | select(.shopifyFunction.handle == "hide-terms-payment")] as $pc
              | .data.shop.currencyCode as $cur
              | "e2e_admin=ok",
                "e2e_currency_is_inr=\(if ($cur | type) == "string" then ($cur == "INR") else "unknown" end)",
                "e2e_webhooks_expected=\($e | length)",
                "e2e_webhooks_shop_specific_rows=\($raw | length)",
                "e2e_webhooks_present=\([$p[] | select(. as $t | $e | index($t))] | length)",
                "e2e_webhooks_missing=\([$e[] | select(. as $t | $p | index($t) | not)] | length)",
                "e2e_webhooks_extra=\([$p[] | select(. as $t | $e | index($t) | not)] | length)",
                "e2e_webhooks_match=\(if ($raw | length) == 0 then "unknown" else ($p == $e) end)",
                "e2e_validation_count=\($v | length)",
                "e2e_validation_enabled_count=\([$v[] | select(.enabled == true)] | length)",
                "e2e_payment_customization_count=\($pc | length)",
                "e2e_payment_customization_enabled_count=\([$pc[] | select(.enabled == true)] | length)"' "$HTTP_RESPONSE"
          fi
          # End E2E Admin query and summary
