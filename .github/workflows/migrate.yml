# Database Migrations Workflow
# Runs prisma migrate deploy on pushes to main
# Uses Supabase's SESSION pooler (port 5432) for migrations
# Skips when DATABASE_URL_MIGRATIONS secret is not set (forks/PRs without access)

name: Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'prisma/**'

jobs:
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    # Only run if the secret is available (skip for forks without secrets)
    if: ${{ vars.ENABLE_MIGRATIONS != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for migration secret
        id: check-secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL_MIGRATIONS }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::DATABASE_URL_MIGRATIONS secret not set - skipping migrations"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run migrations
        if: steps.check-secret.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: npx prisma migrate deploy

      - name: Migration status
        if: steps.check-secret.outputs.skip == 'true'
        run: |
          echo "⚠️ Migrations skipped - DATABASE_URL_MIGRATIONS secret not configured"
          echo "To enable migrations:"
          echo "1. Create a Supabase project"
          echo "2. Get the SESSION pooler connection string (port 5432)"
          echo "3. Add it as DATABASE_URL_MIGRATIONS in GitHub Secrets"
