# This file stores configurations for your Shopify app.
# The client_id will be populated when you run `shopify app config link`
client_id = ""
name = "Net Terms Receivables"
application_url = "https://net-terms-receivables.example.workers.dev"
embedded = true

[access_scopes]
# Start with no scopes - add only when features require them
# B2B wholesale net-terms will eventually need: read_orders, read_customers
# Request protected customer data scopes only after filing DPDP form
scopes = ""

[webhooks]
api_version = "2026-10"

  # App lifecycle webhooks
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps (GDPR/CCPA)
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[auth]
redirect_urls = [
  "https://net-terms-receivables.<YOUR_WORKERS_SUBDOMAIN>.workers.dev/auth/callback",
  "https://localhost/auth/callback"
]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
