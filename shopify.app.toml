# This file stores configurations for your Shopify app.
# The client_id will be populated when you run `shopify app config link`
client_id = "dbfae79a0ca15489c7467598bce10965"
name = "Net Terms Receivables"
application_url = "https://net-terms-receivables.raghavkhanna.workers.dev"
embedded = true

[access_scopes]
# See docs/scopes.md for the complete scope audit with justifications and reference URLs.
#
# S24 scope reduction: Dropped read_companies, read_customers, read_orders because
# per https://shopify.dev/docs/api/usage/access-scopes 'How it works' section:
# "Any scope that writes a resource also grants read access to it, so request
# the write scope only when your app needs both."
# We keep write_companies, write_customers, write_orders, so read access is implied.
#
# Read scopes (3):
# - read_draft_orders: Draft order payment terms (S8)
# - read_all_orders: Extends write_orders read access to orders >60 days old (requested 25 Oct 2026 22:13 IST; grant evidence accepted by Team Lead; to be confirmed by DevOps's post-release granted-scopes check)
# - read_payment_terms: Payment terms on orders and company locations (S6)
#
# Write scopes (6):
# - write_companies: metafieldsSet on Company/CompanyLocation (S11), implies read_companies
# - write_customers: metafieldsSet on Customer (S11), implies read_customers
# - write_merchant_managed_fulfillment_orders: fulfillmentOrderHold/Release (S13 pre-grant)
# - write_orders: orderMarkAsPaid, tagsAdd (S17), implies read_orders
# - write_payment_customizations: paymentCustomizationCreate (S13 pre-grant)
# - write_validations: validationCreate (S12)
#
# NOT in production: write_draft_orders, write_payment_terms, read_locations.
# To add write_draft_orders for local development, run `shopify app config link` to create
# a local shopify.app.dev.toml (gitignored).
# See https://shopify.dev/docs/apps/build/cli-for-apps/manage-app-config-files
scopes = "read_draft_orders,read_all_orders,read_payment_terms,write_companies,write_customers,write_merchant_managed_fulfillment_orders,write_orders,write_payment_customizations,write_validations"

[webhooks]
api_version = "2026-10"

  # App lifecycle webhooks
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # S21: App subscription update webhook (billing/plan changes)
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  # Mandatory compliance topics for public apps (GDPR/CCPA)
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

  # S6: Company sync webhooks (B2B buyer accounts)
  # Maps Company/CompanyLocation to BuyerAccount (kind=COMPANY)
  [[webhooks.subscriptions]]
  uri = "/webhooks/companies"
  topics = ["companies/create", "companies/update", "companies/delete"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/company_locations"
  topics = ["company_locations/create", "company_locations/update", "company_locations/delete"]

  # S6: Order sync webhooks (net-terms invoices)
  # Tracks orders with payment terms for invoice management
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = ["orders/create", "orders/updated", "orders/cancelled", "orders/paid"]

  # S6: Bulk operations webhook (backfill completion)
  # Triggers JSONL download/processing for company and order backfills
  [[webhooks.subscriptions]]
  uri = "/webhooks/bulk_operations/finish"
  topics = ["bulk_operations/finish"]

  # S8: Customer sync webhooks (tagged buyer accounts)
  # Maps Customers with matching tags to BuyerAccount (kind=TAGGED_CUSTOMER)
  # DPDP: Only id and tags are extracted; no PII stored
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers"
  topics = ["customers/create", "customers/update", "customers/delete"]

  # S8: Draft order sync webhooks (pending credit exposure)
  # Tracks draft orders with payment terms for credit limit calculation
  [[webhooks.subscriptions]]
  uri = "/webhooks/draft_orders"
  topics = ["draft_orders/create", "draft_orders/update", "draft_orders/delete"]

[auth]
redirect_urls = ["https://net-terms-receivables.raghavkhanna.workers.dev/auth/callback"]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false

# Note: Metafield definitions for credit_status on CompanyLocation and Customer
# are created programmatically in S11 via metafieldDefinitionCreate, not via TOML.
# The TOML format's supported owner_type list at shopify.dev does not explicitly
# confirm company_location and customer as deployable.
# @see docs/metafields-contract.md
