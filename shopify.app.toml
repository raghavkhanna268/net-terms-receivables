# This file stores configurations for your Shopify app.
# The client_id will be populated when you run `shopify app config link`
client_id = "dbfae79a0ca15489c7467598bce10965"
name = "Net Terms Receivables"
application_url = "https://net-terms-receivables.raghavkhanna.workers.dev"
embedded = true

[access_scopes]
# S6: Scopes for company/order sync
# - read_companies: Access B2B companies and company locations
# - read_orders: Access orders (last 60 days without read_all_orders)
# - read_payment_terms: Access payment terms on orders and company locations
# S8 (pre-granted): Tagged customer and draft order scopes for customer sync
# - read_customers: Access customers with net-terms tags
# - read_draft_orders: Access draft orders for payment terms
# Pre-granting avoids a second scope re-approval when S8 ships.
scopes = "read_companies,read_orders,read_payment_terms,read_customers,read_draft_orders"

[webhooks]
api_version = "2026-10"

  # App lifecycle webhooks
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps (GDPR/CCPA)
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

  # S6: Company sync webhooks (B2B buyer accounts)
  # Maps Company/CompanyLocation to BuyerAccount (kind=COMPANY)
  [[webhooks.subscriptions]]
  uri = "/webhooks/companies"
  topics = ["companies/create", "companies/update", "companies/delete"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/company_locations"
  topics = ["company_locations/create", "company_locations/update", "company_locations/delete"]

  # S6: Order sync webhooks (net-terms invoices)
  # Tracks orders with payment terms for invoice management
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = ["orders/create", "orders/updated", "orders/cancelled", "orders/paid"]

  # S6: Bulk operations webhook (backfill completion)
  # Triggers JSONL download/processing for company and order backfills
  [[webhooks.subscriptions]]
  uri = "/webhooks/bulk_operations/finish"
  topics = ["bulk_operations/finish"]

[auth]
redirect_urls = ["https://net-terms-receivables.raghavkhanna.workers.dev/auth/callback"]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
