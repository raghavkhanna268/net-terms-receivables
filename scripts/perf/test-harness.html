<!DOCTYPE html>
<!--
  Web Vitals Test Harness (S23)
  
  Standalone HTML page for measuring Web Vitals on React components
  with fixture data. This bypasses Shopify auth for lab testing.
  
  Uses Polaris CDN styles and App Bridge stubs.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web Vitals Test Harness</title>
  <link rel="preconnect" href="https://cdn.shopify.com/" />
  <link rel="stylesheet" href="https://cdn.shopify.com/static/fonts/inter/v4/styles.css" />
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #f6f6f7;
    }
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 1.2rem;
      color: #6d7175;
    }
    #loading.hidden {
      display: none;
    }
    #app {
      display: none;
    }
    #app.loaded {
      display: block;
    }
  </style>
</head>
<body>
  <div id="loading">Loading test harness...</div>
  <div id="app"></div>
  
  <!-- Mock App Bridge -->
  <script>
    window.shopify = {
      webVitals: {
        onReport: function() {}
      },
      environment: {
        embedded: false,
        mobile: false
      },
      config: {
        apiKey: 'test-api-key',
        shop: 'test-shop.myshopify.com',
        locale: 'en'
      },
      toast: {
        show: function() {}
      },
      modal: {
        show: function() {}
      },
      idToken: function() {
        return Promise.resolve('test-token');
      }
    };
    
    // Web Vitals results collector
    window.__WEB_VITALS_RESULTS__ = [];
  </script>
  
  <!-- Web Vitals Library -->
  <script type="module">
    import { onLCP, onCLS, onINP } from 'https://unpkg.com/web-vitals@4.2.4/dist/web-vitals.js';
    
    function report(metric) {
      window.__WEB_VITALS_RESULTS__.push({
        name: metric.name,
        value: metric.value,
        rating: metric.rating,
        delta: metric.delta
      });
      console.log('[WebVital]', metric.name, '=', metric.value.toFixed(2), metric.rating);
    }
    
    onLCP(report);
    onCLS(report);
    onINP(report, { reportAllChanges: true });
    
    // Expose for Playwright
    window.__WEB_VITALS_READY__ = true;
  </script>
  
  <!-- Harness script - loads after route param is parsed -->

          outstandingPaise: String(Math.floor(Math.random() * 5000000) + 100000),
          currency: "INR",
          daysPastDue: -daysOffset

    function Onboarding({ data }) {

                )

            )

        )
      );
    }
    
    function Account({ data }) {
      return h('div', { className: 'page' },
        h('s-page', { heading: data.account.name },
          h('s-link', { href: '/', slot: 'breadcrumb-actions' }, 'Back to Dashboard'),

              ),
              h('s-paragraph', null,
                h('s-text', { type: 'strong' }, 'Outstanding: '),
                h('s-text', null, formatPaise(data.creditStatus.exposurePaise))
              ),
              h('s-paragraph', null,

    function formatPaise(paise) {
      if (!paise) return '₹0.00';
      const rupees = parseInt(paise) / 100;
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2
      }).format(rupees);
    }
    
    // Render the appropriate page
    const data = window.__FIXTURE_DATA__;
    let Component;
    
    switch (route) {
      case 'dashboard': Component = Dashboard; break;
      case 'onboarding': Component = Onboarding; break;
      case 'account': Component = Account; break;
      case 'imports': Component = Imports; break;
      default: Component = Dashboard;
    }
    
    loading.classList.add('hidden');
    container.classList.add('loaded');
    
    const root = ReactDOM.createRoot(container);
    root.render(h(Component, { data }));
    
    console.log('[Harness] Page rendered:', route);
  </script>
</body>
</html>
